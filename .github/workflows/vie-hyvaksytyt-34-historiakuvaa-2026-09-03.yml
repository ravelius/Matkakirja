name: Vie hyväksytyt 34 historian kuvaa R2:een 2026-09-03

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vie-hyvaksytyt-34-historiakuvaa-2026-09-03.yml'

permissions:
  contents: read

concurrency:
  group: vie-hyvaksytyt-34-historiakuvaa-2026-09-03
  cancel-in-progress: false

jobs:
  vie:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_supported
      DRIVE_AVAIN: ${{ secrets.SAMIREIVINEN_DRIVE_API }}
      R2_TILI: ${{ secrets.R2_ACCOUNT_ID }}
      R2_AMPARI: ${{ secrets.R2_BUCKET }}
      JULKINEN: https://pub-7bc0ed2083a74a68bd7115618bca4709.r2.dev

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tarkista yhteydet
        run: |
          set -euo pipefail
          puuttuu=""
          [ -n "$DRIVE_AVAIN" ] || puuttuu="$puuttuu SAMIREIVINEN_DRIVE_API"
          [ -n "$R2_TILI" ] || puuttuu="$puuttuu R2_ACCOUNT_ID"
          [ -n "${AWS_ACCESS_KEY_ID:-}" ] || puuttuu="$puuttuu R2_ACCESS_KEY_ID"
          [ -n "${AWS_SECRET_ACCESS_KEY:-}" ] || puuttuu="$puuttuu R2_SECRET_ACCESS_KEY"
          [ -n "$R2_AMPARI" ] || puuttuu="$puuttuu R2_BUCKET"
          if [ -n "$puuttuu" ]; then
            echo "::error::Puuttuvat repository secretit:$puuttuu"
            exit 1
          fi

