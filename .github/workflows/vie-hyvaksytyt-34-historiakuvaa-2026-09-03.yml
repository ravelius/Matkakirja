            ['1fKyjcQ0c40qRYdEr6MdXhx1P7sj63YbB', 'hetki-kolumbus-santa-fe-1492-lahi-photo-v3.jpg', '7d83cee9f90dcf989c07b2cb3b1b68045fedb74797a7a498aeed38af72a11383', 1536, 1024],
            ['1IpA21ikgk1PjK9TSYY4J95mrd7pWeZmJ', 'hetki-magalhaes-sanlucar-1519-kauko-photo-v3.jpg', 'acdf7b9045b18d7341e93ae8518f15f85d85d214c9444111cd337e97fc7c69dc', 1536, 1024],
            ['1XCC10jkBRs11CcFzjYbMS_qFJMeQH_rY', 'hetki-magalhaes-sanlucar-1519-lahi-photo-v3.jpg', '2ccf31b9d75c06a5c5e38151d129406c15d0fed18ec2bfa82ae949f14511012e', 1536, 1024],
            ['1dIwirxrmePeBqovHeb5BRM-0E7n_Gik0', 'hetki-nansen-fram-1893-kauko-photo-v3.jpg', '6bcb21319d02ed4e249c3d47fa1e5358dd103573d3710dbfd033be34473883ad', 1536, 1024],
