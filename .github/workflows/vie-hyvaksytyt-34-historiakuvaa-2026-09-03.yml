            ['1Bl4dBv6qiWv_5NWfjqZehulx0urMRriv', 'hetki-rontgen-kasi-1895-lahi-photo-v3.jpg', '97f270f83db63346f3880269c9097413ebb8b927b1bb22128f21c9d707ca2374', 1536, 1024],
            ['1cpuhRecn71fY4FIaD5K6s09xD-RREtEx', 'hetki-titanic-daily-graphic-1912-lehti-photo-v3.jpg', '9b4701fb06131dbccec2324d90f7b5c8d63e6396c88b6aa13d501e99589c2dd0', 1024, 1536],
            ['14nNxVFll3SsdHqSl-ivTYqzEgmploeTr', 'hetki-titanic-southampton-1912-kauko-photo-v3.jpg', '6fdada724c396bf1f3e08f69f6ad3d3f4907df1e2ae07651f73c8da91ce583e7', 1536, 1024],
            ['1amtUBkxhaq18BSAkv5jbhFcIivZlRpF3', 'hetki-titanic-southampton-1912-lahi-photo-v3.jpg', '4b48cbebd59521722155bbc69886f9ae9b7533ab5f48fa5748e42302fddbc5ca', 1536, 1024],
            ['1DrGQvn0M1b9c-N65_7dbD5-9zzBmptAw', 'hetki-trafalgar-the-times-1805-lehti-photo-v3.jpg', 'dc3fef148114c0d922ccbfe58a72c608940544d62868f5df0afffe7b19110ebd', 1024, 1536],
            ['167LbzfF7Kps01nqBB2ROyQ3qMNl2rUZh', 'hetki-trafalgar-victory-1805-kauko-photo-v3.jpg', '042ef699687048f44eba5f6abdfc6f697c5d065d39d67e3871d8f31e93ebdb92', 1536, 1024],
            ['1pBgQwTw3rprlay3RUsYBHa7ZImm3AN3w', 'hetki-trafalgar-victory-1805-lahi-photo-v3.jpg', '08f6592b572a438b0553b7ba35fd7ba6a3eb1226b680eb7a809076ee807eb400', 1536, 1024],
            ['15lzVSdFPC0Rs0legWSY8UPcqLsvVjiy7', 'hetki-vasco-da-gama-restelo-1497-kauko-photo-v3.jpg', 'e0c06c468a8f98669f91edaa6d868f9a5c9ff6b24be84bbba20387e851ff87dc', 1536, 1024],
            ['1pMCBJEyiiNVBM5yJRxoZVPzPluyUuSfW', 'hetki-vasco-da-gama-restelo-1497-lahi-photo-v3.jpg', '623b058684ad4c0545b241752acea7b149fb9e10b7c0e4ff927032cee27a02ad', 1536, 1024],
            ['1Jd9k8L5QufuNRK9Y7ZHDiTz7gMc5XXrf', 'hetki-viikinkilaiva-roskilde-1040-kauko-photo-v3.jpg', 'a5db8967a7d2bb2175f17a731400dfdc9262dcf78c12c62155795fcf2e17df26', 1536, 1024],
            ['1zlzPBnmWZKs7y1Ht-Us7WF9Pf1B2tHK8', 'hetki-viikinkilaiva-roskilde-1040-lahi-photo-v3.jpg', 'bad6106c30208be783ead55a5cbd06dd8a3d6348652a2cf615fb6b20662f865b', 1536, 1024],
            ['1-EPkwB0FisUzuqhL4TW0kxvDEAd-Pdwl', 'hetki-wright-kitty-hawk-1903-kauko-photo-v3.jpg', '15a26680bd372f13fe510c6d520345945c9c71b660bfb9aedb50ed214214b0de', 1536, 1024],
            ['1yZdaH6tLN1lH9pAMfDw9u5elACxmd4i-', 'hetki-wright-kitty-hawk-1903-lahi-photo-v3.jpg', 'a2b5f9ce59e26f279768c9c06f9ae2b9b3e0a8b4b5eff11392cb7cb450141db4', 1536, 1024],
          ];

          function jpegMitat(data) {
            if (data[0] !== 0xff || data[1] !== 0xd8) throw new Error('ei ole JPEG');
            let i = 2;
            while (i + 9 < data.length) {
              if (data[i] !== 0xff) { i += 1; continue; }
              const merkki = data[i + 1];
              if (merkki === 0xd8 || merkki === 0xd9) { i += 2; continue; }
              const pituus = data.readUInt16BE(i + 2);
              if (pituus < 2 || i + 2 + pituus > data.length) break;
              if ([0xc0, 0xc1, 0xc2, 0xc3, 0xc5, 0xc6, 0xc7, 0xc9, 0xca, 0xcb, 0xcd, 0xce, 0xcf].includes(merkki)) {
                return { korkeus: data.readUInt16BE(i + 5), leveys: data.readUInt16BE(i + 7) };
              }
              i += 2 + pituus;
            }
            throw new Error('JPEG-mittoja ei löytynyt');
          }

          await mkdir('r2-out', { recursive: true });
          for (const [id, nimi, odotettuSha, leveys, korkeus] of kuvat) {
            const julkinen = `${process.env.JULKINEN}/kohtaamiset/historian-hetket/${nimi}?t=${Date.now()}`;
            const vanha = await fetch(julkinen, { headers: { 'Cache-Control': 'no-cache' } });
            if (vanha.ok) {
              const vanhaData = Buffer.from(await vanha.arrayBuffer());
              const vanhaSha = createHash('sha256').update(vanhaData).digest('hex');
              if (vanhaSha !== odotettuSha) throw new Error(`${nimi}: nimiristiriita, R2:ssa eri sisältö`);
              console.log(`${nimi}: sama hyväksytty versio oli jo R2:ssa`);
            } else if (vanha.status !== 404) {
              throw new Error(`${nimi}: R2-esitarkistus HTTP ${vanha.status}`);
            }

            const url = `https://www.googleapis.com/drive/v3/files/${id}?alt=media&key=${process.env.DRIVE_AVAIN}`;
            const vastaus = await fetch(url);
            if (!vastaus.ok) throw new Error(`${nimi}: Drive HTTP ${vastaus.status}`);
            const data = Buffer.from(await vastaus.arrayBuffer());
            const sha = createHash('sha256').update(data).digest('hex');
            if (sha !== odotettuSha) throw new Error(`${nimi}: SHA-256 ei täsmää`);
            const mitat = jpegMitat(data);
            if (mitat.leveys !== leveys || mitat.korkeus !== korkeus) {
              throw new Error(`${nimi}: ${mitat.leveys}x${mitat.korkeus}, odotettiin ${leveys}x${korkeus}`);
            }
            if (!data.includes(Buffer.from('ICC_PROFILE'))) throw new Error(`${nimi}: ICC-profiili puuttuu`);
            await writeFile(`r2-out/${nimi}`, data);
            console.log(`${nimi}: Drive, JPEG, ${leveys}x${korkeus}, ICC ja SHA-256 kunnossa`);
          }
          SKRIPTI

      - name: Vie kuvat R2-mediämpäriin
        run: |
          set -euo pipefail
          aws s3 sync r2-out "s3://$R2_AMPARI/kohtaamiset/historian-hetket" \
            --endpoint-url "https://$R2_TILI.r2.cloudflarestorage.com" \
            --no-progress --size-only --content-type image/jpeg \
            --cache-control "public, max-age=31536000, immutable"

      - name: Varmista julkinen R2 tavutasolla
        run: |
          set -euo pipefail
          node --input-type=module <<'SKRIPTI'
          import { readFile, readdir } from 'node:fs/promises';
          import { createHash } from 'node:crypto';

          const nimet = (await readdir('r2-out')).sort();
          if (nimet.length !== 34) throw new Error(`tiedostoja ${nimet.length}, odotettiin 34`);
          for (const nimi of nimet) {
            const paikallinen = await readFile(`r2-out/${nimi}`);
            let vastaus;
            for (let yritys = 1; yritys <= 12; yritys += 1) {
              vastaus = await fetch(`${process.env.JULKINEN}/kohtaamiset/historian-hetket/${nimi}?t=${Date.now()}`, {
                headers: { Origin: 'https://ravelius.github.io', 'Cache-Control': 'no-cache' },
              });
              if (vastaus.ok) break;
              await new Promise((resolve) => setTimeout(resolve, 2000));
            }
            if (!vastaus?.ok) throw new Error(`${nimi}: R2 HTTP ${vastaus?.status}`);
            const tyyppi = vastaus.headers.get('content-type') ?? '';
            if (!tyyppi.startsWith('image/jpeg')) throw new Error(`${nimi}: R2 MIME ${tyyppi}`);
            if (!vastaus.headers.get('access-control-allow-origin')) throw new Error(`${nimi}: CORS puuttuu`);
            const ladattu = Buffer.from(await vastaus.arrayBuffer());
            const paikallinenSha = createHash('sha256').update(paikallinen).digest('hex');
            const ladattuSha = createHash('sha256').update(ladattu).digest('hex');
            if (ladattuSha !== paikallinenSha) throw new Error(`${nimi}: takaisinluettu SHA-256 ei täsmää`);
            console.log(`${nimi}: julkinen JPEG, CORS ja tavut kunnossa`);
          }
          SKRIPTI
