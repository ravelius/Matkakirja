# Ulkoinen TestFlight-ryhmä (apurahan arvioijien julkinen linkki).
# Omistaja 30.9.2026 (suora lupa Julkaisijan sessiossa): ulkoinen ryhmä saa
# AINA uusimman PASS-buildin — build liitetään ryhmään ja lähetetään Applen
# beta-arvioon. Korvaa 23.9.:n säännön "vain omistajan kortilla".
# Tyhjä build_numero = vain tila ja käyttötilastot (publicLinkUsages,
# betaTesterUsages) yhteenvetoon. Skripti: tools/testflight/ulkoinen-ryhma.py.

name: TestFlight ulkoinen ryhmä

on:
  workflow_dispatch:
    inputs:
      build_numero:
        description: 'Ladatun buildin CFBundleVersion (tyhjä = vain tila ja tilastot)'
        type: string
        default: ''
      ryhma:
        description: 'Ulkoisen ryhmän nimi (tyhjä = ainoa tai julkisen linkin ryhmä)'
        type: string
        default: ''
      bundle_id:
        description: 'Bundle id'
        type: string
        default: 'fi.matkakirja.peli'

permissions:
  contents: read

concurrency:
  group: testflight-ulkoinen
  cancel-in-progress: false

# NICE-OLETUS (omistaja 28.9.2026 klo 11.2x, Raamattu #3527).
defaults:
  run:
    shell: nice -n 15 bash --noprofile --norc -eo pipefail {0}

jobs:
  ryhma:
    name: Ulkoinen ryhmä
    runs-on: [self-hosted, macOS, ARM64, testit]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Pura App Store Connect -avain
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          hakemisto="$RUNNER_TEMP/asc"
          mkdir -p "$hakemisto"; chmod 700 "$hakemisto"
          polku="$hakemisto/AuthKey.p8"
          if [[ "$ASC_KEY_P8" == *"BEGIN PRIVATE KEY"* ]]; then  # ei putkea: pipefail + grep -q → SIGPIPE (29.9. TF 1.0.57)
            printf '%s\n' "$ASC_KEY_P8" > "$polku"
          else
            printf '%s' "$ASC_KEY_P8" | openssl base64 -d -A -out "$polku"
          fi
          chmod 600 "$polku"
          grep -q "BEGIN PRIVATE KEY" "$polku" || { echo "::error title=Avain ei purkautunut::ASC_KEY_P8"; exit 1; }
          echo "ASC_AVAIN_POLKU=$polku" >> "$GITHUB_ENV"

      - name: Tila, tilastot ja build ulkoiseen ryhmään
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUILD: ${{ inputs.build_numero }}
          RYHMA: ${{ inputs.ryhma }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --break-system-packages "pyjwt[crypto]==2.9.0"
          python3 tools/testflight/ulkoinen-ryhma.py --bundle-id "${{ inputs.bundle_id }}" --build "$BUILD" --ryhma "$RYHMA"

      - name: Siivoa avain
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc" || true
