# Mac TestFlightin lähtötila (Päätoimittajan kuittaus 7.10.2026): VAIN LUKU.
# Näyttää App ID:n alustan ja oikeudet, app-tietueen alustat, Mac-profiilit
# ja jakeluvarmenteet. Ei luo eikä muuta mitään. Skripti: tools/testflight/mac-tila.py.

name: TestFlight-Mac-tila

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight-mac-tila
  cancel-in-progress: false

# NICE-OLETUS (omistaja 28.9.2026 klo 11.2x, Raamattu #3527).
defaults:
  run:
    shell: nice -n 15 bash --noprofile --norc -eo pipefail {0}

jobs:
  tila:
    name: Mac-tila
    runs-on: [self-hosted, macOS, ARM64, testit]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Pura App Store Connect -avain
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          hakemisto="$RUNNER_TEMP/asc"
          mkdir -p "$hakemisto"; chmod 700 "$hakemisto"
          polku="$hakemisto/AuthKey.p8"
          if [[ "$ASC_KEY_P8" == *"BEGIN PRIVATE KEY"* ]]; then
            printf '%s\n' "$ASC_KEY_P8" > "$polku"
          else
            printf '%s' "$ASC_KEY_P8" | openssl base64 -d -A -out "$polku"
          fi
          chmod 600 "$polku"
          grep -q "BEGIN PRIVATE KEY" "$polku" || { echo "::error title=Avain ei purkautunut::ASC_KEY_P8"; exit 1; }
          echo "ASC_AVAIN_POLKU=$polku" >> "$GITHUB_ENV"

      - name: Mac-tila
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --break-system-packages "pyjwt[crypto]==2.9.0"
          python3 tools/testflight/mac-tila.py --bundle-id fi.matkakirja.peli --bundle-id fi.matkakirja.peli.kehitys --bundle-id app.matkakirja.proto3d

      - name: Siivoa avain
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc" || true
