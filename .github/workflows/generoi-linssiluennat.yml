# Generoi aikajanalinssin luennat ja vie ne ämpäriin.
#
# KAKSI KAARTA (6.9.2026): syöte `linssi` valitsee, kumman kaaren
# luennat generoidaan. Oletus on `keksinnot` eli ajon entinen käytös.
#   keksinnot      28 kohdetta → aikajana/keksinnot/puhe/
#   ihmisen-matka  22 kohdetta → aikajana/ihmisen-matka/puhe/
#                  (20 pysäkkiä + esittely.mp3 + loppu.mp3). Pysäkin
#                  luenta on YKSI LYHYT LAUSE: "Noin 300 000 vuotta
#                  sitten. Kasvot, jotka tunnistaisi — Jebel Irhoud,
#                  Marokko." Tiedostonimi on pysäkin tunnus, ja se
#                  tulee datasta samalla funktiolla kuin pelissä.
#
# Omistajan tilaus 4.9.2026, sanatarkasti: *"Generoi selostajan
# äänellä jokaiseen kohtaan vuosiluku, keksijän nimi ja keksintö, eli
# se tulisi aina Keksinnön vaihtoessa lukijan äänellä."* Pelin puoli on
# valmis (js/linssipuhe.js, kytketty js/aikajana.js:n sytyta-kohtaan)
# ja odottaa tiedostoja; työn tekee tools/generoi-linssiluennat.mjs.
#
#   26 luentaa  aikajana/keksinnot/puhe/<muotokuvan runko>.mp3
#               esim. 1769-james-watt.mp3 → "1769. James Watt.
#               Höyrykoneen lauhdutin."
#    2 puhetta  kaaren omat, pidemmät tekstit (omistajan tilaus
#               4.9.2026 aamu): esittely.mp3 on avausjakson selite ja
#               valinaytos-1873.mp3 merkkipaalun välinäytös, jonka
#               kohdalla kello pysähtyy ja pulu kommentoi. Yhteensä
#               siis 28 kohdetta.
#
# TIEDOSTONIMI TULEE DATASTA. Runko on pysäkin muotokuvan runko
# (js/linssipuhe.js luennanRunko) — vuosi yksin ei riittäisi, koska
# kaaressa on kolme vuoden 1895 pysäkkiä (Marconi, Röntgen, Lumière).
# Kaaren omilla puheilla on omat runkonsa (kaarenPuheet): `esittely` ja
# `valinaytos-<vuosi>`. Peli ja työkalu lukevat saman funktion, joten
# nimi ei voi eriytyä.
#
# JOKAINEN PYSÄKKI ON OMA MAKSULLINEN KUTSUNSA. Ajo tekee kuitenkin
# HEADin julkiseen osoitteeseen ennen kutsua ja OHITTAA sen, mikä on jo
# ämpärissä: uuden pysäkin lisääminen kaareen maksaa yhden kutsun eikä
# kahtakymmentäkuutta. Syötteellä `pysakit` rajataan vuosiin, ja
# uudelleenäänitys tehdään työkalun `--pakota`-lipulla käsin (sitä ei
# ole tässä syötteenä tahallaan: yhden vahingossa jätetyn valintaruudun
# hinta olisi koko kaari uudelleen).
#
# YKSI YHTENÄINEN LUENTA (8.9.2026, syöte `yhtena`). Omistaja: *"nyt
# jokainen kohtaus on generoitu erillisenä kohtana, niin kertojan
# äänensävy hyppii liikaa"* ja *"muista generoida teksti yhtenä pätkänä,
# jossa on luonnolliset lauseet ja kappaleet"*. Silloin koko kertomus
# menee YHTENÄ pyyntönä (jaksot ovat kappaleita, ei taukomerkkejä
# väliin), ja vastaus haetaan aikaleimapäätteestä
# (/v1/text-to-speech/{voice}/with-timestamps). Tulokset ovat
# aikajana/ihmisen-matka/puhe/ihmisen-matka-kertomus.mp3 ja
# kertomus-manifesti.json, jossa on jokaisen jakson, lauseen ja sanan
# aikaleima; peli soittaa jakson tiedoston väliltä. ÄÄNI ON YHÄ
# eleven_v3 TAGIT MUKANA (omistajan valinta: kertoja äänitetään v3:lla
# juuri ilmaisutagien takia), ja aikaleimat haetaan jälkikäteen
# PAKOTETULLA KOHDISTUKSELLA (POST /v1/forced-alignment: valmis mp3 +
# sama teksti tagit karsittuina → merkkien ja sanojen ajat). Jos
# kohdistus ei onnistu, ajo putoaa aikaleimapäätteeseen
# (/v1/text-to-speech/{voice}/with-timestamps, eleven_multilingual_v2),
# joka generoi äänen uudelleen ilman v3:n ilmaisua — se näkyy lokissa ja
# manifestin kentissä `aikaleimalahde` ja `malli`.
#
# KÄSIAJETTAVA (workflow_dispatch), sama syy kuin
# generoi-tehosteet.yml:llä ja generoi-luennat.yml:llä: generointi
# maksaa rahaa, ja luenta on sanasta sanaan sidottu pelidataan — se
# äänitetään vasta kun teksti on mainissa.
#
# TÄMÄ AJO EI COMMITTOI MITÄÄN. Luennat ovat mediaa ja media kuuluu
# ämpäriin, ei repoon (Raamattu: "kaikki aina ämpäriin"). Työkalu
# kirjoittaa media/-kansioon, joka on .gitignoressa — se tarkistetaan
# koneellisesti ennen ensimmäistäkään maksullista kutsua — ja vie
# tiedostot sieltä ämpärin aikajana/keksinnot/puhe/-kansioon samalla
# aws s3 cp -komennolla kuin muutkin ääniajot. Peli hakee tasan sen polun,
# joten luennat kuuluvat pelissä heti ajon jälkeen ilman julkaisua.
#
# KUUNTELE LUENNAT AJON JÄLKEEN. Ajo tarkistaa koneellisesti keston ja
# tason (−17 LUFS, sama perhe kuin ämpärin muut kertojaluennat), mutta
# ei sitä, taivuttaako malli nimen oikein tai jääkö vuosiluvun ja nimen
# väliin tauko — se kuullaan.
#
# FFMPEG asennetaan apt:llä: ubuntu-latest-ajurissa sitä ei ole, ja
# hiljaisuuden leikkaus, hännän paddaus ja tason mittaus ovat sen
# varassa.
#
# Salaisuudet ovat tämän repon Actions-asetuksissa eivätkä koskaan
# täällä: ELEVEN_API_KEY (sama kuin generoi-luennat.yml ja
# generoi-tehosteet.yml) sekä neljä R2-salaisuutta (samat kuin
# muut ääniajot ja peilaa.yml):
#   R2_ACCOUNT_ID  R2_ACCESS_KEY_ID  R2_SECRET_ACCESS_KEY  R2_BUCKET
# Avain ei tulostu lokiin: työkalu ei tulosta sitä eikä tämä ajo echoa
# sitä — GitHub peittää secretit joka tapauksessa, mutta siihen ei nojata.

name: Generoi linssiluennat

on:
  workflow_dispatch:
    inputs:
      linssi:
        description: >-
          Minkä aikajanakaaren luennat generoidaan. "keksinnot" on
          entinen käytös (aikajana/keksinnot/puhe/), "ihmisen-matka"
          vie kansioon aikajana/ihmisen-matka/puhe/.
        required: true
        type: choice
        default: 'keksinnot'
        options: ['keksinnot', 'ihmisen-matka']
      pysakit:
        description: >-
          Vuodet pilkuin TAI välilyönnein (esim. "1769,1783" tai
          "1769 1783"), tai kaaren omat puheet avaimina "esittely",
          "valinaytos" ja "loppu". Tyhjä = koko kaari (keksinnöt 28,
          ihmisen matka 22 kohdetta). HUOM: vuosi 1895 valitsee kaikki
          kolme sen vuoden pysäkkiä. Ihmisen matkassa pysäkki
          valitaan TUNNUKSELLA (esim. "jebel-irhoud"), koska
          vuosilukuja ei ole.
        required: false
        default: ''
      kuiva:
        description: >-
          Kuiva ajo: tulostaa tekstit ja kohdetiedostot, ei kutsu APIa
          eikä vie ämpäriin.
        required: true
        type: choice
        default: 'ei'
        options: ['ei', 'kyllä']
      pakota:
        description: >-
          Generoi uudelleen, vaikka tiedosto on jo ämpärissä. Toimii VAIN
          kun pysakit-lista on annettu — koko kaarta ei uusita vahingossa.
        required: true
        type: choice
        default: 'ei'
        options: ['ei', 'kyllä']
      kertomus:
        description: >-
          "kyllä" generoi KERTOMUSJAKSOT pysäkkien sijaan (työkalun
          --kertomus; vain kaarilla, joilla on aikajana.kertomus — nyt
          ihmisen-matka, 21 jaksoa kansioon aikajana/ihmisen-matka/puhe/
          ihmisen-matka-kertomus-<jakso>.mp3 ja kertomus-manifesti.json).
          Tällöin pysakit-lista valitsee jaksot TUNNUKSELLA (esim.
          "avaus,denisova"). "ei" = pysäkit kuten ennen.
        required: true
        type: choice
        default: 'ei'
        options: ['ei', 'kyllä']
      yhtena:
        description: >-
          "kyllä" lukee KOKO KERTOMUKSEN YHTENÄ ÄÄNITTEENÄ (työkalun
          --yhtena; vaatii kertomus = kyllä). Yksi kutsu, yksi tiedosto
          ihmisen-matka-kertomus.mp3 ja kertomus-manifesti.json, jossa on
          jokaisen jakson, lauseen ja sanan aikaleima — peli soittaa
          jakson tiedoston väliltä. Kertojan sävy ei hyppää jaksosta
          toiseen (omistaja 8.9.2026). Ääni on eleven_v3 tagit mukana
          kuten ennenkin, ja aikaleimat haetaan jälkikäteen pakotetulla
          kohdistuksella (/v1/forced-alignment); jos se ei onnistu, ajo
          putoaa aikaleimapäätteeseen (eleven_multilingual_v2) ja kirjaa
          sen manifestiin. Pysakit-lista EI käy yhteen tämän kanssa,
          mutta pakota käy (uusinta maksaa yhden kutsun).
        required: true
        type: choice
        default: 'ei'
        options: ['ei', 'kyllä']

permissions:
  contents: read

# Yksi ajo kerrallaan KAARTA KOHTI: kaksi rinnakkaista ajoa samalle
# kaarelle kirjoittaisi ämpärin samoihin avaimiin, mutta kaksi eri
# kaarta eivät osu toistensa kansioihin.
concurrency:
  group: generoi-linssiluennat-${{ inputs.linssi }}
  cancel-in-progress: false

jobs:
  generoi:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Vienti on työkalun sisällä, mutta salaisuudet tulevat tästä —
      # samat nimet ja sama endpoint-tyyli kuin muissakin ääniajoissa.
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # R2 ei hyväksy AWS:n uudempia tarkistussummaotsakkeita, jotka
      # aws-cli 2.23:sta alkaen lähtevät oletuksena mukaan.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_supported
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Puuttuva salaisuus tulisi muuten vastaan vasta ElevenLabsin
      # 401:nä tai aws-clin "Invalid endpoint" -virheenä — ja pahimmassa
      # järjestyksessä vasta sen jälkeen, kun kutsut on jo maksettu.
      # Arvoja ei tulosteta, vain onko ne asetettu.
      - name: Tarkista että salaisuudet ovat tallessa
        if: ${{ inputs.kuiva != 'kyllä' }}
        env:
          AVAIN: ${{ secrets.ELEVEN_API_KEY }}
        run: |
          set -euo pipefail
          puuttuu=""
          [ -n "$AVAIN" ]                        || puuttuu="$puuttuu ELEVEN_API_KEY"
          [ -n "${R2_ACCOUNT_ID:-}" ]            || puuttuu="$puuttuu R2_ACCOUNT_ID"
          [ -n "${AWS_ACCESS_KEY_ID:-}" ]        || puuttuu="$puuttuu R2_ACCESS_KEY_ID"
          [ -n "${AWS_SECRET_ACCESS_KEY:-}" ]    || puuttuu="$puuttuu R2_SECRET_ACCESS_KEY"
          [ -n "${R2_BUCKET:-}" ]                || puuttuu="$puuttuu R2_BUCKET"
          if [ -n "$puuttuu" ]; then
            echo "::error::Näitä salaisuuksia ei löydy tästä reposta:$puuttuu"
            echo "Lisää ne: Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Kaikki viisi salaisuutta löytyvät."

      - name: Asenna ffmpeg
        if: ${{ inputs.kuiva != 'kyllä' }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      # Kuiva ajo ensin AINA: jokainen kohde ja sen luettava teksti
      # tulostuvat lokiin ennen kuin yhtäkään maksullista kutsua on
      # tehty. Väärä vuosiluku tai tuntematon avain kaataa ajon tässä.
      # Syöte kulkee ympäristömuuttujan kautta, ei ${{ }}-sijoituksena
      # komentoriville: käsin kirjoitettu kenttä ei saa päätyä shellin
      # tulkittavaksi. Lainausmerkitön $PYSAKIT hajoaa välilyönneistä
      # useaksi argumentiksi, ja työkalu kerää ne kaikki --pysakit-
      # lipun perään (pilkkukin kelpaa erottimeksi).
      - name: Kuiva ajo (tekstit ja kohdetiedostot)
        env:
          PYSAKIT: ${{ inputs.pysakit }}
          LINSSI: ${{ inputs.linssi }}
          KERTOMUS: ${{ inputs.kertomus }}
          YHTENA: ${{ inputs.yhtena }}
        run: |
          set -euo pipefail
          # Tyhjä muuttuja katoaa lainausmerkittömänä argumenttilistasta;
          # "kyllä" tuo --kertomus-lipun mukaan.
          # `|| true` pitää `set -e`:n tyytyväisenä, kun ehto ei täyty.
          LIPPU=""; [ "$KERTOMUS" = "kyllä" ] && LIPPU="--kertomus" || true
          if [ "$YHTENA" = "kyllä" ]; then
            # Yhtenäinen luenta on koko kertomus: se ei käy yhteen
            # jaksovalinnan kanssa eikä ilman kertomus-lippua.
            if [ "$KERTOMUS" != "kyllä" ]; then
              echo "::error::yhtena vaatii kertomus = kyllä." >&2
              exit 1
            fi
            if [ -n "$PYSAKIT" ]; then
              echo "::error::yhtena lukee koko kertomuksen — jätä pysakit tyhjäksi." >&2
              exit 1
            fi
            node tools/generoi-linssiluennat.mjs --linssi "$LINSSI" $LIPPU --yhtena --kuiva
          elif [ -n "$PYSAKIT" ]; then
            node tools/generoi-linssiluennat.mjs --linssi "$LINSSI" $LIPPU --kuiva --pysakit $PYSAKIT
          else
            node tools/generoi-linssiluennat.mjs --linssi "$LINSSI" $LIPPU --kuiva
          fi

      - name: Generoi luennat ja vie ämpäriin
        if: ${{ inputs.kuiva != 'kyllä' }}
        env:
          ELEVEN_API_KEY: ${{ secrets.ELEVEN_API_KEY }}
          PYSAKIT: ${{ inputs.pysakit }}
          PAKOTA: ${{ inputs.pakota }}
          LINSSI: ${{ inputs.linssi }}
          KERTOMUS: ${{ inputs.kertomus }}
          YHTENA: ${{ inputs.yhtena }}
        run: |
          set -euo pipefail
          # `|| true` pitää `set -e`:n tyytyväisenä, kun ehto ei täyty.
          LIPPU=""; [ "$KERTOMUS" = "kyllä" ] && LIPPU="--kertomus" || true
          if [ "$YHTENA" = "kyllä" ]; then
            # Yksi kutsu, yksi tiedosto: pakota käy ilman pysakit-listaa,
            # koska uusinta maksaa tasan yhden kutsun.
            PAKOTALIPPU=""; [ "$PAKOTA" = "kyllä" ] && PAKOTALIPPU="--pakota" || true
            node tools/generoi-linssiluennat.mjs --linssi "$LINSSI" $LIPPU --yhtena $PAKOTALIPPU
          elif [ -n "$PYSAKIT" ]; then
            if [ "$PAKOTA" = "kyllä" ]; then
              node tools/generoi-linssiluennat.mjs --linssi "$LINSSI" $LIPPU --pakota --pysakit $PYSAKIT
            else
              node tools/generoi-linssiluennat.mjs --linssi "$LINSSI" $LIPPU --pysakit $PYSAKIT
            fi
          else
            if [ "$PAKOTA" = "kyllä" ]; then
              echo "pakota vaatii pysakit-listan — koko kaarta ei uusita vahingossa." >&2
              exit 1
            fi
            node tools/generoi-linssiluennat.mjs --linssi "$LINSSI" $LIPPU
          fi

      # Vartija sille, mitä tämä ajo lupaa: repoon ei jää mitään.
      - name: Varmista ettei repoon jäänyt mitään
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Ajo muutti työhakemistoa — media kuuluu ämpäriin, ei repoon."
            git status --porcelain
            exit 1
          fi
          echo "Työhakemisto on siisti."
