# Generoi laattapyramidi ja vie se R2-ämpäriin.
#
# Raamattu ("LAATTAPYRAMIDI JA KARTAN PATINA"): *"Sisältöpäivitys =
# pyramidin uudelleenajo napista."* Tämä työnkulku ON se nappi.
#
# Malli: patinoi-fokus.yml (generointi ja `aws s3 sync` samassa
# jobissa) ja vie-fokus.yml (pelkkä synkka). Rakenne on niistä, ei
# keksitty uudestaan.
#
# === MIKSI MATRIISI EIKÄ YKSI JOBI ==================================
#
# Mitattuna (30.8.2026, docs/moduulit/laattapyramidi.md): koko pyramidi
# on 23 340 laattaa ja 6 061 Mpx, ja yhdellä säikeellä se on tunteja.
# Työ jakautuu luonnostaan, koska laatta ei koskaan riipu
# naapurilaatasta — kaikki lasketaan arkin koordinaateista.
#
# Jako on syvimmän tason PITUUSKAISTOJA, ja kaistarajat ovat
# LOHKORAJOILLA (sarake jaollinen neljällä). Se ei ole siisteyttä:
# aluerajaus asteilla katkaisee lohkon keskeltä, jolloin lohko
# piirretään kokonaan mutta puolet heitetään pois — mitattuna 62 %
# hukkaa. Sarakerajaus lohkorajalle antaa nollan.
#
#   z0-z6 kokonaan          5 933 laattaa
#   z7 sarakkeet   0-43     4 532
#   z7 sarakkeet  44-87     4 532
#   z7 sarakkeet  88-131    4 532
#   z7 sarakkeet 132-168    3 811
#                          ------
#                          23 340   (täsmää tasojen summaan)
#
# === MIKSI JOKAINEN SHARDI SYNKKAA ITSE =============================
#
# Koko pyramidi on yli gigatavun. Jos shardit antaisivat tuotoksensa
# artefaktina seuraavalle jobille, se gigatavu kulkisi verkon yli
# kahdesti ja täyttäisi levyn. Jokainen shardi vie siis OMAN osansa
# samassa jobissa, ja levyltä ei koskaan vaadita kuin yhden shardin
# osuus (suurin noin 250 Mt).
#
# === LUETTELO ON OMA JOBINSA =======================================
#
# `pyramidi.json` kuvaa KOKO pyramidin, eikä yksikään shardi tunne
# muiden tasoja. Jos shardit kirjoittaisivat sen, viimeisenä valmistuva
# jättäisi ämpäriin luettelon, joka tuntee vain omat tasonsa. Luettelo
# tehdään siksi erikseen `--kuiva`-ajolla (pelkkä geometria, ei
# piirtoa) ja viedään vasta kun jokainen shardi on valmis.
#
# Laatat menevät VERSIOITUUN polkuun ja luettelo versioimattomaan:
#   julisteet/pyramidi/<versio>/z<taso>/<sarake>/<rivi>.webp
#   julisteet/pyramidi/pyramidi.json
# Näin laatat saavat ikuisen välimuistin eikä sisältöpäivitys voi
# jättää selaimeen puolikasta karttaa kahdesta eri ajosta.
name: Generoi laattapyramidi

# === NOSTOTASO (omistaja 31.8.2026 ilta) ============================
#
# Karttanostot poltetaan OMAAN LÄPINÄKYVÄÄN pyramidiin (vain z5-z7),
# ei pohjaan. Koko mallin päähyöty on nopea uusintapoltto: kun
# nostoja tulee lisää, ajetaan `vain-nostotaso` uudella nostoversiolla
# (minuutteja, ei tunteja) ja pohja pysyy ikuisessa välimuistissaan.
#
#   kaikki           pohja + nostotaso (uusi täysi ajo)
#   vain-nostotaso   pelkkä nostotaso: `versio` on OLEMASSA OLEVAN
#                    pohjan versio (luettelo osoittaa siihen) ja
#                    `nostoversio` on uusi — laatat menevät polkuun
#                    julisteet/pyramidi/<nostoversio>/nostot/z…
#
# Nostotason shardi ei tarvitse aineistoa (ei ETOPOa, ei Natural
# Earthiä): se piirtää vain nostojen musteen läpinäkyville laatoille.
#
# === VIIVATASO (omistaja 31.8.2026 ilta) ============================
#
# Reittiverkko, erikoispiirit ja MAIDEN RAJAT ovat samoin omassa
# läpinäkyvässä pyramidissaan (tasot z0-z7), polussa
# julisteet/pyramidi/<viivaversio>/viivat/z…
#
#   vain-viivataso   pelkkä viivataso: `versio` on OLEMASSA OLEVAN
#                    pohjan versio ja `viivaversio` uusi
#
# Viivatason shardi ei tarvitse aineistoa sen enempää kuin nostotason:
# reitit tulevat laudalta ja rajat repon omasta rajasetistä
# (tools/fokuskartta/rajat-nykyiset.json.gz).
#
# === JULKAISUJÄRJESTYS — TÄSSÄ KARTTA VOI RIKKOUTUA =================
#
# Pohja ajetaan tästä erästä alkaen ILMAN reittejä ja erikoispiirejä;
# ne ovat viivatasolla. Vanha peli ei tunne viivatasoa, joten se
# näyttäisi reitittömän pohjan sellaisenaan — eikä varapolkua ole.
# Järjestys on siksi kolme askelta, ja ne on tehtävä tässä
# järjestyksessä:
#
#   1. SELAIN mainiin ja julkaisuun. Vanhan luettelon kanssa se toimii
#      ennallaan (viivataso-kenttää ei ole -> kerros jää tyhjäksi eikä
#      yhtään laattaa pyydetä), joten tämä on turvallinen yksinään.
#   2. VIIVATASO ämpäriin: `vain-viivataso` uudella viivaversiolla.
#      Pohja on yhä vanha eli reitit ovat siinä — kartalla on hetken
#      molemmat, ja se on hyväksytty välitila.
#   3. REITITÖN POHJA + luettelo. Vasta tämän jälkeen pohjassa ei ole
#      reittejä, ja siihen mennessä viivataso on jo ämpärissä ja peli
#      osaa lukea sen.
#
# === PAIKKAUS (31.8.2026) ===========================================
#
# Täysajo on tunteja, mutta virhe on melkein aina paikallinen: yhden
# järven väri, yhden vuoren nimi, yhden saaren rannikko. Paikkausajo
# piirtää VAIN korjattavaan laatikkoon osuvat laatat kaikilta tasoilta
# — Kreikan kokoinen laatikko on 55 laattaa 23 340:stä — ja kopioi
# loput lähdeversiosta uuteen versiopolkuun ÄMPÄRIN SISÄLLÄ
# palvelinkopiona (CopyObject). Yhtään laattaa ei ladata ajokoneelle.
#
#   paikkaus         `lahdeversio` on OLEMASSA OLEVA versio, josta
#                    muuttumattomat laatat kopioidaan; `versio` on uusi
#                    (esim. 2026-08-31c-p1); `alue` on korjattava
#                    laatikko lon0,lat0,lon1,lat1.
#
# SAUMAA EI SYNNY, koska laatta ei riipu naapuristaan: patina on
# sidottu arkin pikseliin (generoi-laattapyramidi.mjs, REUNUS), joten
# sama laatta samasta aineistosta on tavulleen sama piirrettiinpä se
# maailma-ajossa tai alueajossa. Ajon asetukset (laatu, muoto,
# laattakoko, patinataso) luetaan lähdeversion luettelosta eikä
# työnkulun syötteistä — juuri niistä sauma syntyisi.
#
# NOSTOTASO EI OSALLISTU: nostolaatat asuvat oman versionsa polussa
# (<nostoversio>/nostot/z…), joka on olemassa paikkauksen jälkeenkin.
# Niitä ei kopioida eikä piirretä; luettelo osoittaa samaan
# nostoversioon kuin lähdekin.
#
# LÄHTEEN POLKUUN EI KIRJOITETA KOSKAAN (immutable-välimuisti), ja jos
# uusi versio on jo ämpärissä, ajo kieltäytyy ennen kuin mitään on
# tehty.
on:
  workflow_dispatch:
    inputs:
      versio:
        description: 'Pohjalaattojen versio ämpärin polussa (esim. 2026-08-30); vain-nostotaso-ajossa OLEMASSA OLEVAN pohjan versio; paikkausajossa UUSI versio'
        type: string
        required: true
      nostoversio:
        description: 'Nostotason versio polussa (tyhjä = sama kuin versio; paikkausajossa tyhjä = lähdeluettelon nostoversio)'
        type: string
        required: false
        default: ''
      viivaversio:
        description: 'Viivatason (reitit, piirit, rajat) versio polussa (tyhjä = sama kuin versio)'
        type: string
        required: false
        default: ''
      tasot:
        description: 'Mitkä shardit ajetaan'
        type: choice
        options:
          - kaikki
          - vain-z0-z6
          - vain-nostotaso
          - vain-viivataso
          - paikkaus
          - koeajo-z0-z3
        default: koeajo-z0-z3
      lahdeversio:
        description: 'Paikkaus: OLEMASSA OLEVA versio, josta muuttumattomat laatat kopioidaan (esim. 2026-08-31c)'
        type: string
        required: false
        default: ''
      alue:
        description: 'Paikkaus: korjattava laatikko lon0,lat0,lon1,lat1 (esim. 80,27,95,36)'
        type: string
        required: false
        default: ''
      korkeus:
        description: 'Korkeusdatan tarkkuus SYVIMMÄLLÄ tasolla kaariminuutteina (z0–z6 aina 3)'
        type: choice
        options: ['1', '3']
        default: '1'
      laatu:
        description: 'webp-laatu'
        type: string
        default: '0.9'
      patina:
        description: 'Patinataso (taysi = lukittu resepti)'
        type: choice
        options: [taysi, keskitaso, hillitty, ei]
        default: taysi
      piirit:
        description: 'Viivataso: erikoispiirit (päiväntasaaja, kääntö- ja napapiiri, nollameridiaani) laattoihin (ei = --eipiirit, omistaja 1.9.2026)'
        type: choice
        options: [kylla, ei]
        default: kylla
      lahdepatina:
        description: 'Vain paikkaus, vain vanha lähde: lähdeajon patinataso, jos lähdeluettelossa ei ole patina-kenttää (31b/31c = hillitty)'
        type: string
        required: false
        default: ''
      vie:
        description: 'Vie ämpäriin (pois = pelkkä harjoitus)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # --------------------------------------------------------- aineisto
  #
  # KORKEUSAINEISTO TULEE REPOSTA, EI VERKOSTA.
  #
  # Ensimmainen koeajo (33311158965, 30.8.2026) kaatui siihen, ettei
  # NOAA:n ERDDAP vastannut ajokoneelta lainkaan ("fetch failed", ei
  # HTTP-statusta), vaikka kehityskontista sama osoite vastaa alle
  # sekunnissa. Omistajan paatos: yksikaan ajo ei saa riippua NOAA:n
  # tavoitettavuudesta.
  #
  # Harvennettu 3 kaariminuutin ruudukko on siksi repossa
  # (tools/korkeusaineisto/, 28,9 Mt), ja se tulee jokaiseen jobiin
  # checkoutin mukana ilman yhtaan verkkopyyntoa. Tama jobi noutaa enaa
  # Natural Earthin — kerran, ei kerran shardia kohti — koska se tulee
  # GitHubista, joka on todistetusti tavoitettavissa.
  aineisto:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Tarkista repon korkeusaineisto
        run: |
          set -euo pipefail
          A=tools/korkeusaineisto/etopo-3kaariminuuttia.bin.gz
          [ -f "$A" ] || { echo "::error::Korkeusaineisto puuttuu reposta"; exit 1; }
          echo "korkeusaineisto $(du -h "$A" | cut -f1)"

      - name: Hae Natural Earth
        run: |
          set -euo pipefail
          mkdir -p ne-data
          for f in ne_10m_ocean ne_10m_lakes; do
            curl -sSL --retry 3 --max-time 300 -o "ne-data/$f.geojson" \
              "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/$f.geojson"
          done
          ls -la ne-data

      - name: Vie Natural Earth shardeille
        uses: actions/upload-artifact@v4
        with:
          name: pyramidin-aineisto
          path: ne-data
          retention-days: 1

  # ------------------------------------------------------------ laatat
  laatat:
    needs: aineisto
    runs-on: ubuntu-latest
    # Mitattu 0,44 Mpx/s tässä kontissa; suurin shardi on noin 1 240 Mpx
    # reunuksineen eli ~47 min. Ajurin ja hitaamman ajokoneen varalle
    # nelinkertainen vara, mutta alle GitHubin kuuden tunnin katon.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        # Nostotaso ja viivataso ovat KUMPIKIN YKSI SHARDI: laattoja on
        # murto-osa laattapaikoista ja piirto ilman aineistoa on
        # minuuttiluokkaa (viivataso 5 830 laattaa).
        #
        # PAIKKAUS ON MYÖS YKSI SHARDI, eikä sen "tasot" ole tässä:
        # tasot (ja laatu, muoto, laattakoko, patina) luetaan
        # lähdeversion luettelosta, jotta paikatut laatat ovat
        # asetuksiltaan samoja kuin kopioidut naapurinsa. Jako
        # useampaan shardiin olisi turhaa — koko alue on kymmeniä
        # laattoja, ei tuhansia.
        shardi: ${{ fromJSON(inputs.tasot == 'kaikki'
          && '[{"nimi":"z0-z6","tasot":"0-6","sarakkeet":""},{"nimi":"z7a","tasot":"7","sarakkeet":"0-43"},{"nimi":"z7b","tasot":"7","sarakkeet":"44-87"},{"nimi":"z7c","tasot":"7","sarakkeet":"88-131"},{"nimi":"z7d","tasot":"7","sarakkeet":"132-168"},{"nimi":"nostotaso","tasot":"5-7","sarakkeet":"","nostotaso":true},{"nimi":"viivataso","tasot":"0-7","sarakkeet":"","viivataso":true}]'
          || (inputs.tasot == 'vain-z0-z6'
          && '[{"nimi":"z0-z6","tasot":"0-6","sarakkeet":""}]'
          || (inputs.tasot == 'vain-nostotaso'
          && '[{"nimi":"nostotaso","tasot":"5-7","sarakkeet":"","nostotaso":true}]'
          || (inputs.tasot == 'vain-viivataso'
          && '[{"nimi":"viivataso","tasot":"0-7","sarakkeet":"","viivataso":true}]'
          || (inputs.tasot == 'paikkaus'
          && '[{"nimi":"paikkaus","tasot":"","sarakkeet":"","paikkaus":true}]'
          || '[{"nimi":"koeajo","tasot":"0-3","sarakkeet":""}]'))))) }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_supported
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Playwright repon omasta package.jsonista; Chromium on
      # piirtomoottorin ja patinapassin kuvankäsittelykanvaasi.
      - name: Asenna riippuvuudet ja Chromium
        run: |
          set -euo pipefail
          npm install --no-fund --no-audit
          npx playwright install --with-deps chromium
          echo "PW_CHROMIUM=$(find ~/.cache/ms-playwright -name chrome -path '*chrome-linux*' -type f | head -1)" >> "$GITHUB_ENV"

      # Aineisto tulee valmistelujobista, EI verkosta. Shardi ei nouda
      # mitaan: jos aineisto puuttuu, ajo kaatuu tahan aanekkaasti eika
      # palaa hiljaa verkkoon.
      # Natural Earth valmistelujobista; korkeusaineisto tuli
      # checkoutin mukana reposta. Shardi ei nouda verkosta mitaan.
      - uses: actions/download-artifact@v4
        with:
          name: pyramidin-aineisto
          path: ne-data
      - name: Tarkista aineisto
        run: |
          set -euo pipefail
          A=tools/korkeusaineisto/etopo-3kaariminuuttia.bin.gz
          [ -f "$A" ] || { echo "::error::Korkeusaineisto puuttuu reposta"; exit 1; }
          [ -f ne-data/ne_10m_ocean.geojson ] || { echo "::error::Natural Earth puuttuu"; exit 1; }
          echo "korkeusaineisto $(du -h "$A" | cut -f1) · ne-data $(du -sh ne-data | cut -f1)"

      # ------------------------------------------------------ paikkaus
      #
      # SUUNNITELMA JA TURVATARKISTUS ENNEN KUIN MITÄÄN TEHDÄÄN.
      #
      # Paikkausajon asetukset EIVÄT tule työnkulun syötteistä vaan
      # lähdeversion luettelosta: tasot, laatu, muoto, laattakoko,
      # patinataso ja nostoversio. Jos ne arvattaisiin uudestaan, laatat
      # täsmäisivät geometrialtaan mutta erottuisivat silmällä
      # kopioitujen naapureidensa vierestä — ja juuri se olisi sauma.
      # `paikkaa-pyramidi.mjs suunnittele` lukee ne ja kirjoittaa
      # GITHUB_ENViin.
      #
      # Kaksi kieltoa, joita ei ohiteta:
      #   - uusi versio ei saa olla lähdeversio (ei ylikirjoitusta
      #     immutable-polkuun),
      #   - uuden version polku ei saa olla ämpärissä jo olemassa.
      - name: Suunnittele paikkaus ja tarkista turva
        if: ${{ matrix.shardi.paikkaus }}
        env:
          LAHDEVERSIO: ${{ inputs.lahdeversio }}
          UUSI_VERSIO: ${{ inputs.versio }}
          ALUE: ${{ inputs.alue }}
          SYOTE_NOSTOVERSIO: ${{ inputs.nostoversio }}
          SYOTE_LAHDEPATINA: ${{ inputs.lahdepatina }}
          AMPARI: ${{ secrets.R2_BUCKET }}
          PAATE: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          [ -n "$LAHDEVERSIO" ] || { echo "::error::paikkaus vaatii syötteen lahdeversio"; exit 1; }
          [ -n "$ALUE" ] || { echo "::error::paikkaus vaatii syötteen alue (lon0,lat0,lon1,lat1)"; exit 1; }

          # Lähdeversion on oltava ämpärissä ja uuden version on oltava
          # tyhjä. Listaus on ETULIITETASOLLA (ei --recursive), joten
          # rivejä on korkeintaan kahdeksan (z0…z7) — ja tyhjästä
          # etuliitteestä `aws s3 ls` poistuu koodilla 1, mikä on tässä
          # odotettu vastaus eikä virhe.
          rivit () { aws s3 ls "s3://$AMPARI/julisteet/pyramidi/$1/" \
            --endpoint-url "$PAATE" 2>/dev/null || true; }
          LAHDE_RIVIT=$(rivit "$LAHDEVERSIO" | wc -l)
          [ "$LAHDE_RIVIT" -gt 0 ] || { echo "::error::Lähdeversiota $LAHDEVERSIO ei ole ämpärissä"; exit 1; }
          UUSI_RIVIT=$(rivit "$UUSI_VERSIO" | wc -l)
          [ "$UUSI_RIVIT" -eq 0 ] || { echo "::error::Versio $UUSI_VERSIO on jo ämpärissä — paikkaus ei ylikirjoita"; exit 1; }

          # Lähdeversion asetukset luettelosta.
          aws s3 cp \
            "s3://$AMPARI/julisteet/pyramidi/pyramidi.json" lahdeluettelo.json \
            --endpoint-url "$PAATE" --no-progress
          LISA=""
          if [ -n "$SYOTE_NOSTOVERSIO" ]; then LISA="--nostoversio $SYOTE_NOSTOVERSIO"; fi
          if [ -n "$SYOTE_LAHDEPATINA" ]; then LISA="$LISA --patina $SYOTE_LAHDEPATINA"; fi
          node tools/paikkaa-pyramidi.mjs suunnittele \
            --luettelo lahdeluettelo.json \
            --lahdeversio "$LAHDEVERSIO" --versio "$UUSI_VERSIO" \
            --alue "$ALUE" $LISA --ulos "$GITHUB_ENV"

      # KOPIO TAPAHTUU ÄMPÄRIN SISÄLLÄ. `aws s3 cp --recursive`
      # samasta ämpäristä samaan on palvelinpuolen CopyObject: yhtään
      # tavua ei kulje ajokoneen kautta. 23 340 laattaa on siis
      # rinnakkaisuudesta kiinni, ei kaistasta — siksi rinnakkaisuus
      # nostetaan kymmenestä kuuteenkymmeneenneljään.
      #
      # `nostot/` JÄTETÄÄN POIS: nostolaatat kuuluvat oman versionsa
      # polkuun, joka on olemassa myös paikkauksen jälkeen. Luettelo
      # osoittaa siihen, joten kopio olisi pelkkää painolastia.
      #
      # Kopio ajetaan ENNEN piirtoa, jotta piirretyt laatat menevät
      # kopion päälle eikä toisin päin. Uusi versio ei ole julkinen
      # ennen kuin luettelojobi vaihtaa `pyramidi.json`:in siihen,
      # joten välitila ei näy kenellekään.
      #
      # `--metadata-directive COPY` (oletus, kirjoitettu näkyviin):
      # sisältötyyppi ja ikuinen välimuistiotsake peritään
      # lähdeobjektilta. Ne ovat jo oikein — lähde vietiin samalla
      # työnkululla — eikä kopio saa niitä hiljaa muuttaa.
      - name: Kopioi muuttumattomat laatat lähdeversiosta
        if: ${{ matrix.shardi.paikkaus && inputs.vie }}
        env:
          AMPARI: ${{ secrets.R2_BUCKET }}
          PAATE: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          aws configure set default.s3.max_concurrent_requests 64
          alkoi=$(date +%s)
          aws s3 cp --recursive \
            "s3://$AMPARI/julisteet/pyramidi/$LAHDEVERSIO/" \
            "s3://$AMPARI/julisteet/pyramidi/$VERSIO/" \
            --endpoint-url "$PAATE" \
            --exclude 'nostot/*' \
            --metadata-directive COPY \
            --no-progress
          echo "Kopio $LAHDEVERSIO -> $VERSIO valmis, $(( $(date +%s) - alkoi )) s."

      # -------------------------------------------- 1′-korkeuspalat
      #
      # KORKEUSDATA TULEE OMASTA ÄMPÄRISTÄ, EI NOAA:LTA.
      #
      # Omistajan päätös 30.8.2026 pitää yhä: yksikään ajo ei saa
      # riippua NOAA:n tavoitettavuudesta. Kaukotasojen 3′-aineisto
      # tulee checkoutin mukana reposta; syvimmän tason 1′-aineisto on
      # R2:ssa 10°-paloina (tools/tee-korkeuspalat.mjs,
      # vie-korkeuspalat.yml), ja se KOPIOIDAAN LEVYLLE ENNEN POLTTOA.
      # Poltto itse ei siis tee yhtään verkkopyyntöä — kolmen tunnin
      # ajo ei saa kaatua yhteen aikakatkaisuun kahden tunnin kohdalla.
      #
      # VAIN SHARDIN TARVITSEMAT PALAT. Koko maailma on 612 palaa ja
      # 194 Mt; yksi pituuskaista tarvitsee siitä noin 170 palaa.
      # Lista tulee generaattorin omalta laatikkolaskijalta
      # (`--vain-palat`), joten se on täsmälleen sama joukko, jonka
      # piirto lukee — puuttuva pala olisi ajon pysäyttävä virhe.
      - name: Kopioi 1′-korkeuspalat ämpäristä
        if: ${{ inputs.korkeus != '3' && !matrix.shardi.nostotaso && !matrix.shardi.viivataso }}
        env:
          SHARDI_TASOT: ${{ matrix.shardi.tasot }}
          SARAKKEET: ${{ matrix.shardi.sarakkeet }}
          PAIKKAUS: ${{ matrix.shardi.paikkaus && 'true' || '' }}
          AMPARI: ${{ secrets.R2_BUCKET }}
          PAATE: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          TASOT="${SHARDI_TASOT:-${TASOT:-}}"
          YLIN="${TASOT##*-}"
          if [ -z "$TASOT" ] || [ "$YLIN" -lt 7 ]; then
            echo "Shardi ei piirrä syvintä tasoa — 1′-paloja ei tarvita."
            exit 0
          fi
          LISA=""
          if [ -n "${SARAKKEET}" ]; then LISA="--sarakkeet ${SARAKKEET}"; fi
          mkdir -p korkeuspalat
          node tools/generoi-laattapyramidi.mjs korkeuspalat \
            --tasot 7 $LISA --kaariminuutit 1 --vain-palat korkeuspalat/palat.txt
          N=$(wc -l < korkeuspalat/palat.txt)
          echo "Palat: $N"
          alkoi=$(date +%s)
          # Rinnakkain kahdeksalla: yksi pala on 300-420 kt, ja
          # peräkkäin haettuna 170 pyyntöä olisi minuutteja odotusta.
          xargs -a korkeuspalat/palat.txt -P 8 -I {} \
            aws s3 cp "s3://$AMPARI/julisteet/korkeus/1min/{}.bin.gz" \
            "korkeuspalat/{}.bin.gz" --endpoint-url "$PAATE" --no-progress --quiet
          PUUTTUU=0
          while read -r nimi; do
            [ -s "korkeuspalat/$nimi.bin.gz" ] || { echo "::error::pala $nimi puuttuu"; PUUTTUU=1; }
          done < korkeuspalat/palat.txt
          [ "$PUUTTUU" -eq 0 ] || exit 1
          echo "Kopioitu $N palaa, $(du -sh korkeuspalat | cut -f1), $(( $(date +%s) - alkoi )) s."

      - name: Generoi laatat (${{ matrix.shardi.nimi }})
        env:
          SHARDI_TASOT: ${{ matrix.shardi.tasot }}
          SARAKKEET: ${{ matrix.shardi.sarakkeet }}
          KORKEUS: ${{ inputs.korkeus || '1' }}
          NOSTOTASO: ${{ matrix.shardi.nostotaso && 'true' || '' }}
          VIIVATASO: ${{ matrix.shardi.viivataso && 'true' || '' }}
          PAIKKAUS: ${{ matrix.shardi.paikkaus && 'true' || '' }}
          SYOTE_LAATU: ${{ inputs.laatu }}
          SYOTE_PATINA: ${{ inputs.patina }}
          SYOTE_VERSIO: ${{ inputs.versio }}
          SYOTE_NOSTOVERSIO: ${{ inputs.nostoversio || inputs.versio }}
          SYOTE_VIIVAVERSIO: ${{ inputs.viivaversio || inputs.versio }}
          SYOTE_PIIRIT: ${{ inputs.piirit || 'kylla' }}
        run: |
          set -euo pipefail
          df -h / | tail -1
          # Paikkausajossa tasot ja asetukset tulevat lähdeversion
          # luettelosta (suunnitteluaskel kirjoitti ne GITHUB_ENViin);
          # muissa ajoissa matriisista ja työnkulun syötteistä.
          TASOT="${SHARDI_TASOT:-${TASOT:-}}"
          LAATU="${LAATU:-$SYOTE_LAATU}"
          PATINA="${PATINA:-$SYOTE_PATINA}"
          VERSIO="${VERSIO:-$SYOTE_VERSIO}"
          NOSTOVERSIO="${NOSTOVERSIO:-$SYOTE_NOSTOVERSIO}"
          VIIVAVERSIO="${VIIVAVERSIO:-$SYOTE_VIIVAVERSIO}"
          LISA=""
          if [ -n "${SARAKKEET}" ]; then LISA="--sarakkeet ${SARAKKEET}"; fi
          # Nostotason shardi piirtää vain nostojen musteen: ei
          # aineistoa, oma läpinäkyvä resepti (RESEPTIT.nosto).
          if [ -n "${NOSTOTASO}" ]; then LISA="$LISA --nostotaso --nostoversio ${NOSTOVERSIO}"; fi
          # Viivatason shardi samoin: reitit, erikoispiirit ja maiden
          # rajat läpinäkyville laatoille, sama resepti.
          if [ -n "${VIIVATASO}" ]; then LISA="$LISA --viivataso --viivaversio ${VIIVAVERSIO}"; fi
          # Erikoispiirit pois viivatasolta (omistaja 1.9.2026: "Poista
          # pituus ja leveyspiirit näkyvistä") — peite ja piirto samalla
          # kytkimellä, ks. generaattorin ERIKOISPIIRIT POIS VIIVATASOLTA.
          if [ -n "${VIIVATASO}" ] && [ "${SYOTE_PIIRIT}" = "ei" ]; then LISA="$LISA --eipiirit"; fi
          # Paikkaus: vain alueeseen osuvat laatat, ja luetteloon
          # merkintä siitä, mistä versiosta loput kopioitiin.
          if [ -n "${PAIKKAUS}" ]; then
            LISA="$LISA --alue ${ALUE} --paikkaus ${LAHDEVERSIO} --muoto ${MUOTO} --laatta ${LAATTA}"
          fi
          # === KORKEUSDATAN TARKKUUS ON TASON OMINAISUUS ==============
          #
          # Syvin taso (z7) poltetaan `korkeus`-syötteen tarkkuudella
          # (oletus 1 kaariminuutti, omistajan tilaus 2.9.2026),
          # kaukotasot aina kolmella. Ruudukko kootaan kerran ajoa
          # kohti, joten ajo jonka tasot tarvitsevat eri ruudukot
          # AJETAAN KAHDESTI — luettelo täydentyy erissä samalla
          # koneistolla kuin shardeilla muutenkin.
          #
          # Tämä koskee käytännössä vain paikkausta, joka ajaa kaikki
          # tasot yhdessä; matriisin shardit ovat jo valmiiksi yhden
          # ryhmän ajoja (z0–z6 tai z7).
          aja() {
            local T="$1"
            local KM="$2"
            local KMLISA="--kaariminuutit $KM"
            if [ "$KM" = "1" ] && [ -d korkeuspalat ]; then
              KMLISA="$KMLISA --korkeuspalat korkeuspalat"
            fi
            node tools/generoi-laattapyramidi.mjs ulos \
              --data ne-data --tasot "$T" $LISA $KMLISA \
              --laatu "$LAATU" --patina "$PATINA" --versio "$VERSIO"
          }
          ALIN="${TASOT%%-*}"
          YLIN="${TASOT##*-}"
          if [ -n "${NOSTOTASO}${VIIVATASO}" ] || [ "$KORKEUS" = "3" ] \
            || [ "$ALIN" -ge 7 ] || [ "$YLIN" -le 6 ]; then
            aja "$TASOT" "$KORKEUS"
          else
            aja "$ALIN-6" 3
            aja "7" 1
          fi
          echo "--- tuotos ---"
          find ulos -name "*.${MUOTO:-webp}" | wc -l
          du -sh ulos
          df -h / | tail -1

      # Laatat ovat muuttumattomia: versio on polussa, joten sama
      # osoite ei koskaan saa uutta sisältöä. Nostotason laatat menevät
      # OMAN versionsa alle (nostot/-alipolku), jotta uusintapoltto ei
      # koske pohjan osoitteisiin.
      - name: Vie laatat ämpäriin
        if: ${{ inputs.vie }}
        env:
          VERSIO: ${{ inputs.versio }}
          NOSTOVERSIO: ${{ inputs.nostoversio || inputs.versio }}
          VIIVAVERSIO: ${{ inputs.viivaversio || inputs.versio }}
        run: |
          set -euo pipefail
          n=0
          # PAIKKAUS KIRJOITTAA KOPION PÄÄLLE, joten `sync` ei kelpaa:
          # se vertaa kokoa ja aikaleimaa ja voisi ohittaa juuri sen
          # laatan, jonka takia koko ajo tehtiin. `cp --recursive`
          # kirjoittaa aina.
          if [ -n "${{ matrix.shardi.paikkaus && 'true' || '' }}" ]; then
            for taso in ulos/z*; do
              [ -d "$taso" ] || continue
              z=$(basename "$taso")
              aws s3 cp --recursive "$taso" \
                "s3://${{ secrets.R2_BUCKET }}/julisteet/pyramidi/$VERSIO/$z" \
                --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
                --content-type "image/${MUOTO:-webp}" \
                --cache-control 'public, max-age=31536000, immutable' \
                --no-progress
              n=$((n + 1))
            done
            echo "Paikatut laatat viety $n tasolta versioon $VERSIO."
            exit 0
          fi

          for taso in ulos/z*; do
            [ -d "$taso" ] || continue
            z=$(basename "$taso")
            aws s3 sync "$taso" \
              "s3://${{ secrets.R2_BUCKET }}/julisteet/pyramidi/$VERSIO/$z" \
              --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
              --exclude '*' --include '*.webp' \
              --content-type image/webp \
              --cache-control 'public, max-age=31536000, immutable' \
              --no-progress
            n=$((n + 1))
          done
          if [ -d ulos/nostot ]; then
            aws s3 sync ulos/nostot \
              "s3://${{ secrets.R2_BUCKET }}/julisteet/pyramidi/$NOSTOVERSIO/nostot" \
              --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
              --exclude '*' --include '*.webp' \
              --content-type image/webp \
              --cache-control 'public, max-age=31536000, immutable' \
              --no-progress
            n=$((n + 1))
          fi
          # Viivatason laatat OMAN versionsa alle (viivat/-alipolku),
          # samasta syystä kuin nostotason: uusintapoltto ei saa koskea
          # pohjan ikuisiin osoitteisiin. Sama immutable-välimuisti.
          if [ -d ulos/viivat ]; then
            aws s3 sync ulos/viivat \
              "s3://${{ secrets.R2_BUCKET }}/julisteet/pyramidi/$VIIVAVERSIO/viivat" \
              --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
              --exclude '*' --include '*.webp' \
              --content-type image/webp \
              --cache-control 'public, max-age=31536000, immutable' \
              --no-progress
            n=$((n + 1))
          fi
          echo "Viety $n erää shardista ${{ matrix.shardi.nimi }}."

      # PAIKKAUS TODISTAA ITSENSÄ ENNEN KUIN LUETTELO JULKAISTAAN.
      #
      # Kaksi listausta (lähdeversio ja uusi versio) ja niiden ETagien
      # vertailu: jokaisen alueen ULKOPUOLISEN laatan on oltava
      # bitilleen lähteen laatta ja jokaisen alueen laatan on oltava
      # olemassa. Listaus on sekunteja; laattojen lataaminen olisi
      # gigatavu. R2 antaa yksiosaiselle objektille ETagiksi sisällön
      # MD5:n, joten kopion ehjyys on mitattavissa lataamatta mitään.
      #
      # Tämä on jobin viimeinen askel, ja luettelojobi tulee vasta
      # `needs: laatat` -riippuvuuden takaa: jos kopio jäi kesken tai
      # piirto vuoti alueen yli, uusi versio EI koskaan päädy
      # `pyramidi.json`:iin eikä siis kenenkään selaimeen.
      - name: Todenna paikkaus ämpärissä
        if: ${{ matrix.shardi.paikkaus && inputs.vie }}
        env:
          AMPARI: ${{ secrets.R2_BUCKET }}
          PAATE: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          # Sama työlista kuin piirrossa, samasta koodista.
          node tools/generoi-laattapyramidi.mjs paikkauslista \
            --tasot "$TASOT" --alue "$ALUE" --versio "$VERSIO" \
            --muoto "$MUOTO" --laatta "$LAATTA" --vain-lista
          aws s3api list-objects-v2 --bucket "$AMPARI" \
            --prefix "julisteet/pyramidi/$LAHDEVERSIO/" \
            --endpoint-url "$PAATE" > lahde-listaus.json
          aws s3api list-objects-v2 --bucket "$AMPARI" \
            --prefix "julisteet/pyramidi/$VERSIO/" \
            --endpoint-url "$PAATE" > paikattu-listaus.json
          node tools/paikkaa-pyramidi.mjs vertaa \
            --lahde lahde-listaus.json --paikattu paikattu-listaus.json \
            --lista paikkauslista/laatat.json

  # ---------------------------------------------------------- luettelo
  luettelo:
    needs: laatat
    if: ${{ inputs.vie }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_supported
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-fund --no-audit

      # `--kuiva` on pelkkää geometriaa: ei selainta, ei aineistoa, ei
      # piirtoa. Luettelo kuvaa KAIKKI tasot riippumatta siitä, mitkä
      # shardit ajettiin — se on pyramidin muoto, ei ajon tulos.
      # Luettelo kertoo myös nosto- ja viivatason: version, tasot ja
      # bittikartat siitä, mitkä läpinäkyvät laatat ovat olemassa —
      # kaikki pelkästä geometriasta (nostotasonPeite, viivatasonPeite),
      # joten sama komento kattaa myös vain-nostotaso- ja
      # vain-viivataso-ajon. Rajat tulevat repon omasta rajasetistä,
      # joten tämä jobi ei tarvitse aineistoa eikä verkkoa.
      # PAIKKAUKSEN LUETTELO PERII LÄHTEEN ASETUKSET, EI SYÖTTEITÄ.
      # Sama suunnitteluaskel kuin piirtojobissa: ämpärin `pyramidi.json`
      # kuvaa yhä lähdeversiota (se vaihdetaan vasta tämän jobin
      # lopussa), joten tasot, laatu, muoto, laattakoko, patina ja
      # ennen kaikkea NOSTOVERSIO luetaan siitä. Nostoversio on tässä
      # se, joka ei saa mennä väärin: nostolaatat jäivät oman versionsa
      # polkuun, eikä paikattu versio kopioinut niitä — jos luettelo
      # osoittaisi nostotason uuteen versioon, koko nostokerros
      # katoaisi kartalta.
      - name: Suunnittele paikkauksen luettelo
        if: ${{ inputs.tasot == 'paikkaus' }}
        env:
          LAHDEVERSIO: ${{ inputs.lahdeversio }}
          UUSI_VERSIO: ${{ inputs.versio }}
          ALUE: ${{ inputs.alue }}
          SYOTE_NOSTOVERSIO: ${{ inputs.nostoversio }}
          SYOTE_LAHDEPATINA: ${{ inputs.lahdepatina }}
        run: |
          set -euo pipefail
          aws s3 cp \
            "s3://${{ secrets.R2_BUCKET }}/julisteet/pyramidi/pyramidi.json" lahdeluettelo.json \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --no-progress
          LISA=""
          if [ -n "$SYOTE_NOSTOVERSIO" ]; then LISA="--nostoversio $SYOTE_NOSTOVERSIO"; fi
          if [ -n "$SYOTE_LAHDEPATINA" ]; then LISA="$LISA --patina $SYOTE_LAHDEPATINA"; fi
          node tools/paikkaa-pyramidi.mjs suunnittele \
            --luettelo lahdeluettelo.json \
            --lahdeversio "$LAHDEVERSIO" --versio "$UUSI_VERSIO" \
            --alue "$ALUE" $LISA --ulos "$GITHUB_ENV"

      - name: Kokoa luettelo
        env:
          SYOTE_VERSIO: ${{ inputs.versio }}
          SYOTE_NOSTOVERSIO: ${{ inputs.nostoversio || inputs.versio }}
          SYOTE_VIIVAVERSIO: ${{ inputs.viivaversio || inputs.versio }}
          SYOTE_LAATU: ${{ inputs.laatu }}
          SYOTE_PATINA: ${{ inputs.patina }}
          SYOTE_PIIRIT: ${{ inputs.piirit || 'kylla' }}
          SYOTE_TASOT: ${{ inputs.tasot == 'koeajo-z0-z3' && '0-3' || '0-7' }}
          KORKEUS: ${{ inputs.korkeus || '1' }}
          PAIKKAUS: ${{ inputs.tasot == 'paikkaus' && 'true' || '' }}
        run: |
          set -euo pipefail
          VERSIO="${VERSIO:-$SYOTE_VERSIO}"
          NOSTOVERSIO="${NOSTOVERSIO:-$SYOTE_NOSTOVERSIO}"
          VIIVAVERSIO="${VIIVAVERSIO:-$SYOTE_VIIVAVERSIO}"
          LAATU="${LAATU:-$SYOTE_LAATU}"
          PATINA="${PATINA:-$SYOTE_PATINA}"
          TASOT="${PAIKKAUS:+${TASOT:-}}"
          TASOT="${TASOT:-$SYOTE_TASOT}"
          LISA=""
          # Paikatussa luettelossa `alue` on null (pyramidi on täysi,
          # muuttumattomat laatat kopioitiin) ja piirretty laatikko
          # kirjataan `paikkaus`-olioon.
          if [ -n "$PAIKKAUS" ]; then
            LISA="--paikkaus $LAHDEVERSIO --alue $ALUE --muoto $MUOTO --laatta $LAATTA"
          fi
          # SAMA PIIRIKYTKIN KUIN LAATTASHARDILLA: luettelon bittikartta
          # lasketaan tässä uudestaan, ja ilman lippua se lupaisi piirien
          # kaistan laattoja, joita viivatasoshardi ei polttanut (ajo
          # 2026-09-01h kirjasi piirit: true vaikka laatat olivat puhtaat).
          if [ "${SYOTE_PIIRIT}" = "ei" ]; then LISA="$LISA --eipiirit"; fi
          # Korkeustarkkuus luetteloon TASOITTAIN samalla säännöllä kuin
          # laattashardeilla; luettelo ei lue ruudukkoa vaan kirjaa
          # pelkän säännön, joten se osaa kuvata z0–z7 yhdellä ajolla.
          node tools/generoi-laattapyramidi.mjs luettelo-ulos \
            --tasot "$TASOT" --versio "$VERSIO" --nostoversio "$NOSTOVERSIO" \
            --viivaversio "$VIIVAVERSIO" --kaariminuutit "$KORKEUS" \
            --laatu "$LAATU" --patina "$PATINA" $LISA --vain-luettelo
          cat luettelo-ulos/pyramidi.json | head -30

      # Luettelo EI ole muuttumaton: se osoittaa uusimpaan versioon, ja
      # sen on vaihduttava kun uusi erä ajetaan. Lyhyt välimuisti.
      - name: Vie luettelo ämpäriin
        run: |
          set -euo pipefail
          aws s3 cp luettelo-ulos/pyramidi.json \
            "s3://${{ secrets.R2_BUCKET }}/julisteet/pyramidi/pyramidi.json" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --content-type application/json \
            --cache-control 'public, max-age=300' \
            --no-progress
          echo "Luettelo viety: versio ${{ inputs.versio }}."
