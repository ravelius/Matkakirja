# Pöllösavuke Actions-ajona (omistajan linjaus 26.8.2026):
# POLLO_KEHITTAJAKOODI ja EHDOTUS_AVAIN ovat repon secreteissä, joten
# täysi savuke ajetaan täällä eikä paikallisesti — arvot eivät koskaan
# kulje keskustelun, työaseman tai lokien kautta. Tämä ajo on
# julkaisuportti pöllöön koskeville muutoksille; paikallinen
# savuke-pollo ajaa ilman koodeja osittaisena. Kaappaukset palautuvat
# ajon artifaktina (ladataan ja KATSOTAAN silmin kuten muutkin).
name: Savuke-pollo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  savuke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Asenna selain
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          echo "CHROMIUM=$(find ~/.cache/ms-playwright -name chrome -path '*chrome-linux*' -type f | head -1)" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_JS=$PWD/node_modules/playwright/index.js" >> "$GITHUB_ENV"
      - name: Pöllösavuke
        env:
          POLLO_KEHITTAJAKOODI: ${{ secrets.POLLO_KEHITTAJAKOODI }}
          EHDOTUS_AVAIN: ${{ secrets.EHDOTUS_AVAIN }}
          KAAPPAUSKANSIO: /tmp/matkakirja-kaappaukset
        run: node tools/savuke-pollo.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pollo-kaappaukset
          path: /tmp/matkakirja-kaappaukset/
          retention-days: 3
          if-no-files-found: warn
