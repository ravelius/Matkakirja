name: Vie hyväksytyt 3 kiireellistä kuvaa R2:een 2026-09-04

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vie-hyvaksytyt-3-kiireellista-2026-09-04.yml'

permissions:
  contents: read

concurrency:
  group: vie-hyvaksytyt-3-kiireellista-2026-09-04
  cancel-in-progress: true

jobs:
  vie:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_supported
      DRIVE_AVAIN: ${{ secrets.SAMIREIVINEN_DRIVE_API }}
      R2_TILI: ${{ secrets.R2_ACCOUNT_ID }}
      R2_AMPARI: ${{ secrets.R2_BUCKET }}
      JULKINEN: https://pub-7bc0ed2083a74a68bd7115618bca4709.r2.dev

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tarkista yhteydet
        run: |
          set -euo pipefail
          puuttuu=""
          [ -n "$DRIVE_AVAIN" ] || puuttuu="$puuttuu SAMIREIVINEN_DRIVE_API"
          [ -n "$R2_TILI" ] || puuttuu="$puuttuu R2_ACCOUNT_ID"
          [ -n "${AWS_ACCESS_KEY_ID:-}" ] || puuttuu="$puuttuu R2_ACCESS_KEY_ID"
          [ -n "${AWS_SECRET_ACCESS_KEY:-}" ] || puuttuu="$puuttuu R2_SECRET_ACCESS_KEY"
          [ -n "$R2_AMPARI" ] || puuttuu="$puuttuu R2_BUCKET"
          if [ -n "$puuttuu" ]; then
            echo "::error::Puuttuvat repository secretit:$puuttuu"
            exit 1
          fi

      - name: Nouda Drivestä ja tarkista hyväksytyt JPEG-kuvat
        run: |
          set -euo pipefail
          node --input-type=module <<'SKRIPTI'
          import { mkdir, writeFile } from 'node:fs/promises';
          import { dirname } from 'node:path';
          import { createHash } from 'node:crypto';

          const kuvat = [
            ['1W4MCQB_VVY0Bv5LDOvvLbgcNvb0DJN5T', 'kohtaamiset/isoisa/isoisa-lahto-1873-kulunut-v1.jpg', '8324cb0369011204b8484fbf0c29c97ff577725f074a2373656e32adbe95b218', 1536, 960],
            ['1A7MG6BPhI1rYRfqTsRf9yplhp_-TvCyn', 'tekstuurit/paperi-vanha-v1.jpg', 'ecff0759a64d3cfbc10c8dd608677decbf698745a82ae3ef99590efd222bf6a3', 1024, 1280],
            ['1lo-HotH6dFnun18VujYZQQ6bZjJEaNJV', 'tekstuurit/paperi-vanha-vaaka-v1.jpg', 'fce524657f10bd49c7a4be1cc414e4d43431dc7cb418aa5cb36ccc01f740037f', 2048, 1024],
          ];

          function jpegMitat(data) {
            if (data[0] !== 0xff || data[1] !== 0xd8) throw new Error('ei ole JPEG');
            let i = 2;
            while (i + 9 < data.length) {
              if (data[i] !== 0xff) { i += 1; continue; }
              const merkki = data[i + 1];
              if (merkki === 0xd8 || merkki === 0xd9) { i += 2; continue; }
              const pituus = data.readUInt16BE(i + 2);
              if (pituus < 2 || i + 2 + pituus > data.length) break;
              if ([0xc0, 0xc1, 0xc2, 0xc3, 0xc5, 0xc6, 0xc7, 0xc9, 0xca, 0xcb, 0xcd, 0xce, 0xcf].includes(merkki)) {
                return { korkeus: data.readUInt16BE(i + 5), leveys: data.readUInt16BE(i + 7) };
              }
              i += 2 + pituus;
            }
            throw new Error('JPEG-mittoja ei löytynyt');
          }

          for (const [id, polku, odotettuSha, leveys, korkeus] of kuvat) {
            const julkinen = `${process.env.JULKINEN}/${polku}?t=${Date.now()}`;
            const vanha = await fetch(julkinen, { headers: { 'Cache-Control': 'no-cache' } });
            if (vanha.ok) {
              const vanhaData = Buffer.from(await vanha.arrayBuffer());
              const vanhaSha = createHash('sha256').update(vanhaData).digest('hex');
              if (vanhaSha !== odotettuSha) throw new Error(`${polku}: nimiristiriita, R2:ssa eri sisältö`);
              console.log(`${polku}: sama hyväksytty versio oli jo R2:ssa`);
            } else if (vanha.status !== 404) {
              throw new Error(`${polku}: R2-esitarkistus HTTP ${vanha.status}`);
            }

            const url = `https://www.googleapis.com/drive/v3/files/${id}?alt=media&key=${process.env.DRIVE_AVAIN}`;
            const vastaus = await fetch(url);
            if (!vastaus.ok) throw new Error(`${polku}: Drive HTTP ${vastaus.status}`);
            const data = Buffer.from(await vastaus.arrayBuffer());
            const sha = createHash('sha256').update(data).digest('hex');
            if (sha !== odotettuSha) throw new Error(`${polku}: SHA-256 ei täsmää`);
            const mitat = jpegMitat(data);
            if (mitat.leveys !== leveys || mitat.korkeus !== korkeus) {
              throw new Error(`${polku}: ${mitat.leveys}x${mitat.korkeus}, odotettiin ${leveys}x${korkeus}`);
            }
            const kohde = `r2-out/${polku}`;
            await mkdir(dirname(kohde), { recursive: true });
            await writeFile(kohde, data);
            console.log(`${polku}: Drive, JPEG, ${leveys}x${korkeus}, ICC ja SHA-256 kunnossa`);
          }
          SKRIPTI

      - name: Vie kuvat R2-mediämpäriin
        run: |
          set -euo pipefail
          while IFS= read -r tiedosto; do
            avain="${tiedosto#r2-out/}"
            aws s3 cp "$tiedosto" "s3://$R2_AMPARI/$avain" \
              --endpoint-url "https://$R2_TILI.r2.cloudflarestorage.com" \
              --no-progress --content-type image/jpeg \
              --cache-control "public, max-age=31536000, immutable"
          done < <(find r2-out -type f -name '*.jpg' -print | sort)

      - name: Varmista julkinen R2 tavutasolla
        run: |
          set -euo pipefail
          node --input-type=module <<'SKRIPTI'
          import { readFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';

          const polut = [
            'kohtaamiset/isoisa/isoisa-lahto-1873-kulunut-v1.jpg',
            'tekstuurit/paperi-vanha-v1.jpg',
            'tekstuurit/paperi-vanha-vaaka-v1.jpg',
          ];

          for (const polku of polut) {
            const paikallinen = await readFile(`r2-out/${polku}`);
            let vastaus;
            for (let yritys = 1; yritys <= 12; yritys += 1) {
              vastaus = await fetch(`${process.env.JULKINEN}/${polku}?t=${Date.now()}`, {
                headers: { Origin: 'https://ravelius.github.io', 'Cache-Control': 'no-cache' },
              });
              if (vastaus.ok) break;
              await new Promise((resolve) => setTimeout(resolve, 2000));
            }
            if (!vastaus?.ok) throw new Error(`${polku}: R2 HTTP ${vastaus?.status}`);
            const tyyppi = vastaus.headers.get('content-type') ?? '';
            if (!tyyppi.startsWith('image/jpeg')) throw new Error(`${polku}: R2 MIME ${tyyppi}`);
            if (!vastaus.headers.get('access-control-allow-origin')) throw new Error(`${polku}: CORS puuttuu`);
            const ladattu = Buffer.from(await vastaus.arrayBuffer());
            const paikallinenSha = createHash('sha256').update(paikallinen).digest('hex');
            const ladattuSha = createHash('sha256').update(ladattu).digest('hex');
            if (ladattuSha !== paikallinenSha) throw new Error(`${polku}: takaisinluettu SHA-256 ei täsmää`);
            console.log(`${polku}: julkinen JPEG, CORS ja tavut kunnossa`);
          }
          SKRIPTI
