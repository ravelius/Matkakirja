# Vie ETOPO1:n 1′-korkeuspalat R2-ämpäriin.
#
# Omistajan tilaus 1.9.2026: *"korkeusdata pitää tehdä 1
# [kaariminuutin] tarkkuudella uudestaan."* Ruudukko on 466 Mt raakana,
# joten se pilkotaan 10° × 10° -paloihin (tools/tee-korkeuspalat.mjs) ja
# lukija noutaa vain tarvitsemansa palat. Aineiston lukija on
# laattapoltto; selainkokeilu, joka haki palat pelin puolelle, purettiin
# 2.9.2026 (*"Ota live pois ja polta 1 kaarisekuntti"*).
#
# AINEISTOA EI COMMITOIDA — sama sääntö kuin dist/-kansiolla: historia
# paisuisi eikä sitä saisi enää pieneksi. Siksi tämä ajo noutaa
# aineiston NOAA:lta AJOKONEELLA ja vie tuloksen suoraan ämpäriin.
# Palat päätyvät polkuun `julisteet/korkeus/1min/`, jonka julkinen
# osoite on
# https://pub-7bc0ed2083a74a68bd7115618bca4709.r2.dev/julisteet/korkeus/1min/
#
# === AJO ON MACILLA JA KAIKILLA YTIMILLÄ ============================
#
# Raamattu, MAC GITHUBIN AJOKONEENA (omistaja 6.9.2026 ilta) ja
# tarkennus 7.9.2026 aamu, sanatarkasti: *"No Tee loputkin macilla
# sitten"*. Ajokone valitaan syötteellä (oletus mac, vara actions).
# Palat jaetaan KAISTOIHIN ytimien mukaan: pala ei riipu naapuristaan,
# ja lähes kaikki työ on gzip −9 eli yhden ytimen laskentaa. Lähde
# noudetaan KERRAN ennen kaistoja (--nouda), jottei jokainen kaista
# lataisi samaa 322 Mt:n zipiä, ja luettelo kootaan kaistojen omista
# luetteloista (--kokoa) vasta lopuksi.
#
# Mitattu Actionsissa 1.9.2026 (4 vCPU, peräkkäin, run 33559583302):
# pilkkominen 107 s, vienti 77 s, koko ajo 3 min 14 s. Kaistoitus ja
# rinnakkainen vienti pudottavat kummankin murto-osaan Macilla.
#
# Palan tavut EIVÄT riipu kaistojen määrästä eikä luettelon järjestys
# muutu (kaista on yhtenäinen siivu samasta listasta) — todennettu
# kontissa 7.9.2026 kolmen palan otoksella: samat .bin.gz-tiivisteet ja
# sama luettelo.json peräkkäin ja kolmena kaistana.
#
# === NOAA:N TAVOITETTAVUUS ON TÄMÄN AJON AINOA RISKI ================
#
# Laattapyramidin ensimmäinen CI-koeajo kaatui siihen, ettei NOAA:n
# ERDDAP vastannut GitHubin ajokoneelta lainkaan ("fetch failed", ei
# HTTP-statusta), vaikka kehityskontista sama osoite vastaa
# sekunnissa (tools/korkeusaineisto/LUEMINUT.md). NCEI:n binäärilähdettä
# EI ollut siihen aikaan kokeiltu ajokoneelta.
#
# Siksi lähde on syöte eikä vakio, ja siksi KOEAJO on oma lippunsa:
# kolme palaa kertoo minuutissa vastaako lähde, ennen kuin kukaan
# odottaa 322 Mt:n latausta ja 648 palaa. Jos kumpikaan lähde ei vastaa
# ajokoneelta, se kirjataan — aineistoa EI kierretä committoimalla.
# (Mac-ajo on tässä myös varatie: omistajan verkosta NOAA vastaa,
# vaikkei se vastaisi GitHubin ajokoneelle.)
#
# Salaisuudet ovat tämän repon Actions-asetuksissa eivätkä koskaan
# täällä:
#   R2_ACCOUNT_ID  R2_ACCESS_KEY_ID  R2_SECRET_ACCESS_KEY  R2_BUCKET

name: Vie korkeuspalat R2:een

on:
  workflow_dispatch:
    inputs:
      ajokone:
        description: 'Missä ajetaan (mac = omistajan Mac Studio kaikilla ytimillä)'
        type: choice
        default: 'mac'
        options: ['mac', 'actions']
      kaistoja:
        description: 'Rinnakkaisia kaistoja (0 = ytimien mukaan; 1 = peräkkäin)'
        type: string
        default: '0'
      lahde:
        description: 'Mistä ETOPO1 1′ noudetaan'
        type: choice
        default: 'ncei'
        options: ['ncei', 'erddap']
      koeajo:
        description: 'Koeajo: vain kolme palaa (Alpit, Kreikka, Andit)'
        type: boolean
        default: true
      palat:
        description: 'Vain nämä palat, pilkuin (esim. N40E000,N30E020). Ohittaa koeajon.'
        type: string
        default: ''

permissions:
  contents: read

# Yksi ajo kerrallaan: kaksi rinnakkaista kirjoittaisi samoihin
# tiedostoihin ja luettelo menisi sekaisin.
concurrency:
  group: vie-korkeuspalat
  cancel-in-progress: false

jobs:
  vie:
    # Self-hosted-kone on omistajan oma (repo on julkinen): Mac-ajon saa
    # käynnistää vain omistaja. Sama ehto kuin polta-macilla.yml:ssä.
    if: inputs.ajokone != 'mac' || github.actor == github.repository_owner
    runs-on: ${{ fromJSON(inputs.ajokone == 'mac' && '["self-hosted","macOS"]' || '["ubuntu-latest"]') }}
    # Täysajo lataa 322 Mt, purkaa 466 Mt ja kirjoittaa 648 palaa.
    # Koeajo on minuutteja; katto on täysajoa varten.
    timeout-minutes: 180
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # R2 ei hyväksy AWS:n uudempia tarkistussummaotsakkeita, jotka
      # aws-cli 2.23:sta alkaen lähtevät oletuksena mukaan.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_supported
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: inputs.ajokone != 'mac'
        with:
          node-version: '22'

      # Macilla node@22 ja awscli tulevat koneelta; skripti tarkistaa ne
      # ja kertoo ytimien määrän (YTIMET). Chromiumia ei tarvita.
      - name: Mac-ajokoneen valmistelu
        if: inputs.ajokone == 'mac'
        run: tools/mac-ajovalmis.sh

      # Puuttuva salaisuus tulee muuten vastaan vasta aws-clin virheenä
      # "Invalid endpoint: https://.r2.cloudflarestorage.com", josta ei
      # arvaa mistä on kyse. Arvoja ei tulosteta, vain onko ne asetettu.
      - name: Tarkista että salaisuudet ovat tallessa
        env:
          TILI: ${{ secrets.R2_ACCOUNT_ID }}
          AVAIN: ${{ secrets.R2_ACCESS_KEY_ID }}
          SALAISUUS: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AMPARI: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          puuttuu=""
          [ -n "$TILI" ]      || puuttuu="$puuttuu R2_ACCOUNT_ID"
          [ -n "$AVAIN" ]     || puuttuu="$puuttuu R2_ACCESS_KEY_ID"
          [ -n "$SALAISUUS" ] || puuttuu="$puuttuu R2_SECRET_ACCESS_KEY"
          [ -n "$AMPARI" ]    || puuttuu="$puuttuu R2_BUCKET"
          if [ -n "$puuttuu" ]; then
            echo "::error::Näitä salaisuuksia ei löydy tästä reposta:$puuttuu"
            exit 1
          fi
          echo "Kaikki neljä salaisuutta löytyvät."

      # Tavoitettavuus mitataan ENNEN kuin mitään ladataan. Jos NOAA ei
      # vastaa ajokoneelta, ajo kaatuu tähän yhdellä selkeällä rivillä
      # eikä 20 minuutin päästä keskeneräiseen latausvirheeseen.
      - name: Vastaako NOAA ajokoneelta?
        env:
          LAHDE: ${{ inputs.lahde }}
        run: |
          set -euo pipefail
          if [ "$LAHDE" = "ncei" ]; then
            osoite='https://www.ngdc.noaa.gov/mgg/global/relief/ETOPO1/data/ice_surface/grid_registered/binary/etopo1_ice_g_i2.zip'
          else
            osoite='https://coastwatch.pfeg.noaa.gov/erddap/griddap/etopo360.das'
          fi
          echo "Kokeillaan: $osoite"
          if ! otsikot=$(curl -fsSI --max-time 120 "$osoite"); then
            echo "::error::NOAA:n lähde $LAHDE ei vastaa tältä ajokoneelta."
            echo "Kirjaa tämä raporttiin — aineistoa EI committoida repoon."
            exit 1
          fi
          echo "NOAA vastaa: $(printf '%s\n' "$otsikot" | sed -n 1p)"

      # Kaistoja on ytimien verran: pilkkoja on puhdasta laskentaa
      # (gzip −9) eikä se odota mitään, joten ylimääräinen rinnakkaisuus
      # ei auta muttei haittaakaan.
      - name: Kaistojen määrä
        env:
          KOEAJO: ${{ inputs.koeajo }}
          PALAT: ${{ inputs.palat }}
        run: |
          set -euo pipefail
          pyydetty="${{ inputs.kaistoja }}"
          if [ "${pyydetty:-0}" -gt 0 ] 2>/dev/null; then
            kaistoja="$pyydetty"
          else
            ytimet="${YTIMET:-}"
            if [ -z "$ytimet" ]; then ytimet="$(nproc 2>/dev/null || echo 4)"; fi
            kaistoja="$ytimet"
          fi
          # Kaistoja ei koskaan enempää kuin paloja: tyhjä kaista olisi
          # oma prosessinsa ja oma luettelonsa ilman yhtään palaa.
          if [ -n "$PALAT" ]; then paloja="$(printf '%s' "$PALAT" | tr ',' '\n' | grep -c '[^ ]')"
          elif [ "$KOEAJO" = "true" ]; then paloja=3
          else paloja=648; fi
          [ "$kaistoja" -le "$paloja" ] || kaistoja="$paloja"
          echo "KAISTOJA=$kaistoja" >> "$GITHUB_ENV"
          echo "Kaistoja: $kaistoja (paloja $paloja, ytimiä ${YTIMET:-tuntematon})"

      # Zip ladataan ja puretaan KERRAN. Ilman tätä jokainen kaista
      # aloittaisi omalla 322 Mt:n latauksellaan samaan välimuistiin.
      - name: Nouda lähdeaineisto kerran
        if: inputs.lahde == 'ncei'
        run: node tools/tee-korkeuspalat.mjs --lahde ncei --nouda

      - name: Pilko palat kaistoina
        env:
          LAHDE: ${{ inputs.lahde }}
          KOEAJO: ${{ inputs.koeajo }}
          PALAT: ${{ inputs.palat }}
        run: |
          set -euo pipefail
          rajaus=""
          if [ -n "$PALAT" ]; then rajaus="--palat $PALAT"
          elif [ "$KOEAJO" = "true" ]; then rajaus="--koeajo"; fi
          echo "Rajaus: ${rajaus:-koko maailma}"
          rm -rf korkeus/1min lokit
          mkdir -p lokit
          pidit=()
          for k in $(seq 0 $((KAISTOJA - 1))); do
            # shellcheck disable=SC2086
            node tools/tee-korkeuspalat.mjs --lahde "$LAHDE" --ulos korkeus/1min \
              $rajaus --osa "$k/${KAISTOJA}" > "lokit/kaista-$k.log" 2>&1 &
            pidit+=($!)
          done
          # Taustaprosessin kaatuminen ei näy `set -e`:lle, joten
          # jokaisen kaistan paluuarvo katsotaan erikseen.
          tila=0
          for p in "${pidit[@]}"; do wait "$p" || tila=1; done
          for l in lokit/*.log; do
            echo "::group::$l"; tail -n 20 "$l"; echo "::endgroup::"
          done
          if [ "$tila" -ne 0 ]; then echo "::error::kaista kaatui"; exit 1; fi
          # Luettelo kaistojen omista luetteloista: sama järjestys kuin
          # peräkkäisajossa, ja tarkistaa että jokainen pala on levyllä.
          node tools/tee-korkeuspalat.mjs --lahde "$LAHDE" --ulos korkeus/1min \
            $rajaus --kokoa "$KAISTOJA"
          # EI `ls | head` pipefail-tilassa: head sulkee putken ennen kuin
          # ls on kirjoittanut 648 riviä, ls saa SIGPIPEn ja koko vaihe
          # kaatuu (täysajo 1.9.2026 21:07 UTC: palat valmiit, vienti
          # jäi tekemättä "Broken pipe" -virheeseen). find rajaa itse.
          find korkeus/1min -name '*.bin.gz' | sort | sed -n '1,20p'
          echo "paloja levylla: $(find korkeus/1min -name '*.bin.gz' | wc -l)"
          du -sh korkeus/1min

      # `cp --recursive` eikä `sync`: palat ovat muuttumatonta
      # lähtöaineistoa, ja osittainen ajo (koeajo, yksittäiset palat) ei
      # saa poistaa ämpäristä sitä, mitä se ei tällä kertaa tuottanut.
      # `--include '*.bin.gz'` jättää myös kaistojen omat luettelot
      # (luettelo-osa-k-n.json) ämpärin ulkopuolelle: ne ovat ajon
      # työtiedostoja eivätkä aineistoa.
      - name: Vie ämpäriin
        env:
          KOEAJO: ${{ inputs.koeajo }}
          PALAT: ${{ inputs.palat }}
        run: |
          set -euo pipefail
          # Rinnakkainen vienti omaan asetustiedostoon: koneen omaa
          # ~/.aws-asetusta ei muuteta (Mac on omistajan työkone).
          export AWS_CONFIG_FILE="$PWD/.aws-vienti.conf"
          aws configure set default.s3.max_concurrent_requests 32
          aws configure set default.s3.max_queue_size 10000
          aws s3 cp --recursive korkeus/1min \
            "s3://${{ secrets.R2_BUCKET }}/julisteet/korkeus/1min" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --exclude '*' --include '*.bin.gz' \
            --content-type application/gzip --no-progress
          # LUETTELO VAIN TÄYSAJOSTA. Osittaisen ajon luettelossa on
          # vain sen omat palat, ja ämpäriin vietynä se väittäisi, ettei
          # muita ole olemassa. Peli ei tarvitse luetteloa piirtääkseen
          # (puuttuva pala on 404 = ei varjoa), joten se on aineiston
          # oma sisällysluettelo eikä pelin riippuvuus.
          if [ -z "$PALAT" ] && [ "$KOEAJO" != "true" ]; then
            aws s3 cp korkeus/1min/luettelo.json \
              "s3://${{ secrets.R2_BUCKET }}/julisteet/korkeus/1min/luettelo.json" \
              --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
              --content-type application/json --no-progress
          else
            echo "Osittainen ajo: luettelo.json jätettiin ämpärissä ennalleen."
          fi
          echo "Viety $(find korkeus/1min -name '*.bin.gz' | wc -l) palaa."
          echo "Julkinen juuri: https://pub-7bc0ed2083a74a68bd7115618bca4709.r2.dev/julisteet/korkeus/1min/"

      - name: Lokit talteen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: korkeuspalat-lokit-${{ github.run_id }}
          path: lokit/
          if-no-files-found: ignore
          retention-days: 14
