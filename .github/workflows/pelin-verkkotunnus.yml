# Pelin oma verkkotunnus matkakirja.app: DNS GitHub Pagesille ja R2:n
# CORS-sallinta uudelle originille, Cloudflaren rajapinnalla.
#
# Omistaja 6.9.2026: "Siirrä vain peli" (matkakirja.app ostettu samana
# aamuna; media on jo osoitteessa media.matkakirja.app).
#
# Peli julkaistaan GitHub Pagesista (pages.yml, actions/deploy-pages), ja
# oma verkkotunnus vaatii KOLME asiaa:
#   1. DNS Cloudflaressa: juuri (apex) A- ja AAAA-tietueet GitHub Pagesin
#      osoitteisiin ja www CNAME → ravelius.github.io. Tämä ajo tekee ne
#      (proxied=false eli "DNS only", jotta GitHub voi myöntää
#      HTTPS-varmenteen; Cloudflaren välityksen voi kytkeä myöhemmin).
#   2. R2-ämpärin CORS: uusi origin https://matkakirja.app sääntöihin,
#      muuten media.matkakirja.app ei anna kuvia/ääniä uudelle
#      pelisivulle. Tämä ajo lisää sen.
#   3. GitHub → Settings → Pages → Custom domain = matkakirja.app ja
#      Enforce HTTPS. TÄTÄ AJO EI VOI TEHDÄ (Pages-asetus ei ole
#      työnkulun tokenin ulottuvilla): omistaja tekee sen käsin.
#
#   toiminto: listaa — näyttää vyöhykkeen DNS-tietueet ja ämpärin CORS-
#                      säännöt, ei muuta mitään.
#   toiminto: lisaa  — luo puuttuvat DNS-tietueet ja lisää originin
#                      CORS-sääntöihin (idempotentti: olemassa olevaa ei
#                      luoda uudestaan).
name: Pelin verkkotunnus (matkakirja.app)

on:
  workflow_dispatch:
    inputs:
      toiminto:
        description: 'listaa | lisaa'
        required: true
        default: 'listaa'
        type: choice
        options: [listaa, lisaa]
      verkkotunnus:
        description: 'Pelin verkkotunnus (juuri)'
        required: true
        default: 'matkakirja.app'

jobs:
  verkkotunnus:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      TOIMINTO: ${{ github.event.inputs.toiminto }}
      VERKKOTUNNUS: ${{ github.event.inputs.verkkotunnus }}
      PAGES_KOHDE: ravelius.github.io
    steps:
      - name: Vyöhyke
        id: zone
        run: |
          set -euo pipefail
          ZONE=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/zones?name=$VERKKOTUNNUS" \
            | python3 -c 'import sys,json;d=json.load(sys.stdin);r=d.get("result") or [];print(r[0]["id"] if r else "")')
          [ -n "$ZONE" ] || { echo "::error::vyöhykettä $VERKKOTUNNUS ei löydy (tokenilla Zone Read?)"; exit 1; }
          echo "zone=$ZONE" >> "$GITHUB_OUTPUT"
          echo "vyöhyke: $ZONE"

      - name: DNS-tietueet nyt
        run: |
          set -euo pipefail
          curl -sS -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/${{ steps.zone.outputs.zone }}/dns_records?per_page=100" \
            | python3 -c '
          import sys,json
          d=json.load(sys.stdin)
          if not d.get("success"): print("DNS-lista ei onnistunut:", d.get("errors")); sys.exit(0)
          for r in d["result"]:
              print("dns:", r["type"], r["name"], "->", r["content"], "| proxied:", r.get("proxied"))
          print("tietueita:", len(d["result"]))'

      - name: R2:n CORS-säännöt nyt
        run: |
          set -euo pipefail
          curl -sS -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/r2/buckets/$R2_BUCKET/cors" \
            | python3 -c 'import sys,json;d=json.load(sys.stdin);print(json.dumps(d.get("result") if d.get("success") else d.get("errors"),indent=1,ensure_ascii=False))'

      - name: Luo DNS-tietueet GitHub Pagesille
        if: env.TOIMINTO == 'lisaa'
        run: |
          set -euo pipefail
          Z="${{ steps.zone.outputs.zone }}"
          API="https://api.cloudflare.com/client/v4/zones/$Z/dns_records"
          NYKYISET=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" "$API?per_page=100")
          luo() { # tyyppi nimi sisältö
            if printf '%s' "$NYKYISET" | python3 -c '
          import sys,json
          t,n,c=sys.argv[1:4]
          d=json.load(sys.stdin)
          sys.exit(0 if any(r["type"]==t and r["name"]==n and r["content"]==c for r in d.get("result",[])) else 1)' "$1" "$2" "$3"; then
              echo "on jo: $1 $2 -> $3"; return
            fi
            curl -sS -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" "$API" \
              --data "{\"type\":\"$1\",\"name\":\"$2\",\"content\":\"$3\",\"ttl\":1,\"proxied\":false}" \
              | python3 -c 'import sys,json;d=json.load(sys.stdin);print("luotu" if d.get("success") else "VIRHE", sys.argv[1], sys.argv[2], "->", sys.argv[3], "" if d.get("success") else d.get("errors"))' "$1" "$2" "$3"
          }
          # GitHub Pagesin apex-osoitteet (docs.github.com: Managing a custom domain)
          for ip in 185.199.108.153 185.199.109.153 185.199.110.153 185.199.111.153; do luo A "$VERKKOTUNNUS" "$ip"; done
          for ip6 in 2606:50c0:8000::153 2606:50c0:8001::153 2606:50c0:8002::153 2606:50c0:8003::153; do luo AAAA "$VERKKOTUNNUS" "$ip6"; done
          luo CNAME "www.$VERKKOTUNNUS" "$PAGES_KOHDE"

      - name: Lisää origin R2:n CORS-sääntöihin
        if: env.TOIMINTO == 'lisaa'
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/r2/buckets/$R2_BUCKET/cors"
          curl -sS -H "Authorization: Bearer $CF_TOKEN" "$API" > /tmp/cors.json
          python3 - "$VERKKOTUNNUS" <<'PY'
          import sys,json
          v=sys.argv[1]
          d=json.load(open('/tmp/cors.json'))
          if not d.get('success'):
              print('CORS-haku ei onnistunut:', d.get('errors')); sys.exit(1)
          rules=(d.get('result') or {}).get('rules') or []
          uudet=[f'https://{v}', f'https://www.{v}']
          if not rules:
              rules=[{'allowed':{'origins':['https://ravelius.github.io']+uudet,'methods':['GET','HEAD'],'headers':['range','content-type']},'exposeHeaders':['content-length','content-range','accept-ranges','etag'],'maxAgeSeconds':86400}]
              print('ei sääntöjä ennestään: luodaan yksi')
          muutos=False
          for r in rules:
              o=r.setdefault('allowed',{}).setdefault('origins',[])
              for u in uudet:
                  if u not in o and '*' not in o: o.append(u); muutos=True
          json.dump({'rules':rules}, open('/tmp/cors-uusi.json','w'))
          print('säännöt:', json.dumps(rules, indent=1, ensure_ascii=False))
          print('muutos:', muutos)
          PY
          curl -sS -X PUT -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" "$API" \
            --data @/tmp/cors-uusi.json | python3 -c 'import sys,json;d=json.load(sys.stdin);print("CORS päivitetty" if d.get("success") else "CORS-VIRHE", d.get("errors"))'

      - name: Muistutus käsityöstä
        if: env.TOIMINTO == 'lisaa'
        run: |
          echo "::notice::Tee vielä GitHubissa: Settings → Pages → Custom domain = $VERKKOTUNNUS, sitten Enforce HTTPS kun varmenne on myönnetty. Työnkulun token ei yllä Pages-asetuksiin."
