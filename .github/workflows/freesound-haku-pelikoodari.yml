# Kertaluonteinen Freesound-haku (Pelikoodari 8.10.2026, Olavinlinnan aanet-fp-v2). Vain tämän haaran pushista; ei mergetä.
name: Freesound-haku (Pelikoodari)
on:
  push:
    branches: [pelikoodari-freesound-haku]
permissions:
  contents: read
jobs:
  hae:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - env:
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API }}
        run: >
          node tools/aanet/freesound-haku.mjs /tmp/fs
          "bateau|bateau mouche|5|120|by"
          "bateau|tour boat passing river|5|120|by"
          "bateau|river boat engine passing|5|120|by"
          "torvi|boat horn river|1|15|by"
          "torvi|ship horn short|1|15|by"
          "kyyhky|pigeons flying wings|1|30|by"
          "kyyhky|pigeons flock take off|1|30|by"
          "kyyhky|pigeon cooing|3|60|by"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freesound
          path: /tmp/fs/
