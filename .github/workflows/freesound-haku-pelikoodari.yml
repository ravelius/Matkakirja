# Kertaluonteinen Freesound-haku (Pelikoodari 8.10.2026, Olavinlinnan aanet-fp-v2). Vain tämän haaran pushista; ei mergetä.
name: Freesound-haku (Pelikoodari)
on:
  push:
    branches: [pelikoodari-freesound-haku]
permissions:
  contents: read
jobs:
  hae:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - env:
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API }}
        run: >
          node tools/aanet/freesound-haku.mjs /tmp/fs
          "sukellus|dive into water splash|0.5|4"
          "sukellus|jump into water|0.5|4"
          "sukellus|splash body water|0.5|4"
          "koysi-kiinnitys|rope creak|0.5|8"
          "koysi-kiinnitys|rope tension creak|0.5|8"
          "koysi-kiinnitys|rope tighten|0.5|8"
          "koysi-lasku|rope creaking loop|3|30"
          "koysi-lasku|rope slide friction|1|30"
          "koysi-lasku|ship rope creak|3|30"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freesound
          path: /tmp/fs/
