# Kertaluonteinen Freesound-haku (Pelikoodari 8.10.2026, Olavinlinnan aanet-fp-v2; 9.10. kaupunkien äänimaisema (PT, CC0)). Vain tämän haaran pushista; ei mergetä.
name: Freesound-haku (Pelikoodari)
on:
  push:
    branches: [pelikoodari-freesound-haku]
permissions:
  contents: read
jobs:
  hae:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - env:
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API }}
        run: >
          node tools/aanet/freesound-haku.mjs /tmp/fs
          "raitiovaunu|tram passing distant|20|180"
          "raitiovaunu|streetcar city ambience|20|180"
          "metro|metro train distant underground|20|180"
          "tori|market square crowd ambience|30|240"
          "tori|outdoor market walla|30|240"
          "lapset|children playing park distant|30|240"
          "lapset|playground kids ambience|30|240"
          "kahvila|cafe ambience cups clinking|30|240"
          "kahvila|coffee shop walla dishes|30|240"
          "laituri|water lapping quay|20|240"
          "laituri|harbour pier waves boats|20|240"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freesound
          path: /tmp/fs/
