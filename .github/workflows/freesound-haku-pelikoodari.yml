# Kertaluonteinen Freesound-haku (Pelikoodari 8.10.2026; 9.10. ilta Soundly-aukot r016 tupa, r080 kaksitaso, r075 höyrylaiva (PT); Olavinlinnan aanet-fp-v2; 9.10. kaupunkikohtainen sorina Tukholma ja Pariisi (PT: ei vieraskielistä puhetta)). Vain tämän haaran pushista; ei mergetä.
name: Freesound-haku (Pelikoodari)
on:
  push:
    branches: [pelikoodari-freesound-haku]
permissions:
  contents: read
jobs:
  hae:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - env:
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API }}
        run: >
          node tools/aanet/freesound-haku.mjs /tmp/fs
          "r067-piikivi|flint steel|0.3|30|by"
          "r067-piikivi|flint striker|0.3|30|by"
          "r067-piikivi|fire steel|0.3|30|by"
          "r067-soihtu|torch ignite|0.5|30|by"
          "r067-soihtu|torch fire|2|60|by"
          "r125-syke|heartbeat fast|2|60|by"
          "r125-syke|heartbeat|2|60|by"
          "r125-syke|heart beat|2|60|by"
          "r074-kaivo|well bucket|1|60|by"
          "r074-kaivo|winch rope|1|60|by"
          "r074-kaivo|windlass|1|60|by"
          "r074-kaivo|bucket water well|1|60|by"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freesound
          path: /tmp/fs/
