# Kertaluonteinen Freesound-haku (Pelikoodari 8.10.2026, Olavinlinnan aanet-fp-v2; 9.10. kaupunkikohtainen sorina Tukholma ja Pariisi (PT: ei vieraskielistä puhetta)). Vain tämän haaran pushista; ei mergetä.
name: Freesound-haku (Pelikoodari)
on:
  push:
    branches: [pelikoodari-freesound-haku]
permissions:
  contents: read
jobs:
  hae:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - env:
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API }}
        run: >
          node tools/aanet/freesound-haku.mjs /tmp/fs
          "lippu|flag flapping wind|10|120|by"
          "lippu|flag flutter|10|120|by"
          "poltin|hot air balloon burner|1|60|by"
          "poltin|propane burner|1|60|by"
          "raitiovaunu|tram pass by|3|60|by"
          "pyoran-kello|bicycle bell|0.3|4|by"
          "laivan-torvi|ship horn|1|20|by"
          "laivan-torvi|ferry horn|1|20|by"
          "nauru|laughter outdoor|1|10|by"
          "lapsi|child laughing|0.5|6|by"
          "sorina|crowd walla passing|3|40|by"
          "katusoittaja|street musician accordion|15|180|by"
          "katusoittaja|busker guitar|15|180|by"
          "katusoittaja|busker violin|15|180|by"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freesound
          path: /tmp/fs/
