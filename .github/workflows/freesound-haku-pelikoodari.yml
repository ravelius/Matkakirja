# Kertaluonteinen Freesound-haku (Pelikoodari 8.10.2026, Olavinlinnan aanet-fp-v2). Vain tämän haaran pushista; ei mergetä.
name: Freesound-haku (Pelikoodari)
on:
  push:
    branches: [pelikoodari-freesound-haku]
permissions:
  contents: read
jobs:
  hae:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - env:
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API }}
        run: >
          node tools/aanet/freesound-haku.mjs /tmp/fs
          "luukku|wooden door creak|1|6|by"
          "luukku|old door creak|1|6|by"
          "olki|footsteps hay|3|40|by"
          "olki|walking on straw|3|40|by"
          "liina|fabric shake|0.5|3|by"
          "liina|cloth flap|0.5|3|by"
          "nappula|chess piece|0.1|1.5|by"
          "nappula|wooden piece on board|0.1|1.5|by"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freesound
          path: /tmp/fs/
