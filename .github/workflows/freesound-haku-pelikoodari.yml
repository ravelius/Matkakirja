# Kertaluonteinen Freesound-haku (Pelikoodari 8.10.2026; 9.10. ilta Soundly-aukot r016 tupa, r080 kaksitaso, r075 höyrylaiva (PT); Olavinlinnan aanet-fp-v2; 9.10. kaupunkikohtainen sorina Tukholma ja Pariisi (PT: ei vieraskielistä puhetta)). Vain tämän haaran pushista; ei mergetä.
name: Freesound-haku (Pelikoodari)
on:
  push:
    branches: [pelikoodari-freesound-haku]
permissions:
  contents: read
jobs:
  hae:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - env:
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API }}
        run: >
          node tools/aanet/freesound-haku.mjs /tmp/fs
          "r071-kori|wicker basket|1|120|by"
          "r071-kori|wicker creak|1|120|by"
          "r071-kori|basket creak|1|120|by"
          "r071-kori|hot air balloon|3|300|by"
          "r071-kori|rope creak|1|120|by"
          "r071-kori|rattan|1|120|by"
          "r003-rako|wind howling|10|300|by"
          "r003-rako|wind whistling|10|300|by"
          "r003-rako|wind door gap|5|300|by"
          "r003-rako|wind keyhole|5|300|by"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freesound
          path: /tmp/fs/
