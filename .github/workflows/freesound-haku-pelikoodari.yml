# Kertaluonteinen Freesound-haku (Pelikoodari 8.10.2026, Olavinlinnan aanet-fp-v2; 9.10. kaupunkikohtainen sorina Tukholma ja Pariisi (PT: ei vieraskielistä puhetta)). Vain tämän haaran pushista; ei mergetä.
name: Freesound-haku (Pelikoodari)
on:
  push:
    branches: [pelikoodari-freesound-haku]
permissions:
  contents: read
jobs:
  hae:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - env:
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API }}
        run: >
          node tools/aanet/freesound-haku.mjs /tmp/fs
          "pariisi-tori|paris market|20|300|by"
          "pariisi-tori|marche paris|20|300|by"
          "pariisi-kahvila|paris cafe|20|300|by"
          "pariisi-kahvila|cafe parisien terrasse|20|300|by"
          "pariisi-lapset|paris park children|20|300|by"
          "pariisi-lapset|jardin enfants paris|20|300|by"
          "pariisi-metro|paris metro station|20|300|by"
          "pariisi-raitiovaunu|paris tram|20|300|by"
          "tukholma-tori|stockholm market|20|300|by"
          "tukholma-tori|stockholm square people|20|300|by"
          "tukholma-kahvila|stockholm cafe|20|300|by"
          "tukholma-lapset|stockholm park children|20|300|by"
          "tukholma-metro|stockholm tunnelbana|20|300|by"
          "tukholma-metro|stockholm subway|20|300|by"
          "tukholma-raitiovaunu|stockholm tram|20|300|by"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freesound
          path: /tmp/fs/
