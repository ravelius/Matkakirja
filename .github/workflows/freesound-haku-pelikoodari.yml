# Kertaluonteinen Freesound-haku (Pelikoodari 8.10.2026, Olavinlinnan aanet-fp-v2; 9.10. läpipeluun puuttuvat äänet #4245). Vain tämän haaran pushista; ei mergetä.
name: Freesound-haku (Pelikoodari)
on:
  push:
    branches: [pelikoodari-freesound-haku]
permissions:
  contents: read
jobs:
  hae:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - env:
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API }}
        run: >
          node tools/aanet/freesound-haku.mjs /tmp/fs
          "sytytys|torch ignite whoosh|0.3|3|by"
          "sytytys|fire ignition burst|0.3|3|by"
          "vesisanko|bucket water splash|0.5|4|by"
          "vesisanko|water bucket pour|0.5|4|by"
          "viitta|cloak swish|0.2|3|by"
          "viitta|cloth whoosh movement|0.2|3|by"
          "hanska|leather glove grab|0.2|3|by"
          "hanska|leather glove handle object|0.2|3|by"
          "varusteet|chainmail walking loop|3|60|by"
          "varusteet|armor movement jingle|2|60|by"
          "kauha|ladle pot stir|0.5|8|by"
          "kauha|metal ladle clank|0.3|5|by"
          "luuta|broom sweeping stone floor|2|30|by"
          "nauris|vegetable hit thud|0.2|3|by"
          "nauris|potato throw impact|0.2|3|by"
          "savipurkki|clay pot break|0.3|4|by"
          "savipurkki|ceramic pot smash|0.3|4|by"
          "patapino|pots and pans fall|0.5|6|by"
          "patapino|cookware crash|0.5|6|by"
          "kolikot|coins chest|0.5|6|by"
          "kolikot|silver coins pile|0.5|6|by"
          "tarjotin|metal tray clatter|0.3|4|by"
          "tarjotin|tray drop dishes|0.3|4|by"
          "yolinnut|owl night forest|10|180|by"
          "yolinnut|night birds summer ambience|10|180|by"
          "koira|distant dog barking night|5|120|by"
          "koira|dog barking far village|5|120|by"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freesound
          path: /tmp/fs/
