# Kertaluonteinen Freesound-haku (Pelikoodari 8.10.2026, Olavinlinnan aanet-fp-v2). Vain tämän haaran pushista; ei mergetä.
name: Freesound-haku (Pelikoodari)
on:
  push:
    branches: [pelikoodari-freesound-haku]
permissions:
  contents: read
jobs:
  hae:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - env:
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API }}
        run: >
          node tools/aanet/freesound-haku.mjs /tmp/fs
          "lisenssi|id:94031,160461,165464,176134,202876,245691,253301,271525,315660,340276,407583,410078,411509,411774,411996,416891,433002,436942,438877,456092,466570,486437,504694,511005,535816,543449,543819,557122,565015,570907,573187,577480,579250,586106,612318,635103,635912,650986,666866,677252,677253,683118,713120,714271,723081,731247,731249,764981,818589,842183,843466,844137,845957,848927,856165,862556"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freesound
          path: /tmp/fs/
