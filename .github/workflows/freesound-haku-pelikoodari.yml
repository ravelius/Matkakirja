# Kertaluonteinen Freesound-haku (Pelikoodari 8.10.2026, Olavinlinnan aanet-fp-v2). Vain tämän haaran pushista; ei mergetä.
name: Freesound-haku (Pelikoodari)
on:
  push:
    branches: [pelikoodari-freesound-haku]
permissions:
  contents: read
jobs:
  hae:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - env:
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API }}
        run: >
          node tools/aanet/freesound-haku.mjs /tmp/fs
          "sade-vesi|rain lake|15|180"
          "sade-vesi|rain water surface|15|180"
          "sade-vesi|rain pond|15|180"
          "sade-pressu|rain tarp|15|180"
          "sade-pressu|rain tent|15|180"
          "sade-vene|rain boat|15|180"
          "sade-kivi|rain stone|15|180"
          "sade-kivi|rain pavement|15|180"
          "sade-laituri|rain wood|15|180"
          "tippuminen|dripping gutter|15|180"
          "tippuminen|water drips|15|180"
      - uses: actions/upload-artifact@v4
        with:
          name: freesound
          path: /tmp/fs/
