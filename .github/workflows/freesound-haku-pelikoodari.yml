# Kertaluonteinen Freesound-haku (Pelikoodari 8.10.2026, Olavinlinnan aanet-fp-v2). Vain tämän haaran pushista; ei mergetä.
name: Freesound-haku (Pelikoodari)
on:
  push:
    branches: [pelikoodari-freesound-haku]
permissions:
  contents: read
jobs:
  hae:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - env:
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API }}
        run: >
          node tools/aanet/freesound-haku.mjs /tmp/fs
          "sade-vesi|id:399281,626171,680681|15|180"
          "sade-pressu|id:534551,592996,457594|15|180"
          "sade-puu|id:547927,849790|15|180"
          "tippuminen-raystas|dripping gutter|15|180"
          "tippuminen-raystas|rain drips roof|15|180"
          "tippuminen-muuri|cave drips|15|180"
          "tippuminen-muuri|cellar dripping|15|180"
          "sade-puu|rain porch|15|180"
          "sade-puu|rain deck|15|180"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freesound
          path: /tmp/fs/
