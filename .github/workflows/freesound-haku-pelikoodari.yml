# Kertaluonteinen Freesound-haku (Pelikoodari 8.10.2026, Olavinlinnan aanet-fp-v2). Vain tämän haaran pushista; ei mergetä.
name: Freesound-haku (Pelikoodari)
on:
  push:
    branches: [pelikoodari-freesound-haku]
permissions:
  contents: read
jobs:
  hae:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - env:
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API }}
        run: >
          node tools/aanet/freesound-haku.mjs /tmp/fs
          "sade-vesi|rain on lake water surface|15|180"
          "sade-vesi|rain falling on water river pond|15|180"
          "sade-pressu|rain on tarp canvas tent|15|180"
          "sade-vene|rain on wooden boat|10|180"
          "sade-kivi|rain on stone pavement courtyard|15|180"
          "sade-laituri|rain on wooden dock pier|10|180"
          "tippuminen|dripping water drops gutter eaves|10|120"
      - uses: actions/upload-artifact@v4
        with:
          name: freesound
          path: /tmp/fs/
