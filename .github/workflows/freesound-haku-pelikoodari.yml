# Kertaluonteinen Freesound-haku (Pelikoodari 8.10.2026; 9.10. ilta Soundly-aukot r016 tupa, r080 kaksitaso, r075 höyrylaiva (PT); Olavinlinnan aanet-fp-v2; 9.10. kaupunkikohtainen sorina Tukholma ja Pariisi (PT: ei vieraskielistä puhetta)). Vain tämän haaran pushista; ei mergetä.
name: Freesound-haku (Pelikoodari)
on:
  push:
    branches: [pelikoodari-freesound-haku]
permissions:
  contents: read
jobs:
  hae:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - env:
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API }}
        run: >
          node tools/aanet/freesound-haku.mjs /tmp/fs
          "r016-tupa|tavern|20|300|by"
          "r016-tupa|medieval tavern|10|300|by"
          "r016-tupa|pub crowd|20|300|by"
          "r016-tupa|crowd laughter indoor|20|300|by"
          "r016-tupa|inn ambience|20|300|by"
          "r016-tupa|walla laughing|10|300|by"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freesound
          path: /tmp/fs/
