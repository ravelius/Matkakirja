# Kertaluonteinen Freesound-haku (Pelikoodari 8.10.2026; 9.10. ilta Soundly-aukot r016 tupa, r080 kaksitaso, r075 höyrylaiva (PT); Olavinlinnan aanet-fp-v2; 9.10. kaupunkikohtainen sorina Tukholma ja Pariisi (PT: ei vieraskielistä puhetta)). Vain tämän haaran pushista; ei mergetä.
name: Freesound-haku (Pelikoodari)
on:
  push:
    branches: [pelikoodari-freesound-haku]
permissions:
  contents: read
jobs:
  hae:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - env:
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API }}
        run: >
          node tools/aanet/freesound-haku.mjs /tmp/fs
          "r016-tupa|tavern ambience crowd laughter|20|300|by"
          "r016-tupa|medieval inn crowd|20|300|by"
          "r016-tupa|pub walla laughter|20|300|by"
          "r016-tupa|great hall feast crowd|20|300|by"
          "r080-kaksitaso|tiger moth|3|300|by"
          "r080-kaksitaso|biplane engine|3|300|by"
          "r080-kaksitaso|vintage propeller plane flyby|3|300|by"
          "r080-kaksitaso|radial engine start idle|3|300|by"
          "r075-hoyrylaiva|steamship engine|5|300|by"
          "r075-hoyrylaiva|paddle steamer|5|300|by"
          "r075-hoyrylaiva|steam engine room|5|300|by"
          "r075-hoyrylaiva|steamboat whistle departure|3|120|by"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freesound
          path: /tmp/fs/
