# Kertaluonteinen Freesound-haku (Pelikoodari 8.10.2026, Olavinlinnan aanet-fp-v2). Vain tämän haaran pushista; ei mergetä.
name: Freesound-haku (Pelikoodari)
on:
  push:
    branches: [pelikoodari-freesound-haku]
permissions:
  contents: read
jobs:
  hae:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - env:
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API }}
        run: >
          node tools/aanet/freesound-haku.mjs /tmp/fs
          "tuuli|wind gust|8|60"
          "tuuli|strong wind|8|60"
          "tuuli|wind howling tundra|8|90"
          "tuuli|arctic wind|8|90"
          "poltin|hot air balloon burner|1|10"
          "poltin|gas burner whoosh|0.5|6"
          "kori|wicker basket creak|0.5|6"
          "luukku|trapdoor creak|0.5|5"
          "luukku|wooden hatch creak|0.5|5"
          "liina|cloth unfold|0.3|3"
          "liina|fabric flap|0.3|3"
          "askel-olki|footsteps straw|3|40"
          "askel-porras|footsteps stone stairs|3|40"
          "nappula|wooden game piece|0.1|1.5"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freesound
          path: /tmp/fs/
