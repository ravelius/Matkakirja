# Kertaluonteinen Freesound-haku (Pelikoodari 8.10.2026, Olavinlinnan aanet-fp-v2). Vain tämän haaran pushista; ei mergetä.
name: Freesound-haku (Pelikoodari)
on:
  push:
    branches: [pelikoodari-freesound-haku]
permissions:
  contents: read
jobs:
  hae:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - env:
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API }}
        run: >
          node tools/aanet/freesound-haku.mjs /tmp/fs
          "vihje|soft sparkle chime|0.3|3"
          "vihje|magic twinkle|0.3|3"
          "vihje|glass chime soft|0.3|3"
          "askel-markakivi|footsteps wet stone|5|90"
          "askel-markapuu|footsteps wet wood|5|90"
          "askel-markapuu|footsteps wooden dock rain|5|90"
          "askel-markakivi|footsteps puddle|5|90"
          "askel-markakivi|walking rain wet|5|90"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freesound
          path: /tmp/fs/
