# Kertaluonteinen Freesound-haku (Pelikoodari 8.10.2026, Olavinlinnan aanet-fp-v2; 9.10. elävän kaupungin äänet (PT, juna 170)). Vain tämän haaran pushista; ei mergetä.
name: Freesound-haku (Pelikoodari)
on:
  push:
    branches: [pelikoodari-freesound-haku]
permissions:
  contents: read
jobs:
  hae:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - env:
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API }}
        run: >
          node tools/aanet/freesound-haku.mjs /tmp/fs
          "hoyrylaiva|steamboat engine chugging|5|120|by"
          "hoyrylaiva|steam ship engine|5|120|by"
          "hoyrylaiva|paddle steamer|5|120|by"
          "lautta|ferry engine passing|5|120|by"
          "lautta|ferry departure harbour|5|120|by"
          "moottorivene|motorboat passing distance|5|90|by"
          "moottorivene|small boat outboard pass by|5|90|by"
          "lentokone|distant airplane flyover|5|90|by"
          "lentokone|airliner high altitude|5|90|by"
          "lentokone|plane passing far sky|5|90|by"
          "lokit|seagulls flock harbour|5|90|by"
          "lokit|seagulls calling|5|90|by"
          "kyyhkyt|pigeons wings flutter|0.5|15|by"
          "kyyhkyt|pigeons flock take off|0.5|15|by"
          "kyyhkyt|dove wings flapping|0.5|15|by"
          "sade|light rain on roof tiles|10|180|by"
          "ukkonen|distant thunder rumble|5|60|by"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freesound
          path: /tmp/fs/
