# Kertaluonteinen Freesound-haku (Pelikoodari 8.10.2026, Olavinlinnan aanet-fp-v2). Vain tämän haaran pushista; ei mergetä.
name: Freesound-haku (Pelikoodari)
on:
  push:
    branches: [pelikoodari-freesound-haku]
permissions:
  contents: read
jobs:
  hae:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - env:
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API }}
        run: >
          node tools/aanet/freesound-haku.mjs /tmp/fs
          "pilli|steam whistle ship|2|20|by"
          "pilli|ship horn steam|2|20|by"
          "kellot-tukholma|stockholm church bells|15|120|by"
          "kellot-pariisi|paris church bells|15|120|by"
          "kellot|church bells city|15|120|by"
          "humina-tukholma|stockholm city ambience|30|150|by"
          "humina-pariisi|paris city ambience|30|150|by"
          "humina|distant city hum|30|150|by"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freesound
          path: /tmp/fs/
