# Kertakäyttöinen vienti: lataa julisteet/-kansion R2-ämpärin
# julisteet/-kansioon. Ajetaan workflow_dispatchilla tältä haaralta;
# haara poistetaan viennin jälkeen. Secretit ovat repo-secreteinä
# (samat kuin peilaa.yml käyttää).
name: Vie julisteet R2:een

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vie:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_supported
    steps:
      - uses: actions/checkout@v4
      - name: Vie ämpäriin
        run: |
          set -euo pipefail
          aws s3 sync julisteet "s3://${{ secrets.R2_BUCKET }}/julisteet" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --content-type image/png --no-progress
          echo "Viety $(ls julisteet | wc -l) julistetta."
