# Generoi ElevenLabs-luennat suoraan secretistä — avainta ei liikutella
# chatissa eikä koneelta toiselle (omistajan linjaus 28.8.2026, Raamattu
# → "Äänet ja luennat": ELEVEN-AVAIN ON GITHUB-SECRETISSA).
#
# Ajo on KÄSIAJETTAVA (workflow_dispatch): luenta on sanasta sanaan
# sidottu pelidataan, joten se generoidaan vasta kun teksti on mainissa
# — automaattinen ajo joka pushista polttaisi rahaa ja voisi äänittää
# keskeneräisen tekstin.
#
# KAKSI TYÖKALUA, SAMA RESEPTI (Viisas Kertoja, eleven_v3):
#   tools/generoi-avaus.mjs    etusivun ja avauslennon luennat
#                              (intro-puhe.mp3, puhe-lento-alku.mp3);
#                              vaatii mpg123-decoder + lamejs
#                              (hännän hiljaisuusmittaus + paddaus).
#   tools/generoi-luennat.mjs  kaupunkien matkakirjaluennat.
#   tools/kohdista-luennat.mjs AIKALEIMAT valmiille matkakirjaluennalle
#                              (ei generoi ääntä; toiminto: kohdista).
#
# SIDONTA EI ÄÄNITÄ EIKÄ KOHDISTA. `toiminto: sido` lukee repossa jo
# olevan aikaleimatiedoston, hakee äänitteen ja kirjoittaa sen version 2
# kentät tuoreina (teksti ja äänite sidottuina SHA-256:een), minkä
# jälkeen tiedosto viedään ämpäriin. ElevenLabsia ei kutsuta kertaakaan,
# joten ajo on ilmainen — sillä saa vanhan kohdistuksen kelpaamaan
# pelille ilman uutta kohdistusajoa.
#
# KOHDISTUS EI ÄÄNITÄ MITÄÄN. `toiminto: kohdista` hakee olemassa
# olevalle mp3:lle sanakohtaiset aikaleimat ElevenLabsin pakotetulla
# kohdistuksella (POST /v1/forced-alignment) ja kirjoittaa tiedoston
# assets/aikaleimat/puhe-fokus-matkakirja-<id>.aikaleimat.json. Peli
# tarvitsee sen, jotta pulu voi reagoida luennan SISÄLLÄ oikeassa
# sanassa (js/luentareaktiot.js; Raamattu PULU REAGOI TEKSTIN SISALLA).
# Tiedosto viedään kuitin määräämään versionoituun sisaravaimeen heti
# työkalusta oikealla sisältötyypillä (application/json). Repokopio jää
# ajon tarkastusartefaktiin; workflow ei committoi eikä pushaa haaraa.
#
# Generoinnin syöte on kaupunkiavainlista. Kohdistuksen syöte on julkinen
# valmis tuotantokuitti, joka määrää kaupungit ja muuttumattomat MP3-avaimet.
# Työkalu tarkistaa silti lähteen itse — kutsujan ei siis tarvitse tietää,
# kummasta pakasta merkintä tulee:
#   FOKUSVIRTA (js/packs/fokusvirta-<id>.js) VOITTAA, jos kaupungilla
#     on fokusvirta → assets/audio/puhe-fokus-matkakirja-<id>.mp3.
#     Sama sääntö kuin pelissä: fokusvirtakaupungin matkakirjakortin
#     omistaa virta, joten vanhan saapumisluennan generointi olisi
#     rahaa tiedostoon, jota kukaan ei kuule.
#   SAAPUMISET (js/packs/<lauta>-saapumiset.js) muille
#     → assets/audio/puhe-<lauta>-saapuminen-<id>.mp3.
#
# MITÄ AJO TEKISI, ILMAN APIA: ELEVEN_KUIVA=1 node tools/
# generoi-luennat.mjs madrid venetsia — tulostaa kaupungin, lähteen,
# kohdetiedoston ja tekstin pituuden sekä huomauttaa, jos fokusvirran
# `aanite`-kenttä ja työkalun kohdetiedosto eivät täsmää. Avainta ei
# tarvita. Kannattaa ajaa ennen oikeaa ajoa, kun kaupunkilista on uusi.
#
# MP3:T MENEVÄT VERSIONOITUIHIN ÄMPÄRIAVAIMIIN, EIVÄT REPOON (omistajan linjaus
# 11.9.2026: *"repossa ei saa olla äänitiedostoja, kaikki vain
# ämpärissä"*). Ajo äänittää, vie tuotoksen versionoituihin `audio/`-avaimiin ja
# liittää samat tiedostot ajon artefaktiksi — luennat KUUNNELLAAN siitä
# artefaktista (generoi-avaus.mjs:n oma sääntö "Kuuntele molemmat ennen
# julkaisua"), ei PR:stä. Aikaleimat jäävät vastaavasti ajon artefaktiin.
#
# KUUNTELUSÄÄNTÖ. UUSI äänite ei kuulu pelissä ennen kuin pelidata
# viittaa siihen (fokusvirran `aanite`-kenttä tai saapumisen luenta),
# joten sen voi viedä huoletta ja kuunnella rauhassa. SAMANNIMISEN
# luennan uusinta sen sijaan korvaa ämpärin tiedoston heti ja kuuluu
# pelaajille — siksi uusinnat tehdään harkiten, ja niiden yhteydessä
# nostetaan js/media.js UUSITUT_AANET -kyselyversio samassa PR:ssä,
# jossa pelidata muuttuu (muuten selaimen, reunan ja service workerin
# välimuistit soittavat vanhaa luentaa viikkoja).
#
# Salaisuus on tämän repon Actions-asetuksissa: ELEVEN_API_KEY.
# Avain ei koskaan tulostu lokiin (työkalut eivät tulosta sitä, eikä
# tämä ajo echoa sitä) — GitHub peittää secretit lokista joka
# tapauksessa, mutta siihen ei nojata.

name: Generoi luennat

on:
  workflow_dispatch:
    inputs:
      kaupungit:
        description: >-
          Kaupunkien avaimet välilyönnein TAI pilkuin (esim. "madrid wien
          pariisi" tai "madrid,wien,pariisi" — työkalu erottelee
          kummallakin). Fokusvirtakaupunki saa matkakirjaluennan, muut
          saapumisluennan. Tyhjä = ei kaupunkiluentoja.
        required: false
        default: ''
      avaus:
        description: Generoi myös etusivun ja avauslennon luennat
        type: boolean
        default: false
      toiminto:
        description: >-
          "generoi" (oletus) äänittää yllä annetut kaupungit.
          "kohdista" EI ÄÄNITÄ: se hakee valmiille matkakirjaluennoille
          sanakohtaiset aikaleimat (pulun luentareaktiot) ja vie ne
          ämpäriin. "sido" EI ÄÄNITÄ EIKÄ KOHDISTA: se sitoo olemassa
          olevat aikaleimat äänitteen SHA-256:een (tiedostomuoto versio
          2) ja vie ne ämpäriin. Kaupungit annetaan kummassakin
          tapauksessa kentässä "kaupungit".
        type: choice
        options: [generoi, kohdista, sido]
        default: generoi
      kuitti:
        description: >-
          Vain kohdista-toiminnolle: versionoidun valmiin Horatio-tuotantokuitin
          julkinen HTTPS-osoite. Kuitti määrää kaupungit ja MP3-avaimet.
        required: false
        default: ''
      kaaret:
        description: >-
          Tarinakaarien luennat (tools/generoi-kaari.mjs --mykistetyt):
          kaupunkien avaimet välilyönnein, joiden mykistetyt-kenttien
          osat generoidaan (esim. "lontoo dubrovnik odessa"). Tyhjä = ei
          kaariluentoja. Mykistys puretaan käsin ajon jälkeen.
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: generoi-luennat
  cancel-in-progress: false

jobs:
  generoi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Asenna kaupunkiluennan mittaustyökalu
        if: ${{ inputs.kaupungit != '' && inputs.toiminto == 'generoi' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffprobe -version | head -1

      - name: Tarkista että avain on tallessa
        env:
          AVAIN: ${{ secrets.ELEVEN_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$AVAIN" ]; then
            echo "::error::ELEVEN_API_KEY-salaisuutta ei löydy tästä reposta."
            echo "Lisää se: Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Avain löytyy."

      - name: Tarkista että jotain on tilattu
        if: ${{ inputs.toiminto == 'generoi' && inputs.kaupungit == '' && inputs.avaus == false && inputs.kaaret == '' }}
        run: |
          echo "::error::Ei mitään generoitavaa — anna kaupungit ja/tai avaus."
          exit 1

      - name: Tarkista kohdistuksen kuitti
        if: ${{ inputs.toiminto == 'kohdista' && inputs.kuitti == '' }}
        run: |
          echo "::error::Kohdistus vaatii valmiin Horatio-tuotantokuitin HTTPS-osoitteen."
          exit 1

      # R2-portti ennen forced-alignment-kutsuja: valmista maksullista
      # kohdistusta ei saa tehdä, jos sen versionoitua tulosta ei voi tallentaa.
      - name: Tarkista kohdistuksen tallennusavaimet
        if: ${{ inputs.toiminto == 'kohdista' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          puuttuu=""
          [ -n "${R2_ACCOUNT_ID:-}" ]         || puuttuu="$puuttuu R2_ACCOUNT_ID"
          [ -n "${AWS_ACCESS_KEY_ID:-}" ]     || puuttuu="$puuttuu R2_ACCESS_KEY_ID"
          [ -n "${AWS_SECRET_ACCESS_KEY:-}" ] || puuttuu="$puuttuu R2_SECRET_ACCESS_KEY"
          [ -n "${R2_BUCKET:-}" ]             || puuttuu="$puuttuu R2_BUCKET"
          if [ -n "$puuttuu" ]; then
            echo "::error::Kohdistuksen versionoitu R2-vienti puuttuu:$puuttuu"
            exit 1
          fi

      # Vain avaus-työkalu tarvitsee paketteja (hännän mittaus +
      # hiljaisuuspaddaus). Asennus ilman package.json-muutosta:
      # --no-save, jotta työhakemisto pysyy puhtaana committia varten.
      - name: Asenna avaustyökalun paketit
        if: ${{ inputs.avaus == true }}
        run: npm install --no-save --no-audit --no-fund mpg123-decoder lamejs

      - name: Generoi avausluennat
        if: ${{ inputs.avaus == true }}
        env:
          ELEVEN_API_KEY: ${{ secrets.ELEVEN_API_KEY }}
          # RAAKAVIENTI tarvitsee R2:n jo generointivaiheessa (omistajan
          # sääntö 14.9.2026): mallin tuotos menee ämpäriin ennen mitään
          # käsittelyä, joten salaisuudet eivät voi enää olla vain
          # myöhemmän vientiaskeleen ympäristössä.
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_supported
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: node tools/generoi-avaus.mjs

      - name: Varaa muuttumaton Horatio-erä ennen maksullista ajoa
        if: ${{ inputs.kaupungit != '' && inputs.toiminto == 'generoi' }}
        env:
          KAUPUNGIT: ${{ inputs.kaupungit }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          node tools/generoi-luennat.mjs --plan-only --kaupungit "$KAUPUNGIT"
          kuitti=assets/audio/luennat-tuotantokuitti.json
          era=$(node -e 'console.log(require("./assets/audio/luennat-tuotantokuitti.json").batch.id)')
          avain="audio/receipts/horatio/${era}.planned.json"
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          if aws s3api head-object --bucket "$R2_BUCKET" --key "$avain" --endpoint-url "$endpoint" >/dev/null 2>&1; then
            echo "::error::Erä $era on jo aloitettu; maksullista ajoa ei uusita."
            exit 1
          fi
          aws s3 cp "$kuitti" "s3://${R2_BUCKET}/${avain}" --endpoint-url "$endpoint" \
            --no-progress --content-type application/json --cache-control "public, max-age=2592000"

      - name: Generoi kaupunkiluennat
        if: ${{ inputs.kaupungit != '' && inputs.toiminto == 'generoi' }}
        env:
          ELEVEN_API_KEY: ${{ secrets.ELEVEN_API_KEY }}
          KAUPUNGIT: ${{ inputs.kaupungit }}
        run: node tools/generoi-luennat.mjs --kaupungit "$KAUPUNGIT"

      # Kuiva ajo ensin: väärä kaupunkiavain tai ankkuri, jota ei löydy
      # luentatekstistä, paljastuu ilman yhtäkään API-kutsua.
      - name: Tarkista kohdistus kuivana
        if: ${{ inputs.toiminto == 'kohdista' || inputs.toiminto == 'sido' }}
        env:
          KAUPUNGIT: ${{ inputs.kaupungit }}
          KUITTI: ${{ inputs.kuitti }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.toiminto }}" = kohdista ]; then
            case "$KUITTI" in https://media.matkakirja.app/audio/receipts/horatio/*.completed.json) ;; *)
              echo "::error::Kuitti ei ole Matkakirjan valmistunut Horatio-tuotantokuitti."
              exit 1
            esac
            node tools/kohdista-luennat.mjs --kuiva --kuitti "$KUITTI"
          else
            node tools/kohdista-luennat.mjs --kuiva --kaupungit "$KAUPUNGIT"
          fi

      - name: Kohdista aikaleimat ja vie ämpäriin
        if: ${{ inputs.toiminto == 'kohdista' }}
        env:
          ELEVEN_API_KEY: ${{ secrets.ELEVEN_API_KEY }}
          KUITTI: ${{ inputs.kuitti }}
          # Samat nimet ja sama endpoint-tyyli kuin muissakin
          # ääniajoissa (generoi-tehosteet.yml, generoi-pulu.yml).
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_supported
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: node tools/kohdista-luennat.mjs --vie --kuitti "$KUITTI"

      # Sidonta ei kutsu ElevenLabsia, joten avainta ei anneta — mutta
      # R2-tunnukset ovat samat kuin kohdistuksella: tiedosto viedään
      # ämpäriin oikealla sisältötyypillä samasta työkalusta.
      - name: Sido aikaleimat äänitteeseen ja vie ämpäriin
        if: ${{ inputs.toiminto == 'sido' }}
        env:
          KAUPUNGIT: ${{ inputs.kaupungit }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_supported
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: node tools/kohdista-luennat.mjs --sido --vie --kaupungit "$KAUPUNGIT"

      - name: Generoi kaariluennat
        if: ${{ inputs.kaaret != '' }}
        env:
          ELEVEN_API_KEY: ${{ secrets.ELEVEN_API_KEY }}
          # RAAKAVIENTI tarvitsee R2:n jo generointivaiheessa (omistajan
          # sääntö 14.9.2026): mallin tuotos menee ämpäriin ennen mitään
          # käsittelyä, joten salaisuudet eivät voi enää olla vain
          # myöhemmän vientiaskeleen ympäristössä.
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_supported
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: node tools/generoi-kaari.mjs --mykistetyt ${{ inputs.kaaret }}

      # Kuuntelukopio ajon liitteenä. Tämä on ENNEN vientiä: jos vienti
      # kaatuu, luennat ovat silti kuunneltavissa eikä kallista
# äänitystä tarvitse toistaa. Generointiajo ei koskaan ylikirjoita
# live-avainta `audio/puhe-fokus-...`: staging- ja final-avaimet tulevat
# tuotantokuitista, ja julkaisu live-avaimeen on erillinen hyväksytty vaihe.
      - name: Liitä luennat ajoon kuuntelua varten
        if: ${{ always() && inputs.toiminto == 'generoi' }}
        uses: actions/upload-artifact@v4
        with:
          name: luennat-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            assets/audio/*.mp3
            assets/audio/luennat-tuotantokuitti.json
          retention-days: 14
          if-no-files-found: warn

      - name: Vie luennat versionoituihin staging- ja final-avaimiin
        if: ${{ inputs.toiminto == 'generoi' }}
        env:
          # Samat nimet ja sama endpoint-tyyli kuin muissakin
          # ääniajoissa (generoi-tehosteet.yml, generoi-pulu.yml).
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 ei hyväksy AWS:n uudempia tarkistussummaotsakkeita, jotka
          # aws-cli 2.23:sta alkaen lähtevät oletuksena mukaan.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_supported
        run: |
          set -euo pipefail
          kuitti=assets/audio/luennat-tuotantokuitti.json
          if [ ! -f "$kuitti" ]; then
            echo "::error::Tuotantokuitti puuttuu — mitään ei viedä."
            exit 1
          fi
          node -e '
            const k=require("./assets/audio/luennat-tuotantokuitti.json");
            for(const r of k.cities){
              if(r.generation.status!=="success")continue;
              // RAAKAVIENTI ON PAKOLLINEN (omistaja 14.9.2026, Raamattu:
              // ALKUPERÄISET ÄÄNITIEDOSTOT SÄILYTETÄÄN AINA). Ilman
              // raaka-avainta ja sen sha256:ta ajo ei vie mitään.
              if(!r.objectKeys?.raw||!r.rawAudio?.sha256)process.exit(3);
              if(!r.objectKeys?.staging||!r.objectKeys?.final||r.objectKeys.live!==null)process.exit(2);
              console.log([r.outputPath,r.objectKeys.raw,r.objectKeys.staging,r.objectKeys.final].join("\t"));
            }
          ' > /tmp/horatio-vienti.tsv || {
            echo "::error::Kuitista puuttuu raaka-avain tai sen sha256 — alkuperäinen katoaisi, joten mitään ei viedä."
            exit 1
          }
          test -s /tmp/horatio-vienti.tsv || { echo "::error::Kuitissa ei ole onnistuneita luentoja."; exit 1; }
          while IFS=$'\t' read -r paikallinen raaka staging final; do
            # RAAKA ENSIN: alkuperäinen tavujono omaan eräkohtaiseen
            # avaimeensa ennen kuin mitään muuta kirjoitetaan.
            aws s3 cp "$paikallinen" "s3://${{ secrets.R2_BUCKET }}/$raaka" \
              --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
              --no-progress --content-type audio/mpeg \
              --cache-control "public, max-age=2592000"
            # Ei koskaan kirjoiteta live-avaimeen audio/puhe-fokus-... .
            aws s3 cp "$paikallinen" "s3://${{ secrets.R2_BUCKET }}/$staging" \
              --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
              --no-progress --content-type audio/mpeg \
              --cache-control "public, max-age=2592000"
            aws s3 cp "$paikallinen" "s3://${{ secrets.R2_BUCKET }}/$final" \
              --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
              --no-progress --content-type audio/mpeg \
              --cache-control "public, max-age=2592000"
          done < /tmp/horatio-vienti.tsv
          era=$(node -e 'console.log(require("./assets/audio/luennat-tuotantokuitti.json").batch.id)')
          aws s3 cp "$kuitti" "s3://${{ secrets.R2_BUCKET }}/audio/receipts/horatio/${era}.completed.json" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --no-progress --content-type application/json \
            --cache-control "public, max-age=2592000"
          echo "Valmis. Luennat ovat versionoiduissa staging/final-avaimissa ja ajon artefaktissa; live-avainta ei muutettu."

      # Versionoidut JSON-tiedostot ovat jo R2:ssa MP3:n sisaravaimissa.
      # Repokopio annetaan tarkastettavaksi artefaktina; workflow ei kirjoita
      # haaraa eikä tee automaattista julkaisupäätöstä.
      - name: Tallenna aikaleimat tarkastettavaksi
        if: ${{ inputs.toiminto == 'kohdista' || inputs.toiminto == 'sido' }}
        uses: actions/upload-artifact@v4
        with:
          name: horatio-aikaleimat-${{ github.run_id }}
          path: assets/aikaleimat/puhe-fokus-matkakirja-*.aikaleimat.json
          retention-days: 14
          if-no-files-found: error
