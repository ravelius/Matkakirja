name: Vie hyväksytyt 16 kohtaamiskuvaa R2:een 2026-09-02

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vie-hyvaksytyt-16-kohtaamiskuvaa-2026-09-02.yml'

permissions:
  contents: read

concurrency:
  group: vie-hyvaksytyt-16-kohtaamiskuvaa-2026-09-02
  cancel-in-progress: false

jobs:
  vie:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_supported
      DRIVE_AVAIN: ${{ secrets.SAMIREIVINEN_DRIVE_API }}
      R2_TILI: ${{ secrets.R2_ACCOUNT_ID }}
      R2_AMPARI: ${{ secrets.R2_BUCKET }}
      JULKINEN: https://pub-7bc0ed2083a74a68bd7115618bca4709.r2.dev

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tarkista yhteydet
        run: |
          set -euo pipefail
          puuttuu=""
          [ -n "$DRIVE_AVAIN" ] || puuttuu="$puuttuu SAMIREIVINEN_DRIVE_API"
          [ -n "$R2_TILI" ] || puuttuu="$puuttuu R2_ACCOUNT_ID"
          [ -n "${AWS_ACCESS_KEY_ID:-}" ] || puuttuu="$puuttuu R2_ACCESS_KEY_ID"
          [ -n "${AWS_SECRET_ACCESS_KEY:-}" ] || puuttuu="$puuttuu R2_SECRET_ACCESS_KEY"
          [ -n "$R2_AMPARI" ] || puuttuu="$puuttuu R2_BUCKET"
          if [ -n "$puuttuu" ]; then
            echo "::error::Puuttuvat repository secretit:$puuttuu"
            exit 1
          fi

      - name: Nouda Drivestä ja tarkista hyväksytyt JPEG-kuvat
        run: |
          set -euo pipefail
          node --input-type=module <<'SKRIPTI'
          import { mkdir, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { dirname } from 'node:path';

          const kuvat = [
            ['1Mkw3P9Mn1LHpcAWtPnPnC0ACQBBGpEsf', 'kasvo-amsterdam-koysityontekija.jpg', 'd584315489eb82d9e409c66f5a1137dc009f35b99e53931f42f7dd0d77b3c652'],
            ['1vC1AWm_IkYTIzsjdiW_FLUWrRan8XcuJ', 'kasvo-amsterdam-pyorailija-aamu.jpg', 'bb1d803dcb54350e99a6d1639cb6580eb959f15a20f95f4471b00947529c00d8'],
            ['1iwUvJ_se9Hlz0_FmcbxxkaaEo1Km03y7', 'kasvo-barcelona-merce-konfetti.jpg', 'cf9c5e0603769ae4e6a5122cad0dc26ad76f533a5f8d6c717e420a4d96cfbee4'],
            ['1QYcFxZRwnKj9jhAyZKnP2HIXW9HFNprL', 'kasvo-berliini-lotte-auto.jpg', 'd093fa74239ca89ffe14f2f851d8d918944765e53746c1bc490d6bc810ad2dee'],
            ['1-uvHsP9K8Rj6f9AFIOcQSK7XAqBqEH21', 'kasvo-budapest-aiti-tytar-smoothie.jpg', '86b2569adbabc2fc7605e061970c08448ca0964b647980b9dc6b83234f5c5230'],
            ['1ZnYv3ozVveEFikRhi8FzgRzuezXK0_b-', 'kasvo-budapest-marta-kylpyla-a.jpg', '9b550a161c89aa5faad8c2c75d0f249cacda3c81627ce8aa0b67d00bad02bc09'],
            ['14lsxVVdgTamxQBvpXCL5Akv6hmTLQf67', 'kasvo-istanbul-emine-riipunta-a.jpg', 'ec7dcb9736f53dfb85f7c108bc283ca09a7e452d1c3d366299d06684f490b8c4'],
            ['1VToV2FaRgw-iMx_f6C2AICQVxV_BKBpX', 'kasvo-krakova-stanislaw-trumpetti.jpg', '1eda41015b5e5571505f667a8669d7cb5195727a720f044789aa096bac7d6b3f'],
            ['1MigJNJDGE9gVkJvMqGuB6oabSciKvFWb', 'kasvo-la-paz-killi-killi.jpg', 'db4006d42b9ff67ae91fe8902622a97d0c7d979ae075ccdf63abb77a42cd1717'],
            ['1gH_wFwDGvBHyjb_ruX1kMkTJ31NFzYpy', 'kasvo-lissabon-ines-laattapaja.jpg', 'af0a12489e9d06cf85da6c0331a1d2c542fdd715495686c271cec07730c52478'],
            ['1C_Ard1LSVmCw8PBq1RuCq-8lSUVKkVJt', 'kasvo-madrid-pilar-puerta-del-sol.jpg', '1d8702137a4c36151413173cabeadb5aa514216f164e2ce095e23b088c1568e7'],
            ['1tbSZOcjUWwLyIWrqcW8zpzLSy2dydY70', 'kasvo-palermo-marionettipari.jpg', '6c8a6c6b3dcca8e2f7e3bb09d6c991809fdf25ad1398eb5adeb53f51bd7febee'],
            ['1Zcado6Gv6Yz_JF5Zi8vflCiqvQPkJVA4', 'kasvo-pariisi-kirjamyyjat-pulu.jpg', '061ecc996b5536a4da61541b233d8b9a4468de68d218bf253b10ad0763604cc8'],
            ['1zt-R9X0SfwRuE9aZ-0-38PhmQmDfeFh4', 'kasvo-tukholma-astrid-maailmanpyora-c.jpg', 'effdcaebe6c4d7f2c06e94489161c4f76ebdaaa7a27d5a46cf59e838000e05cc'],
            ['1NkieP_g0CopNj31nGTOKiRYDGPMVNFKe', 'kasvo-venetsia-lucia-naamio-vene.jpg', '04307d820721e76bd80747d7d730261da1321c304e0b0ff50ed62f8f47c6a640'],
            ['19zkNZkjecV-XTolLOnj75EhRUjUVhcJn', 'kasvo-vilna-rasa-myrskytorni.jpg', 'f2b86f6f1de619f91483784b706ac23bb53902b43c5a6826948ebf4d80c39b7f'],
          ];

          function jpegMitat(data) {
            if (data[0] !== 0xff || data[1] !== 0xd8) throw new Error('ei ole JPEG');
            let i = 2;
            while (i + 9 < data.length) {
              if (data[i] !== 0xff) { i += 1; continue; }
              const merkki = data[i + 1];
              if (merkki === 0xd8 || merkki === 0xd9) { i += 2; continue; }
              const pituus = data.readUInt16BE(i + 2);
              if (pituus < 2 || i + 2 + pituus > data.length) break;
              if ([0xc0, 0xc1, 0xc2, 0xc3, 0xc5, 0xc6, 0xc7, 0xc9, 0xca, 0xcb, 0xcd, 0xce, 0xcf].includes(merkki)) {
                return { korkeus: data.readUInt16BE(i + 5), leveys: data.readUInt16BE(i + 7) };
              }
              i += 2 + pituus;
            }
            throw new Error('JPEG-mittoja ei löytynyt');
          }

          for (const [id, polku, odotettuSha] of kuvat) {
            const driveUrl = `https://www.googleapis.com/drive/v3/files/${id}?alt=media&key=${process.env.DRIVE_AVAIN}`;
            const driveVastaus = await fetch(driveUrl);
            if (!driveVastaus.ok) throw new Error(`${polku}: Drive HTTP ${driveVastaus.status}`);
            const data = Buffer.from(await driveVastaus.arrayBuffer());
            const sha = createHash('sha256').update(data).digest('hex');
            if (sha !== odotettuSha) throw new Error(`${polku}: SHA-256 ei täsmää`);
            const mitat = jpegMitat(data);
            if (mitat.leveys !== 1536 || mitat.korkeus !== 1536) {
              throw new Error(`${polku}: ${mitat.leveys}x${mitat.korkeus}, odotettiin 1536x1536`);
            }
            if (!data.includes(Buffer.from('ICC_PROFILE'))) throw new Error(`${polku}: ICC-profiili puuttuu`);

            const julkinen = `${process.env.JULKINEN}/kohtaamiset/${polku}?t=${Date.now()}`;
            const vanha = await fetch(julkinen, { headers: { 'Cache-Control': 'no-cache' } });
            if (vanha.ok) {
              const vanhaData = Buffer.from(await vanha.arrayBuffer());
              const vanhaSha = createHash('sha256').update(vanhaData).digest('hex');
              if (vanhaSha !== odotettuSha) throw new Error(`${polku}: nimiristiriita, R2:ssa eri sisältö`);
              console.log(`${polku}: sama hyväksytty versio oli jo R2:ssa`);
            } else if (vanha.status !== 404) {
              throw new Error(`${polku}: R2-esitarkistus HTTP ${vanha.status}`);
            }

            const kohde = `r2-out/${polku}`;
            await mkdir(dirname(kohde), { recursive: true });
            await writeFile(kohde, data);
            console.log(`${polku}: Drive, JPEG, 1536x1536, ICC ja SHA-256 kunnossa`);
          }
          SKRIPTI

      - name: Vie kuvat R2-mediämpäriin
        run: |
          set -euo pipefail
          aws s3 sync r2-out "s3://$R2_AMPARI/kohtaamiset" \
            --endpoint-url "https://$R2_TILI.r2.cloudflarestorage.com" \
            --no-progress --size-only --content-type image/jpeg \
            --cache-control "public, max-age=2592000"

      - name: Varmista julkinen R2 tavutasolla
        run: |
          set -euo pipefail
          node --input-type=module <<'SKRIPTI'
          import { readFile, readdir } from 'node:fs/promises';
          import { createHash } from 'node:crypto';

          const polut = (await readdir('r2-out')).sort();
          if (polut.length !== 16) throw new Error(`tiedostoja ${polut.length}, odotettiin 16`);
          for (const avain of polut) {
            const paikallinen = await readFile(`r2-out/${avain}`);
            let vastaus;
            for (let yritys = 1; yritys <= 10; yritys += 1) {
              vastaus = await fetch(`${process.env.JULKINEN}/kohtaamiset/${avain}?t=${Date.now()}`, {
                headers: { Origin: 'https://ravelius.github.io', 'Cache-Control': 'no-cache' },
              });
              if (vastaus.ok) break;
              await new Promise((resolve) => setTimeout(resolve, 2000));
            }
            if (!vastaus?.ok) throw new Error(`${avain}: R2 HTTP ${vastaus?.status}`);
            const tyyppi = vastaus.headers.get('content-type') ?? '';
            if (!tyyppi.startsWith('image/jpeg')) throw new Error(`${avain}: R2 MIME ${tyyppi}`);
            if (!vastaus.headers.get('access-control-allow-origin')) throw new Error(`${avain}: CORS puuttuu`);
            const ladattu = Buffer.from(await vastaus.arrayBuffer());
            const paikallinenSha = createHash('sha256').update(paikallinen).digest('hex');
            const ladattuSha = createHash('sha256').update(ladattu).digest('hex');
            if (ladattuSha !== paikallinenSha) throw new Error(`${avain}: takaisinluettu SHA-256 ei täsmää`);
            console.log(`${avain}: julkinen JPEG, CORS ja tavut kunnossa`);
          }
          SKRIPTI
