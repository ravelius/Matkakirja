# Julkaisee Viisas Pöllö -välityspalvelimen Cloudflaren Workersiin.
#
# Omistaja tekee kaiken puhelimella, joten komentorivipolku (npx
# wrangler login → deploy → secret put → kv namespace create) ei ole
# käytettävissä. Tämä työnkulku tekee samat vaiheet ajurilla: luo
# tarvittaessa KV-säilön, rakentaa täytetyn asetustiedoston, julkaisee
# workerin ja asettaa API-avaimen salaisuudeksi.
#
# TÄMÄ AJO NUKKUU, KUNNES SALAISUUDET ON ASETETTU. Ensimmäinen työ
# (ubuntu, halpa) katsoo, ovatko CLOUDFLARE_API_TOKEN,
# CLOUDFLARE_ACCOUNT_ID ja ANTHROPIC_API_KEY olemassa. Jos eivät, ajo
# jää vihreäksi ja yhteenvedossa lukee mitä puuttuu. Ohje avainten
# hakemiseen: tools/pollo/OHJE.md.
#
# Salaisuuksien arvoja ei tulosteta missään vaiheessa: API-avain menee
# wranglerille putkessa (printf | wrangler secret put), ei komennon
# argumenttina eikä tiedostona.
#
# Repossa oleva tools/pollo/wrangler.jsonc jätetään rauhaan (se on
# komentorivipolun ohjeen mukainen). KV-tunnus ja sallittu origin
# lisätään vasta ajon aikana väliaikaiseen kopioon — ks.
# tools/pollo/ci-asetus.mjs.

name: Pöllön julkaisu

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'tools/pollo/**'
      # Ohjeen korjaus ei ole syy julkaista workeria uudelleen.
      - '!tools/pollo/**/*.md'
      - '.github/workflows/pollo-julkaisu.yml'

permissions:
  contents: read

# Yksi julkaisu kerrallaan. Keskeneräistä ei katkaista: puoliksi
# julkaistu worker on ikävämpi selvitettävä kuin odottaminen.
concurrency:
  group: pollo-julkaisu
  cancel-in-progress: false

env:
  # Mistä peli tulee. Worker vertaa tätä pyynnön Origin-otsakkeeseen,
  # joka on aina pelkkä alkuosa ILMAN polkua: pelin sivu on
  # https://ravelius.github.io/Matkakirja/ mutta Origin on
  # https://ravelius.github.io. Useampi arvo erotetaan pilkulla.
  POLLO_ORIGINIT: 'https://ravelius.github.io'
  # Wrangler TÄSMÄVERSIOON lukittuna (28.8.2026): pelkkä suurversio
  # ei riittänyt — 27.8. alkaen jokainen ajo kaatui Cloudflaren
  # virheeseen "Authentication error [code: 10000]" heti kv namespace
  # list -kutsussa, vaikka repo, token ja tili olivat samat kuin
  # 25.8. onnistuneessa ajossa (wrangler 4.125.0). Uusi tokenkaan ei
  # auttanut, joten vika on wranglerin tuoreemmassa 4.x-julkaisussa.
  # Versiota saa nostaa, kun uudempi todetaan käsiajolla toimivaksi.
  WRANGLER_VERSIO: 'wrangler@4.125.0'
  # Ei käyttötilastoja eikä interaktiivisia kysymyksiä ajurilla.
  WRANGLER_SEND_METRICS: 'false'
  CI: 'true'

jobs:
  # Halpa portti kalliin edessä. Salaisuuksien arvoja ei lueta eikä
  # tulosteta — katsotaan vain, onko kentässä jotakin. Tarkistus on
  # omana steppinään, koska secrets-kontekstia ei voi käyttää
  # job-tason if-ehdossa.
  portti:
    name: Onko julkaisu mahdollinen
    runs-on: ubuntu-latest
    outputs:
      salaisuudet: ${{ steps.tarkista.outputs.salaisuudet }}
    steps:
      - name: Tarkista salaisuudet
        id: tarkista
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          puuttuu=""
          for nimi in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ANTHROPIC_API_KEY; do
            arvo=$(printenv "$nimi" || true)
            if [ -z "$arvo" ]; then
              puuttuu="$puuttuu $nimi"
            fi
          done
          if [ -n "$puuttuu" ]; then
            echo "salaisuudet=ei" >> "$GITHUB_OUTPUT"
            {
              echo "## Pöllön julkaisu nukkuu"
              echo
              echo "Puuttuvat salaisuudet:$puuttuu"
              echo
              echo "Ne lisätään: Settings → Secrets and variables → Actions."
              echo "Askel askeleelta: \`tools/pollo/OHJE.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Pöllön julkaisu nukkuu::Salaisuuksia puuttuu:$puuttuu — ohje tools/pollo/OHJE.md"
          else
            echo "salaisuudet=on" >> "$GITHUB_OUTPUT"
          fi

  julkaisu:
    name: Julkaise worker
    needs: portti
    if: needs.portti.outputs.salaisuudet == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Wrangler asennetaan ajurin väliaikaiskansioon, ei repoon: repon
      # package.json kuuluu pelille eikä siihen haluta julkaisutyökalua
      # (eikä npm install repon juuressa vetäisi mukanaan Playwrightia).
      - name: Asenna wrangler
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wrangler"
          npm install --prefix "$RUNNER_TEMP/wrangler" --no-fund --no-audit "$WRANGLER_VERSIO"
          echo "WRANGLER=$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler" >> "$GITHUB_ENV"

      # KV-säilö on käyttörajojen laskurien muisti. Jos säilöä ei vielä
      # ole, se luodaan; olemassa olevaa ei kosketa, jotta laskurit
      # eivät nollaudu jokaisella julkaisulla.
      #
      # Komennot ajetaan repon ulkopuolella, jottei wrangler nappaa
      # käyttöönsä repon juuren wrangler.jsonc:tä (se kuuluu
      # uutisvälitykselle, ei pöllölle).
      - name: Etsi tai luo KV-säilö
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          apuri="$GITHUB_WORKSPACE/tools/pollo/ci-asetus.mjs"
          "$WRANGLER" kv namespace list > "$RUNNER_TEMP/kv-lista.json" 2> "$RUNNER_TEMP/kv-virhe.log" || {
            echo "::error title=KV-listaus epäonnistui::Tarkista, että CLOUDFLARE_API_TOKEN kelpaa Workers-oikeuksilla ja CLOUDFLARE_ACCOUNT_ID on oikein."
            cat "$RUNNER_TEMP/kv-virhe.log"
            exit 1
          }
          tunnus=$(node "$apuri" kv-tunnus "$RUNNER_TEMP/kv-lista.json")
          if [ -z "$tunnus" ]; then
            echo "POLLO_KV puuttuu — luodaan uusi säilö."
            "$WRANGLER" kv namespace create POLLO_KV
            "$WRANGLER" kv namespace list > "$RUNNER_TEMP/kv-lista.json"
            tunnus=$(node "$apuri" kv-tunnus "$RUNNER_TEMP/kv-lista.json")
          else
            echo "POLLO_KV löytyi valmiina."
          fi
          if [ -z "$tunnus" ]; then
            echo "::error title=KV-säilöä ei saatu::Säilön POLLO_KV tunnusta ei löytynyt listauksesta."
            exit 1
          fi
          # Tunnus ei ole salaisuus (se on julkinen sidoksen osoite),
          # mutta ei sitä silti tarvitse lokiin tulostaa.
          echo "KV_TUNNUS=$tunnus" >> "$GITHUB_ENV"

      # Lukijaäänen pysyvä säilö: R2-ämpäri, jossa generoidut äänet
      # asuvat lohkoittain (puhe/merkinnat/…, puhe/kertoja/…). Vaihe on
      # EI-KRIITTINEN: jos API-tunnukselta puuttuu R2-oikeus (vanha
      # "Edit Cloudflare Workers" -pohja ei sisällä sitä), ämpäri jää
      # pois ja worker pärjää reunavälimuistilla — julkaisu ei kaadu.
      # Oikeuden saa lisäämällä tunnukselle "Workers R2 Storage: Edit".
      - name: Etsi tai luo puheämpäri (jos oikeudet riittävät)
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          ampari="matkakirja-puhe"
          if "$WRANGLER" r2 bucket list > "$RUNNER_TEMP/r2-lista.txt" 2>/dev/null; then
            # Väljä täsmäys riittää: nimi on yksikäsitteinen. Luonnin
            # epäonnistuminen (esim. kilpaileva ajo ehti ensin) ei
            # pudota ämpäriä pois, jos se on listalla.
            if ! grep -q "$ampari" "$RUNNER_TEMP/r2-lista.txt"; then
              "$WRANGLER" r2 bucket create "$ampari" \
                || { echo "::notice title=Puheämpärin luonti epäonnistui::Lukijaääni toimii ilman pysyvää säilöä."; ampari=""; }
            fi
          else
            echo "::notice title=Puheämpäri ohitettu::API-tunnukselta puuttuu R2-oikeus — lukijaääni toimii ilman pysyvää säilöä."
            ampari=""
          fi
          echo "PUHE_AMPARI=$ampari" >> "$GITHUB_ENV"

      # Repon wrangler.jsonc pysyy ennallaan; tähän kirjoitetaan sen
      # täytetty kopio. Kopio menee samaan kansioon, jotta "main":
      # "worker.js" osoittaa yhä oikeaan tiedostoon.
      - name: Rakenna ajonaikainen asetus
        run: |
          set -euo pipefail
          node tools/pollo/ci-asetus.mjs asetus \
            --lahde tools/pollo/wrangler.jsonc \
            --ulos tools/pollo/wrangler.ci.json \
            --kv "$KV_TUNNUS" \
            --r2 "${PUHE_AMPARI:-}" \
            --originit "$POLLO_ORIGINIT"
          echo "POLLO_ASETUS=tools/pollo/wrangler.ci.json" >> "$GITHUB_ENV"

      - name: Julkaise worker
        run: |
          set -euo pipefail
          "$WRANGLER" deploy --config "$POLLO_ASETUS" 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          osoite=$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1 || true)
          if [ -n "$osoite" ]; then
            echo "POLLO_OSOITE=$osoite" >> "$GITHUB_ENV"
          else
            echo "::warning title=Osoitetta ei löytynyt::Julkaisu meni läpi, mutta workers.dev-osoitetta ei tunnistettu tulosteesta. Katso ajon loki."
          fi

      # Avain menee wranglerille putkessa: se ei näy komentorivillä, ei
      # ympäristölistauksessa eikä jää tiedostoksi ajurille. Wrangler ei
      # tulosta salaisuuden arvoa, ja GitHub peittää sen joka tapauksessa.
      # Tässä stepissä ei ole yhtään echoa avaimesta eikä set -x:ää.
      - name: Aseta API-avain workerin salaisuudeksi
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          set +x
          printf '%s' "$ANTHROPIC_API_KEY" | "$WRANGLER" secret put ANTHROPIC_API_KEY --config "$POLLO_ASETUS"

      # LUKIJAÄÄNEN AVAIN (omistajan päätös 14.8.2026): OpenAI:n
      # puhesynteesi (gpt-4o-mini-tts) tarvitsee oman avaimensa. Avain
      # on vapaaehtoinen: ilman sitä worker vastaa puhepyyntöihin
      # siistillä 503:lla ja peli lukee laitteen omalla äänellä — mikään
      # ei mene rikki. Avain kulkee putkessa kuten muutkin salaisuudet.
      - name: Aseta lukijaäänen avain workerin salaisuudeksi (jos on)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          set +x
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY ei ole asetettu — ohitetaan (lukijaääni jää pois)."
            exit 0
          fi
          printf '%s' "$OPENAI_API_KEY" | "$WRANGLER" secret put OPENAI_API_KEY --config "$POLLO_ASETUS"

      # TYÖHUONEEN TILANNEPALKKIEN AVAIMET (omistajan tilaus 15.8.2026):
      # vapaaehtoiset salaisuudet, joilla worker näkee ElevenLabsin
      # kuukausikiintiön ja OpenAI:n/Anthropicin/Googlen kulut
      # (tehtava:'tila').
      # HUOM: kulut vaativat ADMIN-avaimet — pöllön ja lukijaäänen
      # tavalliset avaimet eivät pääse kulurajapintoihin. Puuttuva avain
      # vain ohitetaan: vastaava palkki näyttää pelissä "ei nähtävissä".
      # Avaimet kulkevat putkessa kuten muutkin salaisuudet.
      #
      # GOOGLE ON POIKKEUS, ja siksi sillä on kolme asetusta yhden
      # sijaan: Googlella EI OLE rajapintaa, joka kertoisi kuluvan
      # kuukauden toteutuneet kulut. Cloud Billing antaa tilin ja
      # hinnaston, Budgets antaa budjetit — kumpikaan ei anna käyttöä.
      # Ainoa reitti toteutuneisiin lukuihin on laskutuksen
      # BigQuery-vienti, joten worker kyselee sitä taulua suoraan ja
      # tarvitsee siihen tokenin, projektin ja taulun nimen.
      # GOOGLE_BILLING_PROJECT ja _TAULU eivät ole salaisuuksia, mutta
      # ne kulkevat samaa reittiä, jotta asetuspaikkoja on vain yksi.
      - name: Aseta tilannepalkkien avaimet workerin salaisuuksiksi (jos on)
        env:
          ELEVEN_API_KEY: ${{ secrets.ELEVEN_API_KEY }}
          OPENAI_ADMIN_KEY: ${{ secrets.OPENAI_ADMIN_KEY }}
          ANTHROPIC_ADMIN_KEY: ${{ secrets.ANTHROPIC_ADMIN_KEY }}
          GOOGLE_BILLING_TOKEN: ${{ secrets.GOOGLE_BILLING_TOKEN }}
          GOOGLE_BILLING_PROJECT: ${{ secrets.GOOGLE_BILLING_PROJECT }}
          GOOGLE_BILLING_TAULU: ${{ secrets.GOOGLE_BILLING_TAULU }}
        run: |
          set -euo pipefail
          set +x
          for nimi in ELEVEN_API_KEY OPENAI_ADMIN_KEY ANTHROPIC_ADMIN_KEY \
                      GOOGLE_BILLING_TOKEN GOOGLE_BILLING_PROJECT \
                      GOOGLE_BILLING_TAULU; do
            arvo=$(eval "printf '%s' \"\${$nimi:-}\"")
            if [ -z "$arvo" ]; then
              echo "$nimi ei ole asetettu — ohitetaan (palkki näyttää 'ei nähtävissä')."
              continue
            fi
            printf '%s' "$arvo" | "$WRANGLER" secret put "$nimi" --config "$POLLO_ASETUS"
          done

      # KEHITTÄJÄKOODI on vapaaehtoinen: jos salaisuutta ei ole asetettu,
      # tämä vaihe ohitetaan eikä worker tunne koodia lainkaan — silloin
      # otsake X-Pollo-Kehittaja ei tee mitään. Koodi menee wranglerille
      # samalla tavalla kuin API-avain: putkessa, ei komentorivillä eikä
      # tiedostona, eikä sitä tulosteta missään vaiheessa.
      - name: Aseta kehittäjäkoodi workerin salaisuudeksi (jos on)
        env:
          POLLO_KEHITTAJAKOODI: ${{ secrets.POLLO_KEHITTAJAKOODI }}
        run: |
          set -euo pipefail
          set +x
          if [ -z "${POLLO_KEHITTAJAKOODI:-}" ]; then
            echo "POLLO_KEHITTAJAKOODI ei ole asetettu — ohitetaan."
            exit 0
          fi
          printf '%s' "$POLLO_KEHITTAJAKOODI" | "$WRANGLER" secret put POLLO_KEHITTAJAKOODI --config "$POLLO_ASETUS"

      - name: Kerro mitä julkaistiin
        if: success()
        run: |
          {
            echo "## Pöllö on julkaistu"
            echo
            if [ -n "${POLLO_OSOITE:-}" ]; then
              echo "**Workerin osoite:**"
              echo
              echo "\`\`\`"
              echo "$POLLO_OSOITE"
              echo "\`\`\`"
            else
              echo "Osoitetta ei saatu poimittua automaattisesti — se on"
              echo "muotoa \`https://matkakirja-pollo.<tunnuksesi>.workers.dev\`"
              echo "ja näkyy tämän ajon \"Julkaise worker\" -vaiheen lopussa."
            fi
            echo
            echo "**Kerro tämä osoite Fablelle, niin se kytketään peliin.**"
            echo
            echo "- Sallittu origin: \`$POLLO_ORIGINIT\`"
            echo "- Käyttörajojen KV-säilö: käytössä"
            echo "- API-avain: asetettu workerin salaisuudeksi (ei näy missään lokissa)"
            echo "- Kehittäjäkoodi: valinnainen salaisuus \`POLLO_KEHITTAJAKOODI\`"
            echo "  (jos asetettu, sama koodi pelin kehittäjätilassa ohittaa käyttörajat)"
            echo
            echo "Ennen kytkentää pöllönappi näyttää pelissä siistin"
            echo "\"Pöllö ei ole vielä hereillä\" -viestin — mikään ei ole rikki."
          } >> "$GITHUB_STEP_SUMMARY"

      # Väliaikainen asetus ei sisällä salaisuuksia, mutta se ei kuulu
      # myöskään mihinkään pysyvään — poistetaan siltä varalta, että
      # jokin myöhempi vaihe keräisi tiedostoja talteen.
      - name: Siivoa väliaikainen asetus
        if: always()
        run: rm -f tools/pollo/wrangler.ci.json
