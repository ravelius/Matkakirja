name: Vie assetit R2:een

on:
  workflow_dispatch:
    inputs:
      kansio:
        description: 'Yhteensopiva käynnistysvalinta'
        type: choice
        required: true
        default: nostot
        options: [miniatyyrit, elaimet, aarteet, nostot, ihmeet, kaikki]

permissions:
  contents: read

concurrency:
  group: vie-linssi-ikonit
  cancel-in-progress: false

jobs:
  vie:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_supported
      JULKINEN: https://pub-7bc0ed2083a74a68bd7115618bca4709.r2.dev
      LAHDE: review-assets/linssi-ikonit
      KOHDE: kohtaamiset/linssi-ikonit

    steps:
      - uses: actions/checkout@v4

      - name: Tarkista alkuperäiset PNG-kuvat
        run: |
          set -euo pipefail
          [ "$(find "$LAHDE" -maxdepth 1 -type f -name 'linssi-*.png' | wc -l)" -eq 47 ]
          node --input-type=module <<'NODE'
          import { readFileSync, readdirSync } from 'node:fs';
          const root = process.env.LAHDE;
          for (const name of readdirSync(root).filter((name) => name.endsWith('.png'))) {
            const data = readFileSync(`${root}/${name}`);
            if (data.subarray(1, 4).toString() !== 'PNG') throw new Error(`${name}: ei PNG`);
            if (data.readUInt32BE(16) !== 512 || data.readUInt32BE(20) !== 512) {
              throw new Error(`${name}: väärät mitat`);
            }
            if (![4, 6].includes(data[25])) throw new Error(`${name}: alfakanava puuttuu`);
          }
          NODE

      - name: Vie alkuperäiset PNG-kuvat R2:een
        env:
          R2_TILI: ${{ secrets.R2_ACCOUNT_ID }}
          R2_AMPARI: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          for nimi in R2_TILI R2_AMPARI AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            [ -n "${!nimi:-}" ] || { echo "::error::Puuttuva secret: $nimi"; exit 1; }
          done
          aws s3 sync "$LAHDE" "s3://$R2_AMPARI/$KOHDE" \
            --endpoint-url "https://$R2_TILI.r2.cloudflarestorage.com" \
            --exclude '*' --include '*.png' --no-progress --size-only \
            --content-type image/png --cache-control "public, max-age=31536000, immutable"

      - name: Varmista jokainen julkinen kuva
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readdirSync } from 'node:fs';
          const files = readdirSync(process.env.LAHDE).filter((name) => name.endsWith('.png'));
          for (const name of files) {
            const url = `${process.env.JULKINEN}/${process.env.KOHDE}/${encodeURIComponent(name)}`;
            const response = await fetch(url, { headers: { Range: 'bytes=0-32' } });
            if (![200, 206].includes(response.status)) throw new Error(`${name}: HTTP ${response.status}`);
            const type = response.headers.get('content-type') ?? '';
            if (!type.startsWith('image/png')) throw new Error(`${name}: MIME ${type}`);
          }
          console.log(`${files.length} alkuperäistä PNG-kuvaa luettavissa julkisesti.`);
          NODE
