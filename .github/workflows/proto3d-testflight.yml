# Kääntää, allekirjoittaa ja lähettää Unity-prototyypin (proto-3d) TestFlightiin.
#
# Unity-projekti EI ole tässä repossa: /Users/Shared/Claude/proto-3d/Matkakirja-proto
# (oma paikallinen git, ei GitHub-remotea). Siksi tämä ajo tarvitsee itse
# self-hosted Mac -ajurin (Unity + Cesium + IL2CPP ei toimi GitHubin
# macos-latest-ajurilla ilman Unity-asennusta), toisin kuin webkuoren
# ios-testflight.yml, joka kääntyy GitHub-hostatulla ajurilla.
#
# Allekirjoitus samalla App Store Connect -API-avaimella kuin webkuori
# (ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, TEAM_ID — ks. ios-testflight.yml).
# Arvoja ei tulosteta eikä talleteta.
#
# Ajetaan vain käsin (workflow_dispatch), koska Unity-projekti ei ole
# tässä gitissä eikä ajoa voi liipaista PR/push-tapahtumalla.

name: proto-3d TestFlight

on:
  workflow_dispatch:
    inputs:
      vienti_kansio:
        description: 'Unity-viennin kansio Build/-alla (Natiiviseppä ilmoittaa uuden kansion jokaista uutta vientiä varten, esim. testflight, testflight-2)'
        type: string
        default: 'testflight'
      bundle_id:
        description: 'Bundle id — sama App Store -tietue kuin webkuorella (fi.matkakirja.peli), natiivi korvaa kuoren siinä'
        type: string
        default: 'fi.matkakirja.peli'
      versio:
        description: 'Näkyvä versionumero (MARKETING_VERSION) — oltava suurempi kuin webkuoren nykyinen (ios/project.yml, tällä hetkellä 0.3.0)'
        type: string
        default: '1.0.0'
      build_numero:
        description: 'CFBundleVersion — oltava suurempi kuin webkuoren viimeisin ASC-build. Oletus on aikaleima, joka ylittää minkä tahansa pienen juoksevan numeron; vaihda käsin jos tiedät tarkan edellisen buildin.'
        type: string
        default: ''
      testaajan_email:
        description: 'Apple ID lisättäväksi olemassa olevaan sisäiseen TestFlight-testiryhmään (tyhjä = ohita)'
        type: string
        default: 'samireivinen@gmail.com'

permissions:
  contents: read

# Sama Mac ajaa myös savukkeet.yml:n ja Karttasepän polttoja — yksi
# raskas ajo kerrallaan koko koneella (ks. savukkeet.yml:n koko-repon
# jono, PR #2926/#2947). Tämä työnkulku käyttää samaa jonoryhmää, jotta
# Unity-käännös ei ala kesken savukesarjan tai polton.
concurrency:
  group: savukkeet-mac-macilla
  cancel-in-progress: false

jobs:
  vienti_ja_lahetys:
    name: Unity-vienti, arkistointi ja TestFlight-lähetys
    runs-on: [self-hosted, macOS, ARM64, savukkeet]
    timeout-minutes: 45

    env:
      PROJEKTI: /Users/Shared/Claude/proto-3d/Matkakirja-proto

    steps:
      - name: Onko Unity-projekti paikallaan
        run: |
          set -euo pipefail
          if [ ! -d "$PROJEKTI" ]; then
            echo "::error title=Unity-projekti puuttuu::$PROJEKTI ei löydy tältä ajurilta."
            exit 1
          fi

      # Unity-vienti tehdään ERIKSEEN, käsin, Natiivisepän toimesta ennen
      # tätä ajoa (Unity-editori on yhden session hallussa, Library-lukko
      # sallii vain yhden ajajan). Tämä työnkulku ei siis kutsu
      # unity-vahti.sh:aa — se vain olettaa, että Build/testflight/ on jo
      # tuore ja odottaa arkistointia.
      - name: Onko Unity-vienti tuore
        working-directory: ${{ env.PROJEKTI }}
        run: |
          set -euo pipefail
          test -f Build/${{ inputs.vienti_kansio }}/Unity-iPhone.xcodeproj/project.pbxproj
          test -f Build/${{ inputs.vienti_kansio }}/Info.plist

      # Ajon numero (github.run_number) on aina uniikki ja kasvava — App
      # Store Connect hylkää saman versio+build-parin kahdesti. Unity
      # kirjoittaa CFBundleVersion-kentän literaalina exportin aikana,
      # joten xcodebuildin CURRENT_PROJECT_VERSION-lippu (kuten
      # ios-testflight.yml käyttää) ei riitä — asetetaan suoraan Info.plistiin.
      - name: Aseta build-numero
        working-directory: ${{ env.PROJEKTI }}
        run: |
          set -euo pipefail
          build="${{ inputs.build_numero }}"
          if [ -z "$build" ]; then
            # Aikaleima (VVVVKKPPTTMM) ylittää minkä tahansa pienen
            # juoksevan build-numeron, kuten webkuoren aiemmat ASC-buildit.
            build=$(date -u +%Y%m%d%H%M)
          fi
          echo "BUILD_NUMERO=$build" >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $build" Build/${{ inputs.vienti_kansio }}/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ inputs.versio }}" Build/${{ inputs.vienti_kansio }}/Info.plist

      - name: Pura App Store Connect -avain
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          hakemisto="$RUNNER_TEMP/asc"
          mkdir -p "$hakemisto"
          chmod 700 "$hakemisto"
          polku="$hakemisto/AuthKey.p8"
          if printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_KEY_P8" > "$polku"
          else
            printf '%s' "$ASC_KEY_P8" | openssl base64 -d -A -out "$polku"
          fi
          chmod 600 "$polku"
          if ! grep -q "BEGIN PRIVATE KEY" "$polku"; then
            echo "::error title=Avain ei purkautunut::ASC_KEY_P8 ei ole .p8-avain."
            exit 1
          fi
          echo "ASC_AVAIN_POLKU=$polku" >> "$GITHUB_ENV"

      # Diagnoosi ennen arkistointia: kuinka monta Development/Distribution
      # -varmennetta ASC:ssä on jo (kiintiö on rajallinen, ja edellinen ajo
      # saattoi luoda varmenteen väliaikaiseen avainnippuun joka poistettiin
      # ajon lopussa — private key katosi vaikka varmenne jäi ASC:hen).
      - name: Diagnoosi ASC-varmenteista
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --break-system-packages "pyjwt[crypto]==2.9.0"
          python3 - <<'PY'
          import os, time, json, urllib.request, urllib.error
          import jwt
          kid = os.environ['ASC_KEY_ID']; iss = os.environ['ASC_ISSUER_ID']
          avain = open(os.environ['ASC_AVAIN_POLKU']).read()

          def tunnus():
              nyt = int(time.time())
              return jwt.encode({'iss': iss, 'iat': nyt, 'exp': nyt + 600, 'aud': 'appstoreconnect-v1'},
                                 avain, algorithm='ES256', headers={'kid': kid, 'typ': 'JWT'})

          def kutsu(polku):
              req = urllib.request.Request(
                  'https://api.appstoreconnect.apple.com' + polku,
                  headers={'Authorization': 'Bearer ' + tunnus(), 'Accept': 'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=60) as v:
                      return v.status, json.loads(v.read())
              except urllib.error.HTTPError as e:
                  return e.code, json.loads(e.read())

          tila, d = kutsu('/v1/certificates?filter[certificateType]=DEVELOPMENT,IOS_DEVELOPMENT,DISTRIBUTION,IOS_DISTRIBUTION&limit=200')
          if tila != 200:
              print(f'::warning title=Varmenneluettelo epaonnistui::{tila}: {d}')
          else:
              rivit = []
              for c in d.get('data', []):
                  a = c['attributes']
                  rivit.append(f"{a.get('certificateType')}\t{a.get('name')}\t{a.get('expirationDate')}\t{c['id']}")
              print(f'Varmenteita yhteensa: {len(rivit)}')
              for r in rivit:
                  print(r)
          PY

      # Pysyvä avainnippu (ei poisteta ajon lopussa) — vastaa aiemman
      # väliaikaisen avainnipun ongelmaan: pilviallekirjoitus loi
      # Development-varmenteen ajon omaan avainnippuun, joka poistettiin
      # ajon lopussa, joten yksityinen avain katosi vaikka varmenne jäi
      # ASC:hen ("private key not installed in keychain" -virhe). Salasana
      # on oma secret (PROTO3D_KEYCHAIN_PASSWORD), ei repossa.
      #
      # Ajuri toimii käyttäjänä koodaus (HOME=/Users/koodaus) — samassa
      # kotihakemistossa kuin omistajan omat ohjelmat. Siksi avainnippua EI
      # aseteta oletukseksi (se sai Unity Hubin kysymään sen salasanaa) vaan
      # se lisätään vain hakulistan kärkeen ajon ajaksi ja poistetaan
      # listalta lopuksi. Varmenteet luodaan itse ASC-API:lla (seuraava
      # vaihe), joten xcodebuildin ei tarvitse kirjoittaa oletusnippuun.
      - name: Pysyvä avainnippu
        env:
          NIPPU_SALASANA: ${{ secrets.PROTO3D_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          nippu="$HOME/Library/Keychains/matkakirja-testflight.keychain-db"
          if [ ! -f "$nippu" ]; then
            security create-keychain -p "$NIPPU_SALASANA" "$nippu"
          fi
          security set-keychain-settings -lut 21600 "$nippu"
          security unlock-keychain -p "$NIPPU_SALASANA" "$nippu"
          nykyiset=$(security list-keychains -d user | sed 's/"//g' | grep -vF "$nippu" || true)
          security list-keychains -d user -s "$nippu" $nykyiset
          echo "Hakulista ajon ajaksi:"; security list-keychains -d user
          echo "AVAINNIPPU=$nippu" >> "$GITHUB_ENV"

      # Apple WWDR- ja Root-varmenteet (luottamusketju) — ilman näitä
      # "security find-identity -p codesigning" ei tunnista tuotua
      # Distribution-varmennetta kelvolliseksi identiteetiksi, vaikka
      # varmenne ja yksityinen avain olisivatkin avainnipussa pareittain.
      # Idempotentti: security import ei virhein jos varmenne on jo tuotu.
      - name: Apple-luottamusketju avainnippuun
        run: |
          set -euo pipefail
          onnistui=0
          for nimi in AppleWWDRCAG3 AppleWWDRCAG4 AppleWWDRCAG5 AppleWWDRCAG6 AppleRootCA-G2 AppleRootCA-G3; do
            if curl -fSL -o "$RUNNER_TEMP/$nimi.cer" "https://www.apple.com/certificateauthority/$nimi.cer"; then
              onnistui=$((onnistui + 1))
              if ! tulos=$(security import "$RUNNER_TEMP/$nimi.cer" -k "$AVAINNIPPU" 2>&1); then
                case "$tulos" in
                  *"already exists"*) ;;
                  *) echo "::warning title=Luottamusketjun tuonti epaonnistui::$nimi: $tulos" ;;
                esac
              fi
            else
              echo "::warning title=Luottamusketjun lataus epaonnistui::$nimi.cer ei latautunut"
            fi
          done
          echo "Ladattu $onnistui/6 Apple-luottamusketjun varmennetta."

      # Varmistaa, että pysyvässä avainnipussa on kaksi käyttökelpoista
      # identiteettiä (varmenne + yksityinen avain): Development (Unityn
      # pbxproj allekirjoittaa arkiston "iPhone Developer" -identiteetillä)
      # ja Distribution (vienti App Store Connectiin). Identiteetti
      # tunnistetaan varmenteen SHA-1:stä, EI nimestä: ASC:n IOS_DISTRIBUTION
      # näkyy avainnipussa nimellä "iPhone Distribution", joten nimihaku
      # "Apple Distribution" ei koskaan osunut ja jokainen ajo loi uuden
      # varmenteen (23.9.2026). Uusi varmenne luodaan vain, jos yksikään
      # ASC:n varmenne ei pariudu avainnipun avaimeen. Mitään ei peruta
      # automaattisesti. Lokiin vain varmenne-ID:t, ei avaimia.
      - name: Varmista Distribution-identiteetti ja profiili
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          NIPPU_SALASANA: ${{ secrets.PROTO3D_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --break-system-packages "pyjwt[crypto]==2.9.0"
          python3 - <<'PY'
          import os, sys, time, json, base64, hashlib, subprocess, urllib.request, urllib.error
          import jwt

          nippu = os.environ['AVAINNIPPU']
          kid = os.environ['ASC_KEY_ID']; iss = os.environ['ASC_ISSUER_ID']
          avain = open(os.environ['ASC_AVAIN_POLKU']).read()
          team_id = os.environ['TEAM_ID']; bundle_id = os.environ['BUNDLE_ID']
          tmp = os.environ['RUNNER_TEMP']

          def tunnus():
              nyt = int(time.time())
              return jwt.encode({'iss': iss, 'iat': nyt, 'exp': nyt + 600, 'aud': 'appstoreconnect-v1'},
                                 avain, algorithm='ES256', headers={'kid': kid, 'typ': 'JWT'})

          def kutsu(metodi, polku, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(
                  'https://api.appstoreconnect.apple.com' + polku, data=data, method=metodi,
                  headers={'Authorization': 'Bearer ' + tunnus(), 'Accept': 'application/json',
                           'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=60) as v:
                      out = v.read(); return v.status, (json.loads(out) if out else {})
              except urllib.error.HTTPError as e:
                  out = e.read()
                  return e.code, (json.loads(out) if out else {})

          def kelvolliset_sha1():
              # "security find-identity -v" listaa vain identiteetit, joilla
              # on sekä varmenne että yksityinen avain ja voimassa oleva ketju.
              out = subprocess.run(['security', 'find-identity', '-v', '-p', 'codesigning', nippu],
                                   capture_output=True, text=True).stdout
              tulos = set()
              for rivi in out.splitlines():
                  osat = rivi.split()
                  if len(osat) >= 2 and osat[0].endswith(')') and len(osat[1]) == 40:
                      tulos.add(osat[1].upper())
              return tulos

          def sha1(sisalto_b64):
              return hashlib.sha1(base64.b64decode(sisalto_b64)).hexdigest().upper()

          def tuo(polku, kuvaus):
              t = subprocess.run(['security', 'import', polku, '-k', nippu,
                                  '-T', '/usr/bin/codesign', '-T', '/usr/bin/security'],
                                 capture_output=True, text=True)
              if t.returncode != 0 and 'already exists' not in t.stderr:
                  print(f'::error title=security import epaonnistui::{kuvaus}: {t.stderr.strip()}')
                  sys.exit(1)

          def varmista_identiteetti(asc_tyyppi, cn):
              tila, d = kutsu('GET', f'/v1/certificates?filter[certificateType]={asc_tyyppi}&limit=200')
              if tila != 200:
                  print(f'::error title=Varmenneluettelo epaonnistui::{asc_tyyppi} {tila}: {d}')
                  sys.exit(1)
              asc = d.get('data', [])
              # Julkiset varmenteet avainnippuun: jos avain on jo tallessa,
              # macOS parittaa ne identiteetiksi. Tuonti ei muuta ASC:tä.
              for c in asc:
                  polku = f"{tmp}/{c['id']}.cer"
                  with open(polku, 'wb') as f:
                      f.write(base64.b64decode(c['attributes']['certificateContent']))
                  tuo(polku, f"varmenne {c['id']}")
              kelvot = kelvolliset_sha1()
              paritetut = [c['id'] for c in asc if sha1(c['attributes']['certificateContent']) in kelvot]
              print(f"{asc_tyyppi}: ASC:ssa {len(asc)} ({', '.join(c['id'] for c in asc) or '-'}), "
                    f"avainnipussa kaytettavissa {len(paritetut)} ({', '.join(paritetut) or '-'}).")
              if paritetut:
                  return paritetut[0]

              print(f'{asc_tyyppi}: ei kaytettavaa identiteettia — luodaan uusi avainpari ja varmenne.')
              avainpolku = f'{tmp}/{asc_tyyppi}.key'; csrpolku = f'{tmp}/{asc_tyyppi}.csr'
              subprocess.run(['openssl', 'genrsa', '-out', avainpolku, '2048'], check=True, capture_output=True)
              subprocess.run(['openssl', 'req', '-new', '-key', avainpolku, '-out', csrpolku,
                               '-subj', f'/CN={cn}/O={team_id}'], check=True, capture_output=True)
              csr = open(csrpolku).read()
              tuo(avainpolku, f'{asc_tyyppi} yksityinen avain')
              tila, d = kutsu('POST', '/v1/certificates', {
                  'data': {'type': 'certificates',
                           'attributes': {'csrContent': csr, 'certificateType': asc_tyyppi}}
              })
              if tila not in (200, 201):
                  print(f'::error title=Varmenteen luonti epaonnistui ({asc_tyyppi})::{tila}: {d}. '
                        f'ASC:n nykyiset: {[c["id"] for c in asc]} — perumisesta paattaa omistaja.')
                  sys.exit(1)
              uusi = d['data']
              print(f"{asc_tyyppi}: uusi varmenne {uusi['id']} ({uusi['attributes'].get('name')}).")
              polku = f"{tmp}/{uusi['id']}.cer"
              with open(polku, 'wb') as f:
                  f.write(base64.b64decode(uusi['attributes']['certificateContent']))
              tuo(polku, f"uusi varmenne {uusi['id']}")
              if sha1(uusi['attributes']['certificateContent']) not in kelvolliset_sha1():
                  print(f"::error title=Identiteetti ei kelpaa::{uusi['id']} tuotiin, mutta find-identity ei hyvaksy sita "
                        f"(luottamusketju tai avain puuttuu). Ei luoda enempaa.")
                  sys.exit(1)
              return uusi['id']

          varmista_identiteetti('DEVELOPMENT', 'Matkakirja Development')
          cert_id = varmista_identiteetti('IOS_DISTRIBUTION', 'Matkakirja Distribution')

          # Avaimille codesign-oikeus ilman kyselyä (koskee vain jo tuotuja
          # avaimia, siksi vasta tuontien jälkeen).
          t = subprocess.run(['security', 'set-key-partition-list', '-S', 'apple-tool:,apple:,codesign:',
                              '-s', '-k', os.environ['NIPPU_SALASANA'], nippu],
                             capture_output=True, text=True)
          if t.returncode != 0:
              print(f'::error title=set-key-partition-list epaonnistui::{t.stderr.strip()}')
              sys.exit(1)
          print(subprocess.run(['security', 'find-identity', '-v', '-p', 'codesigning', nippu],
                               capture_output=True, text=True).stdout)

          # 2) Onko bundle id:llä App Store -profiilia, joka sisältää tämän varmenteen?
          tila, d = kutsu('GET', f'/v1/bundleIds?filter[identifier]={bundle_id}')
          if tila != 200 or not d.get('data'):
              print(f'::error title=Bundle id puuttuu ASC:sta::{bundle_id} ({tila}: {d})')
              sys.exit(1)
          bundle_resurssi = d['data'][0]['id']

          profiili = None
          tila, d = kutsu('GET', f'/v1/bundleIds/{bundle_resurssi}/profiles')
          for p in d.get('data', []) if tila == 200 else []:
              if p['attributes'].get('profileType') == 'IOS_APP_STORE' and p['attributes'].get('profileState') == 'ACTIVE':
                  tila2, sert = kutsu('GET', f"/v1/profiles/{p['id']}/relationships/certificates")
                  varmenne_idt = [c['id'] for c in sert.get('data', [])] if tila2 == 200 else []
                  if cert_id in varmenne_idt:
                      profiili = p
                      break

          if profiili is None:
              print('Ei käyttökelpoista App Store -profiilia — luodaan uusi.')
              nimi = f'Matkakirja App Store {int(time.time())}'
              tila, d = kutsu('POST', '/v1/profiles', {
                  'data': {
                      'type': 'profiles',
                      'attributes': {'name': nimi, 'profileType': 'IOS_APP_STORE'},
                      'relationships': {
                          'bundleId': {'data': {'type': 'bundleIds', 'id': bundle_resurssi}},
                          'certificates': {'data': [{'type': 'certificates', 'id': cert_id}]},
                      },
                  }
              })
              if tila not in (200, 201):
                  print(f'::error title=Profiilin luonti epaonnistui::{tila}: {d}')
                  sys.exit(1)
              profiili = d['data']
          else:
              print(f"Käytetään olemassa olevaa profiilia: {profiili['attributes']['name']}")

          profiilipolku = f"{tmp}/proto3d.mobileprovision"
          with open(profiilipolku, 'wb') as f:
              f.write(base64.b64decode(profiili['attributes']['profileContent']))
          kohde = os.path.expanduser('~/Library/MobileDevice/Provisioning Profiles')
          os.makedirs(kohde, exist_ok=True)
          uuid_xml = subprocess.run(['security', 'cms', '-D', '-i', profiilipolku], capture_output=True, text=True).stdout
          import plistlib
          profiili_data = plistlib.loads(uuid_xml.encode())
          uuid = profiili_data['UUID']
          import shutil
          shutil.copy(profiilipolku, f'{kohde}/{uuid}.mobileprovision')

          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"DIST_IDENTITEETTI=Apple Distribution\n")
              f.write(f"PROFIILI_NIMI={profiili['attributes']['name']}\n")
          print(f"Profiili asennettu: {profiili['attributes']['name']} (UUID {uuid})")
          PY

      # Arkisto allekirjoitetaan Development-identiteetillä (Unityn pbxproj:
      # CODE_SIGN_IDENTITY="iPhone Developer", Automatic) ja vienti
      # allekirjoittaa sen uudelleen Distributionilla. Komentorivillä EI
      # anneta identiteettiä eikä profiilia: ne koskisivat kaikkia targeteja,
      # ja UnityFramework ei tue profiilia eikä Distribution-identiteettiä
      # Automatic-tilassa (ajot 23.9.2026).
      - name: Arkistoi ja allekirjoita
        working-directory: ${{ env.PROJEKTI }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project Build/${{ inputs.vienti_kansio }}/Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/proto3d.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_AVAIN_POLKU" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            archive

      - name: Vie IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/proto3d.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_AVAIN_POLKU" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ipa=$(find "$RUNNER_TEMP/ipa" -maxdepth 2 -name '*.ipa' | head -1) || true
          if [ -z "$ipa" ]; then
            echo "::error title=IPA puuttuu::Vienti ei tuottanut .ipa-tiedostoa."
            exit 1
          fi
          echo "IPA_POLKU=$ipa" >> "$GITHUB_ENV"

      # xcrun altool on riittävä yhden kerran lähetykseen eikä vaadi
      # erillistä fastlane-projektia proto-3d:hen (se ei ole tässä
      # repossa). App Store Connect -appimerkintä (bundle id, nimi)
      # tehdään ensimmäisellä kerralla käsin developer.apple.com:ssa tai
      # ios/fastlane/Fastfile:n rekisteroi_appi-kaistan tapaan — ei
      # automatisoitu tässä työnkulussa vielä.
      - name: Lähetä TestFlightiin
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$ASC_AVAIN_POLKU" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_POLKU" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      # Lisää testaajan Apple ID:n bundlen sisäiseen (isInternalGroup)
      # testiryhmään, jos se ei jo ole siinä. Ei luo uutta ryhmää eikä
      # uutta appimerkintää — vain liittää olemassa olevaan.
      - name: Lisää testaaja sisäiseen ryhmään
        if: ${{ success() && inputs.testaajan_email != '' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          TESTAAJA: ${{ inputs.testaajan_email }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --break-system-packages "pyjwt[crypto]==2.9.0"
          python3 - <<'PY'
          import os, sys, time, json, urllib.request, urllib.error
          import jwt
          kid = os.environ['ASC_KEY_ID']; iss = os.environ['ASC_ISSUER_ID']
          avain = open(os.environ['ASC_AVAIN_POLKU']).read()
          bundle_id = os.environ['BUNDLE_ID']; email = os.environ['TESTAAJA']

          def tunnus():
              nyt = int(time.time())
              return jwt.encode({'iss': iss, 'iat': nyt, 'exp': nyt + 600, 'aud': 'appstoreconnect-v1'},
                                 avain, algorithm='ES256', headers={'kid': kid, 'typ': 'JWT'})

          def kutsu(metodi, polku, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(
                  'https://api.appstoreconnect.apple.com' + polku, data=data, method=metodi,
                  headers={'Authorization': 'Bearer ' + tunnus(), 'Accept': 'application/json',
                           'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=60) as v:
                      out = v.read(); return v.status, (json.loads(out) if out else {})
              except urllib.error.HTTPError as e:
                  out = e.read()
                  return e.code, (json.loads(out) if out else {})

          tila, d = kutsu('GET', f'/v1/apps?filter[bundleId]={bundle_id}')
          if tila != 200 or not d.get('data'):
              print(f'::warning title=Testaajan lisäys ohitettu::Appia {bundle_id} ei löytynyt ASC:sta ({tila}).')
              sys.exit(0)
          app_id = d['data'][0]['id']

          tila, d = kutsu('GET', f'/v1/apps/{app_id}/betaGroups')
          sisainen = next((g for g in d.get('data', []) if g['attributes'].get('isInternalGroup')), None)
          if tila != 200 or not sisainen:
              print('::warning title=Testaajan lisäys ohitettu::Sisäistä testiryhmää ei löytynyt.')
              sys.exit(0)
          ryhma_id = sisainen['id']

          tila, d = kutsu('GET', f'/v1/betaGroups/{ryhma_id}/betaTesters?filter[email]={email}')
          if tila == 200 and d.get('data'):
              print(f'{email} on jo ryhmässä.')
              sys.exit(0)

          tila, d = kutsu('POST', '/v1/betaTesters', {
              'data': {
                  'type': 'betaTesters',
                  'attributes': {'email': email},
                  'relationships': {'betaGroups': {'data': [{'type': 'betaGroups', 'id': ryhma_id}]}},
              }
          })
          if tila in (200, 201):
              print(f'{email} lisätty sisäiseen testiryhmään.')
          else:
              print(f'::warning title=Testaajan lisäys epäonnistui::{tila}: {d}')
          PY

      - name: Kerro mitä lähti
        if: success()
        run: |
          {
            echo "## proto-3d lähetetty TestFlightiin"
            echo
            echo "- Bundle id: **${{ inputs.bundle_id }}**"
            echo "- Versio: **${{ inputs.versio }}**, build **$BUILD_NUMERO**"
            echo
            echo "Apple käsittelee latauksen omaan tahtiinsa (usein 5–30 min)."
          } >> "$GITHUB_STEP_SUMMARY"

      # Avainnippu ($HOME/Library/Keychains/matkakirja-testflight.keychain-db)
      # on pysyvä eikä sitä poisteta — varmenne ja yksityinen avain
      # säilyvät seuraavaa ajoa varten (ks. "Pysyvä avainnippu" -vaihe).
      - name: Siivoa avaimet
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/asc" "$HOME/.appstoreconnect/private_keys" || true
          rm -f "$RUNNER_TEMP/ExportOptions.plist" "$RUNNER_TEMP"/*.key "$RUNNER_TEMP"/*.csr "$RUNNER_TEMP"/*.cer "$RUNNER_TEMP/proto3d.mobileprovision" || true
          # Testflight-avainnippu pois hakulistalta (tiedosto jää) ja
          # oletusnipuksi login, jos jokin aiempi ajo jätti oletukseksi
          # testflight-nipun — muuten omistajan ohjelmat (Unity Hub)
          # kysyvät sen salasanaa.
          nippu="$HOME/Library/Keychains/matkakirja-testflight.keychain-db"
          jaljelle=$(security list-keychains -d user | sed 's/"//g' | grep -vF "$nippu" || true)
          if [ -n "$jaljelle" ]; then
            security list-keychains -d user -s $jaljelle || echo "::warning::hakulistan palautus epaonnistui"
          fi
          if security default-keychain -d user | grep -qF "$nippu"; then
            security default-keychain -d user -s "$HOME/Library/Keychains/login.keychain-db" || echo "::warning::oletusnipun palautus epaonnistui"
          fi
          echo "Hakulista ajon jälkeen:"; security list-keychains -d user
          echo "Oletusnippu:"; security default-keychain -d user
