<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kokeilu: 3d-tiles-renderer (NASA-AMMOS), XYZ-laatat ellipsoidilla</title>
<!--
  KIRJASTOKOKEILU (Fablemax 6.9.2026). Pelin Web Mercator -laatat
  3d-tiles-rendererin GeneratedSurfacePluginilla (XYZTilesOverlay →
  ellipsoidin pinta) ja TilesFadePluginilla (laattojen häivytys tason
  vaihtuessa). three.js on erillinen kopio (Globe.gl ei vie omaansa),
  joten tämä sivu on ITSENÄINEN three-scene — ei Globe.gl:n sisällä.
  Rajapinta mittarille: window.koe (ks. maplibre.html).
-->
<style>
  html, body { margin: 0; height: 100%; background: #2a1d12; overflow: hidden; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/",
    "3d-tiles-renderer": "https://cdn.jsdelivr.net/npm/3d-tiles-renderer@0.5.2/build/index.js",
    "3d-tiles-renderer/plugins": "https://cdn.jsdelivr.net/npm/3d-tiles-renderer@0.5.2/build/index.plugins.js"
  }
}
</script>
</head>
<body>
<script type="module">
import { Scene, WebGLRenderer, PerspectiveCamera, Vector3, AmbientLight, DirectionalLight } from 'three';
import { TilesRenderer } from '3d-tiles-renderer';
import { TilesFadePlugin, GeneratedSurfacePlugin, XYZTilesOverlay } from '3d-tiles-renderer/plugins';

const haku = new URLSearchParams(location.search);
const LAATAT = haku.get('laatat')
  ?? 'https://media.matkakirja.app/julisteet/pallo/laatat/2026-09-03a-nostot-c/{z}/{x}/{y}.jpg';
const ERROR_TARGET = Number(haku.get('virhe') ?? 2);
const FADE = Number(haku.get('fade') ?? 250);
const R = 6378137;

const renderer = new WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(3, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x2a1d12);
document.body.appendChild(renderer.domElement);
const scene = new Scene();
scene.add(new AmbientLight(0xffffff, 2.5));
const camera = new PerspectiveCamera(50, innerWidth / innerHeight, 1000, 1e8);

const overlay = new XYZTilesOverlay({ url: LAATAT, levels: 9, tileDimension: 256 });
const tiles = new TilesRenderer();
tiles.registerPlugin(new TilesFadePlugin({ fadeDuration: FADE, maximumFadeOutTiles: 200 }));
tiles.registerPlugin(new GeneratedSurfacePlugin({ overlay, shape: 'ellipsoid', applyOverlayTexture: true }));
tiles.lruCache.minSize = 600;
tiles.lruCache.maxSize = 900;
tiles.errorTarget = ERROR_TARGET;
tiles.setCamera(camera);
tiles.group.rotation.x = -Math.PI / 2;
scene.add(tiles.group);
window.tiles = tiles;

let nakyma = { lat: 37.98, lng: 23.73, korkeus: 2.5 };
const asemoi = ({ lat, lng, korkeus }) => {
  nakyma = { lat, lng, korkeus };
  const p = new Vector3();
  tiles.ellipsoid.getCartographicToPosition(lat * Math.PI / 180, lng * Math.PI / 180, korkeus * R, p);
  tiles.group.updateMatrixWorld(true);
  p.applyMatrix4(tiles.group.matrixWorld);
  camera.position.copy(p);
  camera.up.set(0, 1, 0);
  camera.lookAt(0, 0, 0);
  camera.updateMatrixWorld();
};
asemoi(nakyma);

let kehyksia = 0;
let valmisOk;
const valmis = new Promise((ok) => { valmisOk = ok; });
let ajo = null;
const piirra = () => {
  requestAnimationFrame(piirra);
  if (ajo) {
    const t = Math.min(1, (performance.now() - ajo.alku) / ajo.kesto);
    const a = ajo.alusta; const b = ajo.kohde;
    asemoi({
      lat: a.lat + (b.lat - a.lat) * t, lng: a.lng + (b.lng - a.lng) * t,
      korkeus: Math.exp(Math.log(a.korkeus) + (Math.log(b.korkeus) - Math.log(a.korkeus)) * t),
    });
    if (t >= 1) { const ok = ajo.ok; ajo = null; ok(true); }
  }
  camera.updateMatrixWorld();
  tiles.setCamera(camera);
  tiles.setResolutionFromRenderer(camera, renderer);
  tiles.update();
  renderer.render(scene, camera);
  kehyksia += 1;
  if (kehyksia === 30) valmisOk();
};
piirra();

window.koe = {
  nimi: '3d-tiles-renderer', versio: '0.5.2', lisenssi: 'Apache-2.0',
  valmis,
  asetaNakyma: asemoi,
  ajaNakyma(kohde, kesto) {
    return new Promise((ok) => { ajo = { alusta: { ...nakyma }, kohde, kesto, alku: performance.now(), ok }; });
  },
  tila() {
    let laattoja = 0; let nakyvia = 0;
    tiles.group.traverse((o) => { if (o.isMesh) { laattoja += 1; if (o.visible) nakyvia += 1; } });
    return {
      laattoja, nakyvia, ladattu: tiles.stats?.downloaded ?? null, jonossa: tiles.stats?.downloading ?? null,
      korkeus: +nakyma.korkeus.toFixed(3), lat: +nakyma.lat.toFixed(2), lng: +nakyma.lng.toFixed(2),
      drawCalls: renderer.info.render.calls, tekstuurit: renderer.info.memory.textures,
    };
  },
};
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
</body>
</html>
